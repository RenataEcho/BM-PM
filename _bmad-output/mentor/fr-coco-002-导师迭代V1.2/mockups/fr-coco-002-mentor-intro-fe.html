<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导师个人介绍</title><style>
:root{--primary:#ff4d22;--primary-hover:#ff6c46}*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#252836;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #ff4d22;outline-offset:3px}.phone{max-width:390px;min-height:780px;margin:20px auto;background:#f6f7fb;border:1px solid #eceef3;border-radius:28px;overflow:hidden;position:relative}.status{padding:17px 24px 8px;display:flex;justify-content:space-between;font-size:12px;font-weight:600;background:white}.nav{height:56px;background:white;display:grid;grid-template-columns:60px 1fr 60px;align-items:center;text-align:center}.nav h1{font-size:18px;margin:0}.back{border:0;background:none;font-size:26px;color:#252836}.content{padding:20px 16px 110px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 3px 10px rgba(45,55,85,.025)}.row{padding:20px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:66px}.row+.row{border-top:1px solid #eceef3}.row span:first-child{font-size:14px;font-weight:600}.value{font-size:14px}.avatar{width:54px;height:54px;border-radius:50%;background:#fff1ec;color:#ff4d22;display:grid;place-items:center;font-size:22px;font-weight:700}.entry{width:100%;border:0;background:white;text-align:left;color:inherit}.arrow{color:#9498a8}.disabled{background:#f6f7fb;color:#9498a8;border:1px solid #eceef3;border-radius:8px;padding:10px 14px;font-size:14px;width:150px}.help{font-size:12px;line-height:1.7;color:#9498a8;margin:12px 2px 24px}.section-title{font-size:15px;margin:26px 0 12px}.editor{padding:16px}textarea{width:100%;height:190px;resize:vertical;border:0;background:transparent;line-height:1.8;font-size:14px;color:#252836;display:block}textarea:focus{outline-offset:6px}textarea::placeholder{color:#9aa0ad}.footer{position:absolute;bottom:0;padding:16px 20px 28px;background:white;width:100%;border-top:1px solid #eceef3}.btn{border:0;border-radius:8px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover:not(:disabled){background:var(--primary-hover)}.footer .btn{width:100%;min-height:48px}.btn-ghost{background:#fff1ec;color:#ff4d22;margin-top:16px;width:100%}.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:#252836;color:white;padding:12px 20px;border-radius:8px;font-size:13px;z-index:5;white-space:nowrap}.preview{padding:24px}.preview h2{font-size:18px}.tag{font-size:12px;color:#ff4d22;background:#fff1ec;padding:5px 9px;border-radius:8px}.bio{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.9}.demo-note{max-width:390px;margin:0 auto 24px;color:#9498a8;font-size:12px;line-height:1.7;padding:0 12px}[hidden]{display:none!important}@media(max-width:430px){.phone{margin:0;min-height:100dvh;border:0;border-radius:0;max-width:none}.demo-note{padding:16px}}
</style></head><body><main class="phone"><div class="status"><span>9:41</span><span aria-label="信号与电池">▮▮▮ · 100%</span></div><header class="nav"><button class="back" id="back" aria-label="返回">‹</button><h1 id="title">个人介绍</h1><span></span></header>
<section id="personal" class="content" hidden><div class="card"><div class="row"><span>头像</span><div class="avatar">暴</div></div><div class="row"><span>导师名称</span><span class="value">别暴躁</span></div><button class="row entry" id="openEditor"><span>个人介绍</span><span class="arrow">编辑 ›</span></button></div></section>
<section id="editor" class="content"><div class="card"><div class="row"><span>头像</span><div class="avatar" role="img" aria-label="导师头像：暴">暴</div></div><div class="row"><span>导师名称</span><span class="value">别暴躁</span></div><div class="row"><label for="identity">当前身份</label><input class="disabled" id="identity" value="创业导师" disabled></div></div><p class="help">当前身份由后台配置，不支持修改</p><h2 class="section-title"><label for="intro">个人介绍</label></h2><div class="card editor"><textarea id="intro" placeholder="请输入个人介绍"></textarea></div><p class="help">介绍将展示在社群页的导师介绍中</p></section>
<section id="preview" class="content" hidden><div class="card preview"><div class="avatar">暴</div><h2>别暴躁</h2><span class="tag">创业导师</span><h3 class="section-title">导师介绍</h3><p id="previewText" class="bio"></p></div></section>
<div class="footer" id="saveBar"><button class="btn btn-primary" id="save">保存</button></div></main><p class="demo-note">[待确认] 头像、导师名称暂仅展示；保存方式暂用按钮演示，介绍必填与字数限制待确认。数据仅在当前页面演示，刷新后恢复。</p><div class="toast" id="toast" role="status" hidden></div>
<script>
let saved='主要负责项目方向判断、关键规则解读与运营策略指导。希望通过实操经验，帮助社群成员理解项目规则、梳理执行思路，一起解决参与过程中遇到的问题。';
const intro=document.getElementById('intro');intro.value=saved;let current='editor';let timer;
function show(page){current=page;['editor','personal','preview'].forEach(id=>document.getElementById(id).hidden=id!==page);document.getElementById('title').textContent={editor:'个人介绍',personal:'个人信息',preview:'社群展示预览'}[page];document.getElementById('saveBar').hidden=page!=='editor';if(page==='preview')document.getElementById('previewText').textContent=saved||'暂无介绍';}
document.getElementById('openEditor').onclick=()=>{intro.value=saved;show('editor')};document.getElementById('back').onclick=()=>{intro.value=saved;show('personal')};document.getElementById('save').onclick=()=>{saved=intro.value;const toast=document.getElementById('toast');toast.textContent='保存成功';toast.hidden=false;clearTimeout(timer);timer=setTimeout(()=>toast.hidden=true,2200)};
if(new URLSearchParams(location.search).get('screen')==='personal')show('personal');
</script></body></html>
