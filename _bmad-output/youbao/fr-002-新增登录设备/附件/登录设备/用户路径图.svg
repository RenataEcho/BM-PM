<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#9298a6"/></marker></defs><rect width="1000" height="1110" fill="#f6f7fb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle" fill="#303544"><text x="500" y="43" font-size="23" font-weight="600">登录设备 · 用户路径</text><text x="500" y="72" font-size="14" fill="#777e8b">App／小程序发起管理 · PC 支持被强制下线</text><rect x="340" y="100" width="320" height="60" rx="12" fill="#fff" stroke="#d9dce7"/><text x="500.0" y="135.0" font-size="14">App／小程序：设置 → 登录设备</text><rect x="340" y="195" width="320" height="80" rx="12" fill="#fff" stroke="#d9dce7"/><text x="500.0" y="229.0" font-size="14">顶部安全提示</text><text x="500.0" y="251.0" font-size="14">本机置顶＋历史登录设备</text><polyline points="500,160 500,195" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/><rect x="340" y="315" width="320" height="60" rx="12" fill="#fff" stroke="#d9dce7"/><text x="500.0" y="350.0" font-size="14">选择其他记录，点击「下线」</text><polyline points="500,275 500,315" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/><rect x="340" y="415" width="320" height="75" rx="12" fill="#fff" stroke="#d9dce7"/><text x="500.0" y="446.5" font-size="14">二次确认</text><text x="500.0" y="468.5" font-size="14">提示目标设备将退出当前账号</text><polyline points="500,375 500,415" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/><rect x="745" y="420" width="210" height="65" rx="12" fill="#fff" stroke="#d9dce7"/><text x="850.0" y="446.5" font-size="14">取消：关闭弹窗</text><text x="850.0" y="468.5" font-size="14">记录及登录状态不变</text><polyline points="660,452 745,452" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/><text x="700" y="440" font-size="13" fill="#777e8b">取消</text><rect x="340" y="535" width="320" height="65" rx="12" fill="#fff" stroke="#d9dce7"/><text x="500.0" y="561.5" font-size="14">请求服务端撤销目标记录</text><text x="500.0" y="583.5" font-size="14">关联的全部有效凭证</text><polyline points="500,490 500,535" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/><text x="545" y="519" font-size="13" fill="#777e8b">确认下线</text><polygon points="500,635 615,690 500,745 385,690" fill="#fef3c7" stroke="#cab7ee"/><text x="500" y="695" font-size="15">成功或已下线？</text><polyline points="500,600 500,635" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/><rect x="45" y="655" width="230" height="70" rx="12" fill="#fff" stroke="#d9dce7"/><text x="160.0" y="684.0" font-size="14">保留记录，提示重试</text><text x="160.0" y="706.0" font-size="14">返回列表后可重试</text><polyline points="385,690 275,690" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/><text x="328" y="678" font-size="13" fill="#777e8b">否</text><rect x="340" y="790" width="320" height="65" rx="12" fill="#fff" stroke="#d9dce7"/><text x="500.0" y="816.5" font-size="14">清除该条设备记录</text><text x="500.0" y="838.5" font-size="14">无其他记录时展示空态</text><polyline points="500,745 500,790" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/><text x="520" y="770" font-size="13" fill="#777e8b">是</text><rect x="340" y="900" width="320" height="80" rx="12" fill="#fff" stroke="#d9dce7"/><text x="500.0" y="923.0" font-size="14">目标端登录态失效</text><text x="500.0" y="945.0" font-size="14">收到通知／下次请求发现失效</text><text x="500.0" y="967.0" font-size="14">提示重新登录</text><polyline points="500,855 500,900" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/><rect x="340" y="1020" width="320" height="60" rx="12" fill="#fff" stroke="#d9dce7"/><text x="500.0" y="1044.0" font-size="14">重新验证登录成功</text><text x="500.0" y="1066.0" font-size="14">按同账号＋同设备＋同端更新记录</text><polyline points="500,980 500,1020" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/><rect x="710" y="800" width="250" height="110" rx="12" fill="#f0f7f4" stroke="#d9dce7"/><text x="835.0" y="838.0" font-size="14">仅影响选中记录</text><text x="835.0" y="860.0" font-size="14">发起端及其他记录继续可用</text><text x="835.0" y="882.0" font-size="14">App／小程序／PC 可同时登录</text><polyline points="160,655 160,295 420,295 420,315" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a)"/><polyline points="850,420 850,295 580,295 580,315" fill="none" stroke="#9298a6" stroke-width="1.6" marker-end="url(#a)"/></g></svg>