<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新增登录设备 · 手机原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:#202127;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}header{background:#fff;border-bottom:1px solid #e2e4e9;padding:22px 36px;display:flex;align-items:center;justify-content:space-between}h1{font-size:21px;margin:0 0 7px}header p{margin:0;color:#82858f;font-size:13px}.badge{border:1px solid #e0d4f7;color:#7950b8;background:#f8f4ff;border-radius:6px;padding:7px 12px}main{max-width:1170px;margin:28px auto;padding:0 24px}.intro{display:flex;align-items:center;justify-content:space-between;margin-bottom:23px}.intro p{color:#747987;margin:7px 0}.reset{border:1px solid #d6d9e1;background:white;padding:9px 15px;border-radius:8px}.layout{display:grid;grid-template-columns:1fr 1fr 255px;gap:28px;align-items:start}.label{font-size:13px;margin:0 0 12px;color:#666c79}.phone{height:790px;max-width:390px;background:#f7f7f5;border:7px solid #24262d;border-radius:42px;overflow:hidden;box-shadow:0 16px 35px #28304812;position:relative}.status{height:41px;padding:10px 22px 0;display:flex;justify-content:space-between;font-weight:600;font-size:12px}.nav{height:54px;display:flex;align-items:center;justify-content:center;position:relative;font-size:18px;font-weight:600}.back{position:absolute;left:12px;border:0;background:transparent;font-size:29px;font-weight:300;padding:0 8px;line-height:35px}.capsule{position:absolute;right:9px;border:1px solid #e2e3e5;background:#ffffff90;border-radius:20px;font-size:15px;letter-spacing:3px;padding:3px 8px;font-weight:500}.content{padding:15px 13px}.group{background:#fff;border-radius:14px;overflow:hidden}.row{width:100%;border:0;background:white;text-align:left;min-height:47px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:16px;color:#222}.row i{font-style:normal;color:#a2a4ab;font-size:23px}.row small{font-size:13px;color:#999;margin-left:auto;padding-right:8px}.action{width:100%;border:0;background:#fff;border-radius:14px;margin-top:13px;height:53px;color:#ff4545;font-size:16px}.row:focus-visible,.row:hover{background:#fff1ec}.hint{margin:13px 5px;color:#92949b;font-size:11px;line-height:1.7}.section{font-size:12px;color:#8d919b;margin:2px 4px 9px}.device{background:white;border-radius:14px;padding:12px 12px;display:flex;gap:10px}.icon{flex:0 0 36px;width:36px;height:40px;border-radius:11px;background:#fff1ec;display:flex;align-items:center;justify-content:center;color:#ff4d22}.icon svg{width:23px;height:27px;fill:none;stroke:currentColor;stroke-width:2}.details{min-width:0;flex:1}.name{font-size:14px;font-weight:600;display:flex;gap:7px;align-items:center;margin:0 0 6px}.tag{font-size:10px;font-weight:500;color:#ef8a36;background:#fff1e5;border-radius:4px;padding:3px 6px}.info{font-size:12px;color:#92959d;line-height:1.55;display:grid;grid-template-columns:58px 1fr;gap:2px}.id{overflow-wrap:anywhere}.history{margin-top:16px}.history-list{background:white;border-radius:14px;overflow:hidden}.history-list .device{border-radius:0}.line{height:1px;background:#eff0f2;margin-left:58px;margin-right:12px}.notice{font-size:12px;color:#92959d;line-height:1.8;padding:13px 4px}.homebar{position:absolute;bottom:8px;width:113px;height:4px;border-radius:5px;background:#24262d;left:50%;transform:translateX(-50%)}aside{background:#fff;border:1px solid #e1e4eb;border-radius:14px;padding:21px;margin-top:29px}aside h2{font-size:15px;margin:0 0 19px}aside p{font-size:13px;line-height:1.85;color:#737986;margin:0 0 18px}aside b{color:#373c46;font-weight:600}.step{display:inline-flex;width:20px;height:20px;background:#f0e8fc;color:#8b58c9;border-radius:50%;align-items:center;justify-content:center;margin-right:6px;font-size:11px}.pending{border-top:1px solid #eceef2;padding-top:17px;color:#999;font-size:12px}.toast{position:absolute;bottom:45px;background:#333d;color:#fff;padding:10px 14px;border-radius:8px;left:50%;transform:translateX(-50%);white-space:nowrap;display:none;font-size:12px}@media(max-width:1000px){.layout{grid-template-columns:1fr 1fr}aside{grid-column:1/-1;margin:0}.phone{margin:auto}.label{text-align:center}}@media(max-width:650px){header{padding:20px}.layout{grid-template-columns:1fr}.intro{align-items:start;gap:16px}main{padding:0 15px}.phone{width:100%}.badge{white-space:nowrap}aside{grid-column:auto}}
.kick{margin-left:auto;flex-shrink:0;border:1px solid #e0dede;background:#fff;color:#ce5752;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:400}.kick:disabled{color:#999;background:#f5f5f5;border-color:#eee;cursor:default}.mask{position:absolute;inset:0;background:#0006;z-index:5;display:flex;align-items:center;justify-content:center;padding:25px}.dialog{background:white;border-radius:15px;padding:24px 20px 15px;width:100%;text-align:center;box-shadow:0 12px 30px #0002}.dialog h3{font-size:17px;margin:0 0 13px}.dialog p{font-size:13px;line-height:1.8;color:#82858f;overflow-wrap:anywhere}.dialog footer{display:flex;gap:10px;margin-top:23px}.dialog button{width:50%;padding:10px;border:0;border-radius:8px;background:#f1f2f4}.dialog .confirm{background:#ff4d22;color:white}.top-notice{background:#fff2ee;color:#ba6657;border-radius:10px;padding:9px 12px;margin:0 0 12px}.empty{padding:27px 12px;text-align:center;color:#989ba4;font-size:13px}body{background:#f6f7fb}.phone{width:375px;height:770px;margin:auto;border:0;border-radius:24px;box-shadow:none;overflow:auto;padding-bottom:22px}.homebar{display:none}.content{padding-top:8px}.dialog{position:relative}.mask{position:fixed}.icon{color:#ff4d22;background:#fff1ec}</style><div class="phone"><div class="status"><span>9:41</span><span>▮▮▮　◒　▰</span></div><div id="interactive"></div><div class="toast" id="toast"></div></div><template id="settings"><div class="nav"><button class="back" onclick="notify()" aria-label="返回">‹</button>设置<span class="capsule">•••│⊙</span></div><div class="content"><div class="group"><button class="row" onclick="notify()">个人信息<i>›</i></button><button class="row" onclick="notify()">微信公众号<small>更多教程/推送</small><i>›</i></button><button class="row" onclick="notify()">关于我们<i>›</i></button><button class="row" onclick="notify()">投诉与建议<i>›</i></button><button class="row" onclick="notify()">注销账号<i>›</i></button><button class="row" onclick="showDevices()">登录设备<i>›</i></button></div><button class="action" onclick="notify()">切换账号</button><button class="action" onclick="notify()">退出登录</button></div></template><script>
const icon='<div class="icon"><svg viewBox="0 0 24 30" aria-hidden="true"><rect x="5" y="2" width="14" height="25" rx="1.5"/><path d="M10 23h4"/></svg></div>';
function device(name,id,time,current=false,model=''){return '<div class="device">'+icon+'<div class="details"><div class="name">'+name+(current?'<span class="tag">本机</span>':'<button class="kick" onclick="askKick(this)">下线</button>')+'</div><div class="info">'+(model?'<span>设备型号</span><span>'+model+'</span>':'')+'<span>设备 ID</span><span class="id">'+id+'</span><span>登录时间</span><span>'+time+'</span></div></div></div>'}
function devices(interactive){return '<div class="nav"><button class="back" '+(interactive?'onclick="showSettings()"':'onclick="showSettings()"')+' aria-label="返回设置">‹</button>登录设备<span class="capsule">•••│⊙</span></div><div class="content"><div class="notice top-notice">安全提示：发现非本人设备，可点击「下线」，该设备将被强制退出登录。</div><div class="section">当前登录设备</div>'+device('右豹 App · iOS','de104209-0015-4a3e-bb97-65e8b0ca9fb0','2026-10-22 09:30:18',true,'iPhone 16 Pro')+'<div class="section history">历史登录设备</div><div class="history-list">'+device('右豹网页版 · PC','54180da2-4afb-4c48-b08c-bfca9647cf0f','2026-10-20 18:40:27',false,'Windows · Chrome')+'<div class="line"></div>'+device('右豹 App · 安卓','a1715b17-be2a-4618-b703-4b5405423bb8','2026-10-18 16:35:49',false,'小米 15')+'<div class="line"></div>'+device('右豹小程序','f382a418-725d-468b-a913-73cf0267a582','2026-10-17 10:20:36',false,'iPhone 15')+'</div></div>'}
function askKick(button){
 const phone=button.closest('.phone');
 const name=button.closest('.name').firstChild.textContent;
 const mask=document.createElement('div');mask.className='mask';
 const box=document.createElement('div');box.className='dialog';
 const title=document.createElement('h3');title.textContent='确认下线该设备？';
 const description=document.createElement('p');description.textContent='下线后，'+name+' 将被强制退出当前账号，需要重新登录才能使用。';
 const footer=document.createElement('footer');
 const cancel=document.createElement('button');cancel.textContent='取消';cancel.onclick=()=>mask.remove();
 const confirm=document.createElement('button');confirm.className='confirm';confirm.textContent='确认下线';confirm.onclick=()=>{if(mode==='failure'){mask.remove();const t=phone.querySelector('.toast');t.textContent='下线失败，请重试';t.style.display='block';setTimeout(()=>t.style.display='none',2000);return;}const row=button.closest('.device');const list=row.parentElement;const divider=row.nextElementSibling?.classList.contains('line')?row.nextElementSibling:row.previousElementSibling?.classList.contains('line')?row.previousElementSibling:null;if(divider)divider.remove();row.remove();if(!list.querySelector('.device'))list.innerHTML='<div class="empty">暂无其他登录设备</div>';mask.remove()};
 footer.append(cancel,confirm);box.append(title,description,footer);mask.append(box);phone.append(mask);
}
function showSettings(){document.getElementById('interactive').innerHTML=document.getElementById('settings').innerHTML}
function showDevices(){document.getElementById('interactive').innerHTML=devices(true)}
function notify(){let t=document.getElementById('toast');t.style.display='block';setTimeout(()=>t.style.display='none',1800)}


const mode=new URLSearchParams(location.search).get('screen')||'settings';
if(mode==='settings')showSettings();else showDevices();
if(mode==='mini')document.querySelector('.name').firstChild.textContent='右豹小程序';
if(mode==='empty')document.querySelector('.history-list').innerHTML='<div class="empty">暂无其他登录设备</div>';
if(mode==='invalid')document.getElementById('interactive').innerHTML='<div class="nav">登录已失效</div><div class="content"><p class="notice">当前登录已被下线，请重新登录</p><button class="action" onclick="showSettings()">重新登录（演示）</button></div>';
</script></html>
