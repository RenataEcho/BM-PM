<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>AI申词 · 右豹</title>
  <style>
    :root {
      --brand: #ff4d22;
      --brand2: #ff6c46;
      --ink: #252836;
      --sub: #9498a8;
      --line: #eceef3;
      --bg: #f6f7fb;
      --green: #16834a;
      --red: #d92d4a;
      --soft: #fff1ec;
      --chip-bg: #fff5f1;
      --chip-border: #ffe5dc;
      --chip-text: #f06446;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      width: 100%; max-width: 375px; margin: 0 auto;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      background: var(--bg);
    }
    .phone { width: 100%; height: 100dvh; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .status {
      height: 28px; flex-shrink: 0; padding: 6px 16px 0; display: flex; justify-content: space-between; align-items: center;
      background: #fff; font-size: 12px; font-weight: 650;
    }
    .status-icons { display: flex; align-items: center; gap: 5px; }
    .topbar {
      height: 54px; flex-shrink: 0; background: #fff; display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; border-bottom: 1px solid #f1f1f5;
    }
    .top-title { font-size: 17px; font-weight: 700; letter-spacing: .2px; }
    .record-link { color: var(--brand); font-weight: 600; font-size: 13px; cursor: pointer; background: none; border: 0; padding: 0; }
    .main { flex: 1; min-height: 0; overflow: auto; padding: 16px 16px 12px; }
    .page-records { display: none; }
    .page-records.show { display: block; }
    .page-home.hide { display: none; }
    .section { margin-bottom: 16px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; gap: 8px; }
    .section-title { font-size: 15px; font-weight: 750; }
    .section-note { font-size: 12px; color: var(--sub); }
    .project-trigger {
      width: 100%; min-height: 64px; border: 1px solid var(--line); background: #fff; border-radius: 13px;
      display: flex; align-items: center; gap: 11px; padding: 10px 13px; cursor: pointer; color: var(--ink); font: inherit; text-align: left;
    }
    .p-icon {
      width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; display: grid; place-items: center;
      font-size: 16px; font-weight: 800; color: #fff; background: var(--brand);
    }
    .p-icon.alt { background: var(--brand2); }
    .project-trigger-copy { min-width: 0; flex: 1; }
    .project-trigger-label { color: var(--sub); font-size: 11px; margin-bottom: 3px; }
    .project-trigger-name { font-size: 14px; font-weight: 750; }
    .project-arrow { color: #a1a5b5; font-size: 20px; }
    .panel { background: #fff; border: 1px solid #eff0f6; border-radius: 15px; padding: 14px; margin-bottom: 12px; }
    .field-label { font-weight: 650; font-size: 13px; margin-bottom: 9px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .field-label small { font-weight: 400; color: var(--sub); }
    input { font: inherit; color: var(--ink); outline: none; }
    .id-input { width: 100%; border: 1px solid #e6e8f1; border-radius: 10px; padding: 11px 12px; background: #fcfcfe; min-height: 43px; }
    .id-input:focus, .qty-input:focus { border-color: var(--brand2); box-shadow: 0 0 0 3px var(--soft); }
    .id-rows { display: flex; flex-direction: column; gap: 10px; }
    .id-row-wrap { min-width: 0; flex: 1; }
    .id-row { display: flex; align-items: flex-start; gap: 8px; }
    .id-row .id-input { flex: 1; min-width: 0; }
    .id-row-actions { display: flex; align-items: flex-start; gap: 6px; flex-shrink: 0; }
    .row-remove {
      width: 42px; height: 43px; flex-shrink: 0; border: 1px solid #e6e8f1; border-radius: 10px;
      background: #fff; color: #8e92a5; font-size: 18px; cursor: pointer;
    }
    .id-field-label { align-items: center; }
    .id-header-actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .row-add {
      height: 30px; min-width: 52px; padding: 0 10px; border: 1px solid var(--brand); border-radius: 8px;
      background: #fff; color: var(--brand); font: inherit; font-size: 11px; font-weight: 750; cursor: pointer;
    }
    .row-status { min-height: 18px; padding-top: 4px; font-size: 11px; color: #888da1; }
    .row-status.success { color: var(--green); }
    .row-status.fail, .row-error { color: var(--red); }
    .manual-action {
      height: 30px; padding: 0 11px; border-radius: 8px; font: inherit; font-size: 11px; font-weight: 750; cursor: pointer;
    }
    .extract-books { border: 0; background: var(--brand); color: #fff; }
    .extract-books:disabled { opacity: .42; cursor: not-allowed; }
    .hint { font-size: 11px; color: #969aae; margin-top: 7px; line-height: 1.5; }
    .book-card { display: flex; gap: 11px; padding: 12px; border: 1px solid #eceef5; border-radius: 12px; background: #fff; margin-top: 10px; }
    .cover {
      width: 62px; height: 82px; flex-shrink: 0; border-radius: 7px;
      background: linear-gradient(155deg, #ffc7b0, #ff4d22);
      display: flex; align-items: center; justify-content: center; color: #fff; text-align: center;
      font-weight: 800; font-size: 13px; line-height: 1.4; box-shadow: 0 3px 9px rgba(255, 77, 34, .18);
    }
    .cover.soft { background: linear-gradient(155deg, #ffd8c8, #ff6c46); }
    .cover.deep { background: linear-gradient(155deg, #ffb39a, #f06446); }
    .book-body { min-width: 0; flex: 1; }
    .book-title { font-weight: 750; font-size: 14px; margin: 1px 0 5px; }
    .inline-book-detail, .inline-retry { border: 0; background: transparent; padding: 0; font: inherit; font-size: 11px; font-weight: 750; cursor: pointer; }
    .inline-book-detail { color: var(--brand); }
    .inline-retry { color: var(--red); margin-left: 8px; text-decoration: underline; text-underline-offset: 2px; }
    .book-id-line { display: flex; align-items: center; gap: 7px; font-size: 11px; margin-top: 2px; color: #8b8fa2; }
    .book-id-line b { font-size: 12px; font-weight: 650; color: #555a70; letter-spacing: .2px; }
    .book-link { color: var(--brand); font-size: 11px; margin-top: 6px; display: inline-block; text-decoration: none; }
    .book-remove { border: 0; background: transparent; color: #a0a3b4; padding: 0 0 0 4px; align-self: flex-start; font-size: 18px; cursor: pointer; }
    .invalid { font-size: 11px; color: var(--red); margin-top: 6px; }
    .word-panel { padding: 14px; }
    .word-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; }
    .word-count { font-size: 11px; color: #8b8fa2; }
    .word-book { padding: 12px 0; border-top: 1px solid #f0f1f6; }
    .word-book:first-of-type { border-top: 0; padding-top: 0; }
    .word-book-title { font-size: 12px; font-weight: 700; margin-bottom: 9px; display: flex; justify-content: space-between; gap: 8px; }
    .word-list { display: flex; gap: 7px; flex-wrap: wrap; }
    .word { background: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--chip-text); border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.2; }
    .word.pending { color: #9a9daf; background: #f7f8fb; border-style: dashed; border-color: #e7e8f0; }
    .feedback { font-size: 12px; font-weight: 650; margin: 10px 0 0; padding: 9px 10px; border-radius: 9px; background: var(--soft); color: var(--brand); }
    .feedback.success { background: #eefaf3; color: var(--green); }
    .feedback.fail { background: #fff1f3; color: var(--red); }
    .footer {
      flex-shrink: 0; background: rgba(255, 255, 255, .97); padding: 10px 16px 13px;
      border-top: 1px solid #eaebf2; box-shadow: 0 -7px 24px rgba(27, 35, 80, .03);
    }
    .usage-note { min-height: 18px; margin-bottom: 7px; color: #7f8497; font-size: 10px; line-height: 1.45; text-align: center; }
    .usage-note strong { color: var(--brand); font-weight: 750; }
    .btn {
      border: 0; border-radius: 12px; height: 46px; font: inherit; font-weight: 750; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:disabled { opacity: .42; cursor: not-allowed; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--brand2); }
    .btn-secondary { background: #fff; border: 1px solid var(--brand); color: var(--brand); }
    .btn .mini { font-size: 15px; }
    .record-back { display: flex; align-items: center; gap: 7px; color: var(--brand); font-weight: 650; cursor: pointer; margin-bottom: 17px; background: none; border: 0; padding: 0; font: inherit; }
    .record-item { background: #fff; border: 1px solid #eff0f6; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 3px 12px rgba(32, 35, 58, .02); }
    .record-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .record-project { font-weight: 750; font-size: 14px; }
    .record-time { font-size: 11px; color: #999daf; white-space: nowrap; padding-top: 2px; }
    .record-meta { display: flex; align-items: center; gap: 7px; margin-top: 7px; flex-wrap: wrap; }
    .record-type { display: inline-flex; align-items: center; background: var(--soft); color: var(--brand); border-radius: 6px; padding: 4px 7px; font-size: 10px; font-weight: 650; }
    .record-status { font-size: 11px; font-weight: 650; border-radius: 6px; padding: 4px 7px; background: #eefaf3; color: var(--green); }
    .record-status.fail { background: #fff1f3; color: var(--red); }
    .record-book { border-top: 1px solid #f0f1f6; padding-top: 11px; margin-top: 11px; }
    .record-book-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 9px; }
    .record-book-name { font-size: 12px; font-weight: 750; line-height: 1.5; }
    .record-book-id { font-size: 10px; color: #8b8fa2; margin-top: 3px; }
    .record-count { font-size: 11px; color: #666b80; white-space: nowrap; }
    .record-result-label { font-size: 11px; color: #8b8fa2; margin-bottom: 7px; }
    .record-words { display: flex; flex-wrap: wrap; gap: 6px; }
    .record-word { background: var(--chip-bg); border: 1px solid var(--chip-border); color: var(--chip-text); border-radius: 7px; padding: 6px 8px; font-size: 11px; line-height: 1.3; }
    .record-submit-result { font-size: 12px; line-height: 1.5; color: #666b80; background: #f8f9fc; border-radius: 8px; padding: 9px 10px; }
    .empty { text-align: center; padding: 76px 20px; color: #9296a8; font-size: 13px; }
    .empty-icon { font-size: 34px; margin-bottom: 12px; color: var(--brand); }
    .toast {
      position: absolute; z-index: 10; top: 48px; left: 50%; transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
      background: #292b3d; color: #fff; padding: 10px 17px; border-radius: 22px; font-size: 12px; transition: .22s; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .demo-tag { display: inline-flex; align-items: center; background: #f0f1f8; color: #85899d; padding: 3px 6px; border-radius: 5px; font-size: 10px; font-weight: 500; }
    .loading-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin: 0 2px; animation: pulse .7s infinite alternate; }
    @keyframes pulse { to { opacity: .25; transform: translateY(-2px); } }
    .quantity-panel { padding: 12px 14px; margin-top: 10px; margin-bottom: 10px; }
    .quantity-panel .qty-input {
      display: block; width: 100%; height: 43px; min-height: 43px; padding: 11px 12px; text-align: left;
      border: 1px solid #e6e8f1; border-radius: 10px; background: #fcfcfe; font-size: 14px; font-weight: 400; color: var(--ink);
      appearance: textfield; -moz-appearance: textfield;
    }
    .quantity-panel .qty-input::-webkit-inner-spin-button,
    .quantity-panel .qty-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.4); z-index:600; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .22s; }
    .modal-overlay.open { opacity:1; pointer-events:auto; }
    .modal { width:100%; max-width:400px; background:#fff; border-radius:14px; box-shadow:0 16px 48px rgba(30,40,60,.14); padding:20px; }
    .modal h2 { font-size:17px; margin:0 0 18px; }
    .modal select { width:100%; padding:12px; margin:10px 0 20px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; }
    .detail-modal { max-height: calc(100dvh - 40px); overflow: auto; }
    .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .detail-head h2 { margin: 0; }
    .detail-close { border: 0; background: #f4f5f9; color: #777c90; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    .detail-cover { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
    .detail-cover .cover { width: 74px; height: 98px; }
    .detail-meta { min-width: 0; flex: 1; }
    .detail-label { color: #9296a8; font-size: 11px; margin-bottom: 5px; }
    .detail-value { font-size: 13px; line-height: 1.6; word-break: break-all; }
    .detail-intro { background: #f8f9fc; border-radius: 10px; padding: 12px; margin-bottom: 16px; }
    .book-detail-overlay { position: absolute; align-items: flex-end; padding: 0; }
    .book-detail-sheet {
      width: 100%; max-height: 90dvh; overflow: auto; background: #fff; border-radius: 24px 24px 0 0;
      box-shadow: 0 -16px 48px rgba(30,40,60,.14); padding: 24px 18px 20px;
      transform: translateY(18px); transition: transform .22s;
    }
    .book-detail-overlay.open .book-detail-sheet { transform: translateY(0); }
    .book-detail-sheet h2 { font-size: 21px; }
    .points-overlay { position: absolute; align-items: flex-end; padding: 0; }
    .points-sheet {
      width: 100%; background: #fff; border-radius: 24px 24px 0 0;
      box-shadow: 0 -16px 48px rgba(30,40,60,.14); padding: 24px 18px 20px;
      transform: translateY(18px); transition: transform .22s;
    }
    .points-overlay.open .points-sheet { transform: translateY(0); }
    .points-sheet h2 { margin: 0 0 7px; font-size: 21px; }
    .points-sheet-copy { color: #666b80; font-size: 12px; line-height: 1.65; margin-bottom: 16px; }
    .points-cost {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 13px 14px; margin-bottom: 10px; border-radius: 12px; background: var(--soft);
    }
    .points-cost-label { color: #7d8294; font-size: 11px; }
    .points-cost-value { color: var(--brand); font-size: 20px; font-weight: 800; }
    .points-balance { margin-bottom: 16px; color: #7d8294; font-size: 11px; }
    .points-balance.insufficient { color: var(--red); }
    .project-overlay { position: absolute; align-items: flex-end; padding: 0; }
    .project-sheet {
      width: 100%; max-height: 90dvh; overflow: auto; background: #fff; border-radius: 24px 24px 0 0;
      box-shadow: 0 -16px 48px rgba(30,40,60,.14); padding: 24px 18px 20px;
    }
    .project-sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
    .project-sheet h2 { margin: 0 0 7px; font-size: 21px; }
    .project-sheet-note { color: var(--sub); font-size: 12px; line-height: 1.5; }
    .project-sheet-close { border: 0; width: 38px; height: 38px; border-radius: 50%; background: #f5f5f7; color: #a0a3ad; font-size: 24px; cursor: pointer; }
    .project-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .project-option {
      min-height: 64px; border: 1px solid #eceef3; border-radius: 12px; background: #fff;
      display: flex; align-items: center; gap: 12px; padding: 10px 12px; font: inherit; cursor: pointer; text-align: left;
    }
    .project-option.selected { border-color: #ffd4c5; background: #fffaf8; color: var(--brand); font-weight: 750; }
    .project-option-name { min-width: 0; flex: 1; font-size: 15px; }
    .project-check { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; font-size: 18px; opacity: 0; }
    .project-option.selected .project-check { opacity: 1; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="status">
      <span id="status-time">9:41</span>
      <span class="status-icons">
        <svg width="15" height="11" viewBox="0 0 17 12" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="4.5" y="5" width="3" height="7" rx="0.5"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg width="14" height="11" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 4.2C3.2 2 6 1 7.5 1s4.3 1 6.5 3.2"/><path d="M3.2 6.4c1.4-1.3 2.8-1.9 4.3-1.9s2.9.6 4.3 1.9"/><circle cx="7.5" cy="9.6" r="1" fill="currentColor" stroke="none"/></svg>
        <svg width="22" height="11" viewBox="0 0 25 12" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" fill="none" stroke="currentColor"/><rect x="2" y="2" width="16" height="8" rx="1" fill="currentColor"/><rect x="22.5" y="3.5" width="1.5" height="5" rx="0.5" fill="currentColor"/></svg>
      </span>
    </div>
    <header class="topbar">
      <div class="top-title" id="headerTitle">AI申词</div>
      <button class="record-link" id="openRecords" type="button">申请记录　›</button>
    </header>
    <div class="main page-home" id="homePage">
      <section class="section">
        <div class="section-head">
          <div class="section-title">选择项目</div>
          <div class="section-note">点击切换</div>
        </div>
        <button class="project-trigger" id="openProjectPicker" type="button">
          <span class="p-icon" id="currentProjectIcon">番</span>
          <span class="project-trigger-copy"><span class="project-trigger-label">当前项目</span><span class="project-trigger-name" id="currentProjectName">番茄小说</span></span>
          <span class="project-arrow">›</span>
        </button>
      </section>
      <section class="section">
        <div class="section-head">
          <div class="section-title">添加书籍</div>
        </div>
        <div class="panel" id="manualPane">
          <div class="field-label id-field-label">
            <span>书籍 ID</span>
            <span class="id-header-actions">
              <button class="row-add" type="button" data-add-row>添加</button>
              <button class="manual-action extract-books" id="extractBooks" type="button">提取书籍信息</button>
            </span>
          </div>
          <div class="id-rows" id="manualRows"></div>
          <div class="hint">需要多本时点击「添加」增加输入行；按 Enter 不添加。填完后统一提取。</div>
        </div>
        <div class="panel quantity-panel" id="quantityPanel">
          <div class="field-label">统一申请数量 <small>应用于本次所有书籍 · 1–10 个/本</small></div>
          <input class="id-input qty-input" id="globalQty" type="number" min="1" max="10" step="1" value="3" inputmode="numeric" aria-label="统一申请数量" />
          <div class="invalid" id="globalQtyErr" style="display:none">请输入 1–10 之间的数量</div>
        </div>
      </section>
      <section class="section">
        <div class="section-head">
          <div class="section-title">AI 申词结果</div>
          <div class="section-note">每本书独立生成</div>
        </div>
        <div class="panel word-panel">
          <div class="word-head">
            <span class="section-title" style="font-size:13px">本次词列表</span>
            <span class="word-count" id="wordCount">尚未申词</span>
          </div>
          <div id="wordResults"></div>
          <div id="feedbackSlot"></div>
        </div>
      </section>
    </div>
    <div class="main page-records" id="recordsPage">
      <button class="record-back" id="backHome" type="button">‹　返回申词</button>
      <div class="section-head">
        <div class="section-title">申请记录</div>
        <span class="section-note" id="recordCount">0 条记录</span>
      </div>
      <div id="recordList"></div>
    </div>
    <div class="footer" id="footer">
      <div class="usage-note" id="usageNote"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="generateBtn" type="button"><span class="mini" id="generateIcon">✦</span> <span id="generateLabel">AI 申词</span></button>
        <button class="btn btn-secondary" id="submitBtn" type="button" disabled><span class="mini">➤</span> 立即题词</button>
      </div>
    </div>
    <div class="modal-overlay project-overlay" id="projectOverlay" aria-hidden="true" inert>
      <section class="project-sheet" role="dialog" aria-modal="true" aria-labelledby="projectPickerTitle">
        <div class="project-sheet-head">
          <div><h2 id="projectPickerTitle">选择项目</h2><div class="project-sheet-note">请选择本次 AI 申词项目</div></div>
          <button class="project-sheet-close" id="closeProjectPicker" type="button" aria-label="关闭项目选择">×</button>
        </div>
        <div class="project-options" id="projectOptions"></div>
        <button class="btn btn-primary" id="confirmProject" type="button" style="width:100%">确定切换</button>
      </section>
    </div>
    <div class="modal-overlay" id="promotionOverlay" aria-hidden="true" inert>

    var books = {

    };
    var sampleWords = {
      "738201": ["错过后的再次心动", "南风吹来的告白", "重逢才懂的深情", "藏在回忆里的爱", "命运安排的相遇", "迟来的真心告白"],

      "738203": ["重生后逆风翻盘", "不再隐忍的她", "手撕虚伪白莲花", "归来夺回属于我的", "这一世绝不心软", "隐藏大佬终于出手"],
      "738204": ["月光下的旧时光", "书页里的秘密", "那年夏天的约定"],
      "738205": ["她的人生重新开场", "告别过去拥抱自己", "这次为自己而活"],
      "738206": ["第七封信的秘密", "旧案背后的真相", "深夜来信指向谁"],
      "738207": ["闪婚后爱意失控", "先婚后爱的心动", "意外成为偏爱"],
      "738208": ["逆风翻盘的日子", "从低谷走向高光", "这一回绝不认输"],
      "738209": ["长夜尽头有星河", "秘密藏在旧时光", "迟来的真相与爱"],
      "738210": ["偏偏对你动了心", "欢喜冤家的日常", "越斗嘴越心动"],
      "738211": ["山海尽头是归途", "寻亲路上的温暖", "跨越山海的约定"],
      "738212": ["如果人生能重来", "这次换我做选择", "重启人生的答案"]
    };
    var projects = [
      { name: "番茄小说", icon: "番", style: "" },
      { name: "红果短剧", icon: "果", style: "alt" }
    ];
    var selectedProject = "番茄小说";
    var pendingProject = "番茄小说";
    var globalQty = 3;
    var generated = {};
    var records = [];
    var busy = false;
    var extracting = false;
    var manualRows = [{ key: 1, id: "738201", status: "idle" }];
    var nextRowKey = 2;
    var failNext = false;
    var hasGenerated = false;
    var toastTimer = null;
    var freeLimit = 3;
    var freeUsed = 0;
    var pointsPerUse = 20;
    var pointsBalance = 120;
    var pendingGenerationReroll = false;
    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    }
    function introOf(id) {
      var intros = {
        "738201": "一场错过多年的重逢，让两个藏着心事的人再次走近。旧日误会与新的选择交织，他们要决定是否还愿意相信彼此。",
        "738202": "雾都深处，一封没有寄出的信牵出尘封往事。主人公沿着零散线索追查，逐渐靠近被掩盖多年的真相。",
        "738203": "重来一次，她不再为任何人隐忍。面对熟悉的陷阱与背叛，她重新掌握人生，夺回原本属于自己的一切。"
      };
      return intros[id] || "这是一段用于演示书籍信息提取和详情查看的示例简介。正式内容以书籍信息接口返回为准。";
    }
    function bookOf(id) { return books[id] || null; }
    function enteredRows() {
      return manualRows.filter(function (row) { return row.id.trim() !== ""; });
    }
    function enteredIds() {
      return enteredRows().map(function (row) { return row.id.trim(); });
    }
    function duplicateIds() {
      var seen = {};
      return enteredIds().filter(function (id) {
        if (seen[id]) return true;
        seen[id] = true;
        return false;
      });
    }
    function rowFormatOk(id) {
      return !!id && !/[\s,，、;；]/.test(id);
    }
    function allIds() {
      return manualRows.filter(function (row) { return row.status === "success" && books[row.id.trim()]; }).map(function (row) { return row.id.trim(); });
    }
    function namesReady() {
      var rows = enteredRows();
      var invalid = rows.some(function (row) { return !rowFormatOk(row.id.trim()); });
      var duplicates = duplicateIds().length > 0;
      var pending = rows.some(function (row) { return row.status !== "success"; });
      return allIds().length > 0 && !invalid && !duplicates && !pending && !extracting;
    }
    function formatTime(date) {
      var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
      return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate()) + " " + pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
    }
    function coverHtml(book, small) {
      return '<div class="cover ' + (book.style || "") + '">' + book.cover.replace("\n", "<br>") + "</div>";
    }
    function clearBatch() {
      generated = {};
      hasGenerated = false;
      $("feedbackSlot").innerHTML = "";
      $("wordCount").textContent = "尚未申词";
      $("generateLabel").textContent = "AI 申词";
      $("generateIcon").textContent = "✦";
      renderWords();
      updateButtons();
    }
    function rowStatusHtml(row) {
      if (!row.id.trim()) return "";
      if (row.status === "loading") return "正在提取…";
      if (row.status === "success" && books[row.id.trim()]) {
        return '已提取 · <button class="inline-book-detail" type="button" data-book-detail="' + esc(row.id.trim()) + '">' + esc(books[row.id.trim()].name) + "</button>";
      }
      if (row.status === "fail") {
        return '未提取到信息 <button class="inline-retry" type="button" data-retry-row="' + row.key + '">重新提取</button>';
      }
      return "待提取";
    }
    function renderManualRows() {
      var duplicates = duplicateIds();
      $("manualRows").innerHTML = manualRows.map(function (row) {
        var id = row.id.trim();
        var error = id && !rowFormatOk(id) ? "每行仅填写一个书籍 ID" : (duplicates.indexOf(id) !== -1 ? "书籍 ID 重复" : "");
        return '<div class="id-row" data-row-key="' + row.key + '"><div class="id-row-wrap">' +
          '<input class="id-input" data-row-input="' + row.key + '" placeholder="请输入书籍 ID，如 738201" value="' + esc(row.id) + '"' + ((extracting || row.status === "loading") ? " disabled" : "") + " />" +
          '<div class="row-status ' + (row.status === "success" ? "success" : row.status === "fail" ? "fail" : "") + '" data-row-status="' + row.key + '">' + rowStatusHtml(row) + "</div>" +
          (error ? '<div class="row-error">' + error + "</div>" : "") +
          '</div><div class="id-row-actions">' +
          (manualRows.length > 1 ? '<button class="row-remove" type="button" data-remove-row="' + row.key + '" aria-label="移除输入行"' + ((extracting || row.status === "loading") ? " disabled" : "") + ">×</button>" : "") +
          "</div></div>";
      }).join("");
      updateExtractButton();
    }
    function updateExtractButton() {
      var rows = enteredRows();
      var validRows = rows.length > 0 && rows.every(function (row) { return rowFormatOk(row.id.trim()) && row.status !== "loading"; }) && duplicateIds().length === 0;
      $("extractBooks").disabled = !validRows || extracting;
      $("extractBooks").textContent = extracting ? "正在提取…" : "提取书籍信息";
      document.querySelectorAll("[data-add-row]").forEach(function (button) { button.disabled = extracting; });
    }
    function refreshManualValidation() {
      var counts = {};
      enteredIds().forEach(function (id) { counts[id] = (counts[id] || 0) + 1; });
      document.querySelectorAll("[data-row-key]").forEach(function (node) {
        var key = Number(node.getAttribute("data-row-key"));
        var row = manualRows.find(function (item) { return item.key === key; });
        if (!row) return;
        var id = row.id.trim();
        var error = id && !rowFormatOk(id) ? "每行仅填写一个书籍 ID" : (id && counts[id] > 1 ? "书籍 ID 重复" : "");
        var wrap = node.querySelector(".id-row-wrap");
        var oldError = wrap.querySelector(".row-error");
        if (oldError) oldError.remove();
        if (error) wrap.insertAdjacentHTML("beforeend", '<div class="row-error">' + error + "</div>");
        var status = wrap.querySelector("[data-row-status]");
        status.className = "row-status " + (row.status === "success" ? "success" : row.status === "fail" ? "fail" : "");
        status.innerHTML = rowStatusHtml(row);
      });
      updateExtractButton();
    }
    function renderBooks() {
      updateExtractButton();
      updateButtons();
    }
    async function extractManualBooks() {
      if ($("extractBooks").disabled) return;
      extracting = true;
      clearBatch();
      enteredRows().forEach(function (row) { row.status = "loading"; });
      renderManualRows();
      renderBooks();
      await wait(650);
      enteredRows().forEach(function (row) { row.status = books[row.id.trim()] ? "success" : "fail"; });
      extracting = false;
      renderManualRows();
      renderBooks();
      toast(enteredRows().some(function (row) { return row.status === "fail"; }) ? "部分书籍未提取到信息" : "书籍信息提取完成");
    }
    async function retryManualBook(key) {
      var row = manualRows.find(function (item) { return item.key === key; });
      if (!row || extracting) return;
      clearBatch();
      row.status = "loading";
      renderManualRows();
      renderBooks();
      await wait(500);
      row.status = books[row.id.trim()] ? "success" : "fail";
      renderManualRows();
      renderBooks();
      toast(row.status === "success" ? "书籍信息提取完成" : "未提取到信息");
    }
    function renderWords() {
      var ids = allIds();
      if (!Object.keys(generated).length) {
        $("wordResults").innerHTML = '<div class="empty" style="padding:25px 8px"><div class="empty-icon">✦</div>添加书籍并设置统一申请数量后，点击「AI 申词」</div>';
        return;
      }
        $("wordResults").innerHTML = ids.filter(function (id) { return generated[id]; }).map(function (id) {
        return '<div class="word-book"><div class="word-book-title"><span>' + bookOf(id).name + '</span><span class="word-count">' + generated[id].length + ' 个词</span></div><div class="word-list">' +
          generated[id].map(function (word) { return '<span class="word">' + word + "</span>"; }).join("") +
          "</div></div>";
      }).join("");
      var total = ids.reduce(function (sum, id) { return sum + ((generated[id] && generated[id].length) || 0); }, 0);
      $("wordCount").textContent = "共 " + total + " 个词";
    }
    function qtyOk() {
      return Number.isInteger(Number(globalQty)) && Number(globalQty) >= 1 && Number(globalQty) <= 10;
    }
    function valid() { return !!selectedProject && namesReady() && qtyOk() && !busy; }
    function hasWords() {
      var ids = allIds();
      return ids.length > 0 && ids.every(function (id) { return generated[id] && generated[id].length === Number(globalQty); });
    }
    function updateButtons() {
      var ready = hasWords();
      $("generateBtn").disabled = ((!valid() && !ready) || busy);
      $("generateLabel").textContent = hasGenerated ? "重新申请" : "AI 申词";
      $("generateIcon").textContent = hasGenerated ? "↻" : "✦";
      $("submitBtn").disabled = !ready || busy;
      $("globalQtyErr").style.display = ($("globalQty").value === "" || !qtyOk()) ? "block" : "none";
      renderUsageNote();
    }
    function renderUsageNote() {
      var remaining = Math.max(0, freeLimit - freeUsed);
      $("usageNote").innerHTML = remaining > 0
        ? '今日剩余免费 <strong>' + remaining + "/" + freeLimit + " 次</strong> · AI 申词与重新申请共用"
        : '免费次数已用完 · <strong>' + pointsPerUse + " 积分/次</strong>，用于 AI 算力消耗";
    }
    function toast(msg) {
      var node = $("toast");
      node.textContent = msg;
      node.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { node.classList.remove("show"); }, 1800);
    }
    function openBookDetail(id) {
      var book = books[id];
      if (!book) return;
      $("bookDetailTitle").textContent = book.name;
      $("bookDetailContent").innerHTML =
        '<div class="detail-cover">' + coverHtml(book) + '<div class="detail-meta">' +
        '<div class="detail-label">书籍名称</div><div class="detail-value" style="font-weight:750;margin-bottom:9px">' + esc(book.name) + "</div>" +
        '<div class="detail-label">书籍 ID</div><div class="detail-value">' + esc(book.id) + "</div></div></div>" +
        '<div class="detail-label">书籍简介</div><div class="detail-intro detail-value">' + esc(introOf(id)) + "</div>" +
        '<div class="detail-label">书籍链接</div><div class="detail-value" style="color:var(--brand);margin-bottom:16px">' + esc(book.link) + "</div>";
      $("bookDetailOverlay").inert = false;
      $("bookDetailOverlay").setAttribute("aria-hidden", "false");
      $("bookDetailOverlay").classList.add("open");
      $("closeBookDetailTop").focus();
    }
    function closeBookDetail() {
      $("bookDetailOverlay").classList.remove("open");
      $("bookDetailOverlay").setAttribute("aria-hidden", "true");
      $("bookDetailOverlay").inert = true;
    }
    function projectOf(name) {
      return projects.find(function (project) { return project.name === name; }) || projects[0];
    }
    function renderProjectOptions() {
      $("projectOptions").innerHTML = projects.map(function (project) {
        var selected = project.name === pendingProject;
        return '<button class="project-option' + (selected ? " selected" : "") + '" type="button" data-project-option="' + esc(project.name) + '">' +
          '<span class="p-icon ' + project.style + '">' + esc(project.icon) + '</span><span class="project-option-name">' + esc(project.name) + '</span><span class="project-check" aria-hidden="true">✓</span></button>';
      }).join("");
    }
    function openProjectPicker() {
      pendingProject = selectedProject;
      renderProjectOptions();
      $("projectOverlay").inert = false;
      $("projectOverlay").setAttribute("aria-hidden", "false");
      $("projectOverlay").classList.add("open");
      $("closeProjectPicker").focus();
    }
    function closeProjectPicker() {
      $("projectOverlay").classList.remove("open");
      $("projectOverlay").setAttribute("aria-hidden", "true");
      $("projectOverlay").inert = true;
      $("openProjectPicker").focus();
    }
    function setFeedback(type, msg) {
      $("feedbackSlot").innerHTML = '<div class="feedback ' + type + '">' + msg + "</div>";
    }
    function makeWords(id, count, offset) {
      var arr = sampleWords[id] || sampleWords["738201"];
      var start = offset || 0;
      return Array.from({ length: count }, function (_, i) { return arr[(i + start) % arr.length]; });
    }
    function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
    function addRecord(type, success, usage) {
      var now = new Date();
      records.unshift({
        project: selectedProject,
        ids: allIds().map(function (id) {
          return { id: id, name: bookOf(id).name, count: (generated[id] && generated[id].length) || 0, words: (generated[id] || []).slice() };
        }),
        type: type,
        success: success,
        usage: usage || null,
        time: formatTime(now)
      });
      renderRecords();
    }
    function closePoints() {
      $("pointsOverlay").classList.remove("open");
      $("pointsOverlay").setAttribute("aria-hidden", "true");
      $("pointsOverlay").inert = true;
      $("generateBtn").focus();
    }
    function openPoints(isReroll) {
      pendingGenerationReroll = isReroll;
      var insufficient = pointsBalance < pointsPerUse;
      $("pointsTitle").textContent = isReroll ? "确认重新申请" : "确认 AI 申词";
      $("pointsCopy").textContent = "今日免费次数已用完，本次将消耗积分，用于 AI 算力消耗。";
      $("pointsCost").textContent = pointsPerUse + " 积分";
      $("pointsBalance").textContent = insufficient
        ? "当前积分：" + pointsBalance + "，积分不足，无法发起 AI 申词"
        : "当前积分：" + pointsBalance + "，确认后剩余 " + (pointsBalance - pointsPerUse);
      $("pointsBalance").classList.toggle("insufficient", insufficient);
      $("confirmPoints").textContent = "确认消耗 " + pointsPerUse + " 积分";
      $("confirmPoints").disabled = insufficient;
      $("pointsOverlay").inert = false;
      $("pointsOverlay").setAttribute("aria-hidden", "false");
      $("pointsOverlay").classList.add("open");
      (insufficient ? $("cancelPoints") : $("confirmPoints")).focus();
    }
    function requestGenerate(isReroll) {
      if (busy) return;
      var canReroll = hasGenerated && allIds().length > 0 && qtyOk();
      if (!(isReroll ? canReroll : valid())) return;
      if (freeUsed < freeLimit) {
        freeUsed += 1;
        generate(isReroll, { mode: "free", points: 0 });
        return;
      }
      openPoints(isReroll);
    }
    async function generate(isReroll, usage) {
      if (busy) return;
      var canReroll = hasGenerated && allIds().length > 0 && qtyOk();
      if (!(isReroll ? canReroll : valid())) return;
      busy = true;
      $("feedbackSlot").innerHTML = "";
      updateButtons();
      var ids = allIds();
      $("wordResults").innerHTML = ids.map(function (id) {
        return '<div class="word-book"><div class="word-book-title"><span>' + bookOf(id).name + '</span><span class="word-count">正在申词<span class="loading-dot"></span></span></div><div class="word-list"><span class="word pending">正在生成…</span></div></div>';
      }).join("");
      $("wordCount").textContent = "生成中…";
      if (!isReroll) generated = {};
      for (var i = 0; i < ids.length; i += 1) {
        await wait(450);
        generated[ids[i]] = makeWords(ids[i], Number(globalQty), isReroll ? 1 : 0);
        renderWords();
      }
      busy = false;
      hasGenerated = true;
      updateButtons();
      addRecord("AI申词", true, usage);
      toast((isReroll ? "重新申请完成" : "申词完成") + (usage && usage.mode === "free" ? "，已使用 1 次免费额度" : "，已消耗 " + usage.points + " 积分"));
    }
    function closePromotion() {
      $("promotionOverlay").classList.remove("open");
      $("promotionOverlay").setAttribute("aria-hidden", "true");
      $("promotionOverlay").inert = true;
      $("submitBtn").focus();
    }
    function requestSubmit() {
      if ($("submitBtn").disabled) return;
      // 当前支持的项目均为字节系，确认类型后才提交。
      $("promotionType").value = "";
      $("confirmPromotion").disabled = true;
      $("promotionOverlay").inert = false;
      $("promotionOverlay").setAttribute("aria-hidden", "false");
      $("promotionOverlay").classList.add("open");
      $("promotionType").focus();
    }
    function submit(promotionType) {
      if (!promotionType) return;
      if ($("submitBtn").disabled) return;
      var success = !failNext;
      setFeedback(success ? "success" : "fail", success ? "提交成功" : "提交失败");
      addRecord("立即题词", success);
      records[0].promotionType = promotionType;
      toast(success ? "提交成功" : "提交失败");
    }
    function renderRecords() {
      $("recordCount").textContent = records.length + " 条记录";
      if (!records.length) {
        $("recordList").innerHTML = '<div class="empty"><div class="empty-icon">▤</div>还没有申请记录</div>';
        return;
      }
      $("recordList").innerHTML = records.map(function (row) {
        var booksHtml = row.ids.map(function (book) {
          var body = row.type === "AI申词"
            ? '<div class="record-result-label">本次申请词</div><div class="record-words">' + book.words.map(function (word) { return '<span class="record-word">' + word + "</span>"; }).join("") + "</div>"
            : '<div class="record-submit-result">' + (row.success ? "提交成功" : "提交失败") + "</div>";
          var count = row.type === "AI申词" ? '<span class="record-count">' + book.count + " 个词</span>" : "";
          return '<div class="record-book"><div class="record-book-head"><div><div class="record-book-name">' + book.name + '</div><div class="record-book-id">书籍 ID：' + book.id + "</div></div>" + count + "</div>" + body + "</div>";
        }).join("");
        var status = row.type === "立即题词"
          ? '<span class="record-status' + (row.success ? "" : " fail") + '">' + (row.success ? "提交成功" : "提交失败") + "</span>"
          : '<span class="record-status">申词完成</span>';
        var usage = row.type === "AI申词" && row.usage
          ? '<span class="record-type">' + (row.usage.mode === "free" ? "免费使用" : "消耗 " + row.usage.points + " 积分") + "</span>"
          : "";
        return '<div class="record-item"><div class="record-top"><div><div class="record-project">' + row.project + '</div><div class="record-meta"><span class="record-type">' + row.type + "</span>" + status + usage + '</div></div><div class="record-time">' + row.time + "</div></div>" + booksHtml + "</div>";
      }).join("");
    }
    function showRecords(show) {
      if (window.parent !== window) window.parent.postMessage({ type: "ai-shen-ci-page", page: show ? "records" : "home" }, location.origin);
      $("homePage").classList.toggle("hide", show);
      $("recordsPage").classList.toggle("show", show);
      $("footer").style.display = show ? "none" : "block";
      $("headerTitle").textContent = show ? "申请记录" : "AI申词";
      $("openRecords").style.display = show ? "none" : "block";
    }
    function selectProject(name) {
      selectedProject = name;
      var project = projectOf(name);
      $("currentProjectName").textContent = project.name;
      $("currentProjectIcon").textContent = project.icon;
      $("currentProjectIcon").className = "p-icon " + project.style;
    }
    function bind() {
      $("globalQty").addEventListener("input", function () {
        globalQty = $("globalQty").value === "" ? "" : Number($("globalQty").value);
        clearBatch();
      });
      $("openProjectPicker").addEventListener("click", openProjectPicker);
      $("closeProjectPicker").addEventListener("click", closeProjectPicker);
      $("projectOverlay").addEventListener("click", function (event) { if (event.target === this) closeProjectPicker(); });
      $("projectOptions").addEventListener("click", function (event) {
        var option = event.target.closest("[data-project-option]");
        if (!option) return;
        pendingProject = option.getAttribute("data-project-option");
        renderProjectOptions();
      });
      $("confirmProject").addEventListener("click", function () {
        if (pendingProject !== selectedProject) {
          selectProject(pendingProject);
          clearBatch();
        }
        closeProjectPicker();
      });
      $("extractBooks").addEventListener("click", extractManualBooks);
      document.querySelector("[data-add-row]").addEventListener("click", function () {
        manualRows.push({ key: nextRowKey++, id: "", status: "idle" });
        renderManualRows();
        var inputs = document.querySelectorAll("[data-row-input]");
        if (inputs.length) inputs[inputs.length - 1].focus();
      });
      $("manualRows").addEventListener("input", function (event) {
        var input = event.target.closest("[data-row-input]");
        if (!input) return;
        var key = Number(input.getAttribute("data-row-input"));
        var row = manualRows.find(function (item) { return item.key === key; });
        if (!row) return;
        row.id = input.value;
        row.status = "idle";
        clearBatch();
        renderBooks();
        refreshManualValidation();
      });
      $("manualRows").addEventListener("keydown", function (event) {
        if (event.key === "Enter" && event.target.closest("[data-row-input]")) event.preventDefault();
      });
      $("manualRows").addEventListener("click", function (event) {
        var detail = event.target.closest("[data-book-detail]");
        if (detail) {
          openBookDetail(detail.getAttribute("data-book-detail"));
          return;
        }
        var retry = event.target.closest("[data-retry-row]");
        if (retry) {
          retryManualBook(Number(retry.getAttribute("data-retry-row")));
          return;
        }
        var btn = event.target.closest("[data-remove-row]");
        if (!btn || manualRows.length === 1) return;
        var key = Number(btn.getAttribute("data-remove-row"));
        manualRows = manualRows.filter(function (row) { return row.key !== key; });
        clearBatch();
        renderManualRows();
        renderBooks();
      });
      $("generateBtn").addEventListener("click", function () { requestGenerate(hasGenerated); });
      $("cancelPoints").addEventListener("click", closePoints);
      $("confirmPoints").addEventListener("click", function () {
        if (pointsBalance < pointsPerUse) return;
        var cost = pointsPerUse;
        pointsBalance -= cost;
        var isReroll = pendingGenerationReroll;
        closePoints();
        generate(isReroll, { mode: "points", points: cost });
      });
      $("pointsOverlay").addEventListener("click", function (event) { if (event.target === this) closePoints(); });
      $("submitBtn").addEventListener("click", requestSubmit);
      $("promotionType").addEventListener("change", function () { $("confirmPromotion").disabled = !this.value; });
      $("cancelPromotion").addEventListener("click", closePromotion);
      $("confirmPromotion").addEventListener("click", function () {
        if (!$("promotionType").value) return;
        // Demo 模拟携带推广类型提交；不调用真实题词接口。
        closePromotion();
        submit($("promotionType").value);
      });
      $("promotionOverlay").addEventListener("click", function (event) { if (event.target === this) closePromotion(); });
      $("closeBookDetailTop").addEventListener("click", closeBookDetail);
      $("closeBookDetail").addEventListener("click", closeBookDetail);
      $("bookDetailOverlay").addEventListener("click", function (event) { if (event.target === this) closeBookDetail(); });
      document.addEventListener("keydown", function (event) {
        if (event.key !== "Escape") return;
        if ($("pointsOverlay").classList.contains("open")) closePoints();
        else if ($("bookDetailOverlay").classList.contains("open")) closeBookDetail();
        else if ($("promotionOverlay").classList.contains("open")) closePromotion();
        else if ($("projectOverlay").classList.contains("open")) closeProjectPicker();
      });
      $("openRecords").addEventListener("click", function () { showRecords(true); });
      $("backHome").addEventListener("click", function () { showRecords(false); });
    }
    function seedRecords() {
      records = [
        {
          project: "番茄小说",
          ids: [
            { id: "738201", name: "南风知我意", count: 3, words: ["错过后的再次心动", "南风吹来的告白", "重逢才懂的深情"] },
            { id: "738202", name: "雾都来信", count: 3, words: ["雾都深处的秘密", "一封未寄出的信", "真相藏在旧照片"] }
          ],
          type: "AI申词",
          success: true,
          usage: { mode: "free", points: 0 },
          time: "2026-10-23 17:20:00"
        },
        {
          project: "红果短剧",
          ids: [{ id: "738203", name: "重生后我不再隐忍", count: 2, words: ["重生后逆风翻盘", "不再隐忍的她"] }],
          type: "立即题词",
          success: false,
          time: "2026-10-22 11:05:00"
        }
      ];
    }
    function preset(screen) {
      busy = false;
      extracting = false;
      failNext = screen === "fail";
      showRecords(screen === "records");
      nextRowKey = 3;
      if (screen === "records") {
        manualRows = [{ key: 1, id: "738201", status: "success" }];
        globalQty = 3;
        $("globalQty").value = "3";
        generated = {};
        hasGenerated = false;
        renderManualRows();
        renderBooks();
        renderWords();
        renderRecords();
        return;
      }
      if (screen === "start") {
        selectProject("番茄小说");
        manualRows = [{ key: 1, id: "738201", status: "idle" }];
        globalQty = 3;
        $("globalQty").value = "3";
        generated = {};
        hasGenerated = false;
        $("feedbackSlot").innerHTML = "";
      } else {
        selectProject("番茄小说");
        manualRows = [
          { key: 1, id: "738201", status: "success" },
          { key: 2, id: "738202", status: "success" }
        ];
        globalQty = 3;
        $("globalQty").value = "3";
        generated = {
          "738201": ["错过后的再次心动", "南风吹来的告白", "重逢才懂的深情"],
          "738202": ["雾都深处的秘密", "一封未寄出的信", "真相藏在旧照片"]
        };
        hasGenerated = true;
        if (screen === "ok") setFeedback("success", "提交成功");
        else if (screen === "fail") setFeedback("fail", "提交失败");
        else $("feedbackSlot").innerHTML = "";
      }
      renderManualRows();
      renderBooks();
      renderWords();
      updateButtons();
    }
    window.addEventListener("message", function (event) {
      var data = event.data || {};
      if (data.type === "ai-shen-ci-config") {
        if (Number.isInteger(data.freeLimit) && data.freeLimit >= 0) freeLimit = data.freeLimit;
        if (Number.isInteger(data.pointsPerUse) && data.pointsPerUse >= 0) pointsPerUse = data.pointsPerUse;
        renderUsageNote();
        return;
      }
      if (data.type !== "ai-shen-ci" || !data.screen) return;
      preset(data.screen);
    });
    var clock = new Date();
    $("status-time").textContent = (clock.getHours() < 10 ? "0" : "") + clock.getHours() + ":" + (clock.getMinutes() < 10 ? "0" : "") + clock.getMinutes();
    seedRecords();
    bind();
    renderRecords();
    var initial = new URLSearchParams(location.search).get("screen") || "start";
    preset(initial);
  </script>
</body>
</html>
