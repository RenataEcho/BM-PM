<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FR-001 · 上传稿件</title><style>/* 组件 class 原样复制自 component-spec-demo.html；下方追加本 FR 布局。 */

    :root {
      --primary: #2563eb; --primary-hover: #1d4ed8; --primary-light: #eff6ff; --primary-border: #bfdbfe;
      --accent-rule: #0891b2; --accent-version: #7c3aed; --accent-fr: #d97706;
      --success: #16a34a; --success-bg: #f0fdf4; --warning: #d97706; --warning-bg: #fffbeb;
      --danger: #dc2626; --danger-hover: #b91c1c; --danger-bg: #fef2f2; --danger-border: #fecaca;
      --bg: #f0f4f8; --surface: #fff; --surface-glass: rgba(255,255,255,0.72);
      --surface-hover: #f8fafc; --border: #e8edf3;
      --text-primary: #18222f; --text-secondary: #4a5568; --text-muted: #9aa5b4;
      --sidebar-w: 240px; --drawer-w: 480px;
      --radius-sm: 7px; --radius-lg: 14px;
      --shadow: 0 8px 32px rgba(30,40,80,0.10);
      --shadow-modal: 0 20px 60px rgba(30,40,80,0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px;
      color: var(--text-primary);
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f4f8 40%, #e0f2fe 100%);
      background-attachment: fixed; min-height: 100vh;
    }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); z-index: 200;
      display: flex; flex-direction: column;
      background: rgba(240,244,255,0.95); backdrop-filter: blur(20px);
      border-right: 1px solid rgba(148,163,196,0.22);
    }
    .sidebar-brand { padding: 16px 14px 12px; border-bottom: 1px solid rgba(148,163,196,0.22); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .brand-text { font-size: 14px; font-weight: 700; }
    .brand-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .sprint-pill {
      display: inline-block; margin-top: 10px; font-size: 11px; font-weight: 600;
      padding: 3px 8px; border-radius: 999px; background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0;
    }
    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 0 16px; }
    .nav-group-label { padding: 12px 16px 6px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .nav-item {
      position: relative; display: flex; align-items: center; height: 40px;
      padding: 0 12px 0 14px; margin: 1px 8px; width: calc(100% - 16px);
      border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-secondary);
      text-decoration: none; transition: all 0.18s;
    }
    .nav-item:hover { background: rgba(99,102,241,0.06); color: var(--text-primary); }
    .nav-item.active { color: var(--primary); background: rgba(37,99,235,0.12); font-weight: 600; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 7px; bottom: 7px;
      width: 3px; border-radius: 0 2px 2px 0; background: var(--primary);
    }
    .sidebar-foot { padding: 10px 14px 14px; border-top: 1px solid rgba(148,163,196,0.22); font-size: 11px; color: var(--text-muted); line-height: 1.5; }
    .main { margin-left: var(--sidebar-w); padding: 16px 20px 48px; min-height: 100vh; }
    .breadcrumb { padding: 4px 0 12px; font-size: 12px; color: var(--text-muted); }
    .breadcrumb a { color: var(--primary); text-decoration: none; }
    .page-header { margin-bottom: 16px; }
    .page-header h1 { font-size: 19px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .page-desc { font-size: 12px; color: var(--text-muted); max-width: 820px; line-height: 1.55; }
    .badge { display: inline-flex; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: var(--radius-sm); }
    .badge-spec { background: #ecfeff; color: var(--accent-rule); border: 1px solid #a5f3fc; }
    .spec-nav {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px;
      background: var(--surface-glass); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.55); border-radius: var(--radius-lg);
      padding: 10px 12px; box-shadow: var(--shadow);
    }
    .spec-nav a {
      padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 500;
      color: var(--text-secondary); text-decoration: none; border: 1px solid var(--border); background: var(--surface);
    }
    .spec-nav a:hover { border-color: var(--primary-border); color: var(--primary); background: var(--primary-light); }
    .glass-card {
      background: var(--surface-glass); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.55); border-radius: var(--radius-lg);
      box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; scroll-margin-top: 16px;
    }
    .spec-section-head {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;
    }
    .spec-section-head h2 { font-size: 15px; font-weight: 700; }
    .spec-section-head p { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; max-width: 640px; }
    .spec-body { padding: 16px 18px 20px; }
    .spec-row { display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: start; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .spec-row:last-child { border-bottom: none; padding-bottom: 0; }
    .spec-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); padding-top: 8px; }
    .spec-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; line-height: 1.45; }
    .spec-demo { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .spec-code { font-family: ui-monospace, monospace; font-size: 11px; color: var(--accent-rule); background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }

    /* —— 按钮 —— */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; padding: 0 14px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s, color 0.15s; white-space: nowrap;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-ghost { background: var(--surface); color: var(--text-secondary); border-color: var(--border); }
    .btn-ghost:hover:not(:disabled) { background: var(--surface-hover); color: var(--text-primary); }
    .btn-rule { background: var(--primary-light); color: var(--primary); border-color: var(--primary-border); }
    .btn-rule:hover:not(:disabled) { background: #dbeafe; }
    .btn-rule.active, .btn-rule[aria-expanded="true"] {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
    .btn-danger-ghost { background: var(--surface); color: var(--danger); border-color: var(--danger-border); }
    .btn-danger-ghost:hover:not(:disabled) { background: var(--danger-bg); }
    .btn-sm { height: 32px; padding: 0 12px; font-size: 12px; }

    /* —— 文字链 / 表格操作 —— */
    .link {
      display: inline-flex; align-items: center; min-height: 28px; padding: 0 2px;
      color: var(--primary); font-size: 12px; font-weight: 500; cursor: pointer;
      text-decoration: none; border: none; background: none; transition: color 0.15s;
    }
    .link:hover { color: var(--primary-hover); text-decoration: underline; }
    .link + .link { margin-left: 12px; }
    .link-danger { color: var(--danger); }
    .link-danger:hover { color: var(--danger-hover); }
    .link-muted { color: var(--text-muted); font-weight: 400; }
    .link-muted:hover { color: var(--text-secondary); }
    .action-group { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0; }

    /* —— Tag —— */
    .tag { display: inline-flex; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .tag-ok { background: var(--success-bg); color: var(--success); }
    .tag-warn { background: var(--warning-bg); color: var(--warning); }
    .tag-del { background: var(--danger-bg); color: var(--danger); }

    /* —— 表格操作列示例 —— */
    .mini-table { width: 100%; border-collapse: collapse; }
    .mini-table th, .mini-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; }
    .mini-table th { font-size: 11px; font-weight: 600; color: var(--text-muted); background: rgba(248,250,252,0.9); }
    .mini-table tr:hover td { background: var(--surface-hover); }

    /* —— 居中 Modal（确认 / 编辑） —— */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.4); z-index: 600;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.22s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      width: 100%; max-width: 400px; background: var(--surface);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-modal);
      transform: translateY(12px) scale(0.98); transition: transform 0.22s;
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }
    .modal.modal-md { max-width: 480px; }
    .modal-header { padding: 16px 20px 0; }
    .modal-header h3 { font-size: 15px; font-weight: 700; }
    .modal-header p { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.55; }
    .modal-body { padding: 16px 20px; }
    .modal-footer {
      padding: 12px 20px 16px; display: flex; justify-content: flex-end; gap: 8px;
      border-top: 1px solid var(--border);
    }
    .form-field { margin-bottom: 12px; }
    .form-field:last-child { margin-bottom: 0; }
    .form-field label { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; }
    .form-field input, .form-field select {
      width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 13px;
    }
    .form-field input:focus, .form-field select:focus {
      outline: none; border-color: var(--primary-border); box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    /* —— 右侧详情 Drawer —— */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.35); z-index: 500;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: var(--drawer-w); z-index: 501;
      background: rgba(255,255,255,0.98); backdrop-filter: blur(12px);
      box-shadow: -8px 0 40px rgba(30,40,60,0.18);
      transform: translateX(100%); transition: transform 0.28s ease;
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .drawer-header h2 { font-size: 15px; font-weight: 700; }
    .drawer-close {
      width: 28px; height: 28px; border: none; background: #f1f5f9;
      border-radius: 6px; cursor: pointer; font-size: 16px; color: var(--text-secondary);
    }
    .drawer-close:hover { background: #e2e8f0; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; font-size: 13px; color: var(--text-secondary); line-height: 1.65; }
    .drawer-meta { display: grid; grid-template-columns: 100px 1fr; gap: 8px 12px; font-size: 12px; margin-bottom: 16px; }
    .drawer-meta dt { color: var(--text-muted); }
    .drawer-meta dd { color: var(--text-primary); }

    /* —— Toast —— */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px;
      opacity: 0; transition: all 0.25s; z-index: 700; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .usage-note {
      margin-top: 14px; padding: 10px 12px; border-radius: var(--radius-sm);
      background: #fffbeb; border: 1px solid #fde68a; font-size: 12px; color: #92400e; line-height: 1.55;
    }
    .limit-note {
      margin-top: 14px; padding: 10px 12px; border-radius: var(--radius-sm);
      background: #fef2f2; border: 1px solid #fecaca; font-size: 12px; color: #991b1b; line-height: 1.55;
    }
    .spec-list { padding-left: 18px; font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
    .spec-list li { margin-bottom: 6px; }
    .spec-list code { font-family: ui-monospace, monospace; font-size: 11px; color: var(--accent-rule); background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
    .spec-subh { font-size: 13px; font-weight: 700; margin: 18px 0 8px; }
    .spec-subh:first-child { margin-top: 0; }

    .rule-tab-bar { display: flex; padding: 0 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .rule-tab-bar button {
      padding: 10px 18px; border: none; background: none; cursor: pointer;
      font-size: 13px; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .rule-tab-bar button.active { color: var(--primary); font-weight: 600; border-bottom-color: var(--primary); }
    .rule-panel { display: none; padding: 16px 20px 24px; }
    .rule-panel.active { display: block; }
    .rule-section { margin-bottom: 20px; }
    .rule-section h3 { font-size: 14px; font-weight: 700; color: var(--accent-rule); margin-bottom: 8px; }
    .rule-content { font-size: 13px; color: var(--text-secondary); line-height: 1.65; }
    .rule-content ul { padding-left: 18px; }
    .rule-content li { margin-bottom: 5px; }
    .drawer.rule { width: var(--drawer-w); }

    .onescreen-frame {
      display: grid; grid-template-columns: 88px 1fr; height: 380px;
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff;
    }
    .onescreen-side { background: rgba(240,244,255,0.95); border-right: 1px solid var(--border); padding: 10px 8px; }
    .onescreen-side b { display: block; font-size: 10px; margin-bottom: 10px; }
    .onescreen-side span { display: block; height: 22px; border-radius: 6px; background: rgba(37,99,235,0.12); color: var(--primary); font-size: 10px; line-height: 22px; padding: 0 8px; margin-bottom: 4px; }
    .onescreen-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .onescreen-chrome { flex-shrink: 0; padding: 8px 10px 0; border-bottom: 1px solid var(--border); }
    .onescreen-chrome .h { font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .onescreen-chrome .t { display: inline-flex; gap: 4px; margin: 8px 0; padding: 3px; border-radius: 8px; background: #f8fafc; }
    .onescreen-chrome .t i { font-style: normal; font-size: 10px; padding: 4px 8px; border-radius: 6px; background: var(--primary); color: #fff; }
    .onescreen-chrome .t em { font-style: normal; font-size: 10px; padding: 4px 8px; color: var(--text-muted); }
    .onescreen-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px; gap: 8px; background: #f8fafc; }
    .onescreen-scenes { flex-shrink: 0; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-size: 10px; color: var(--text-muted); }
    .onescreen-scenes strong { color: var(--text-primary); }
    .onescreen-board { flex: 1; min-height: 0; overflow: auto; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; gap: 12px; }
    .onescreen-phone { width: 92px; flex-shrink: 0; aspect-ratio: 375/812; border-radius: 12px; background: #1c1c1e; box-shadow: 0 6px 16px rgba(0,0,0,.12); position: relative; }
    .onescreen-phone::after { content: ''; position: absolute; inset: 6px; border-radius: 8px; background: linear-gradient(180deg, #fff1ec, #fff); }
    .onescreen-cap { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }

    .flow-page { padding: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); }
    .flow-page-intro { padding: 12px 14px 0; font-size: 12px; color: var(--text-muted); line-height: 1.55; }
    .flow-tab-bar {
      display: flex; gap: 4px; padding: 10px 14px 0; border-bottom: 1px solid var(--border);
    }
    .flow-tab-bar span, .flow-tab-bar button {
      padding: 8px 14px; border: none; background: none; white-space: nowrap;
      font-size: 13px; color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .flow-tab-bar .active { color: var(--primary); font-weight: 600; border-bottom-color: var(--primary); }
    .flow-svg-wrap { overflow: auto; padding: 8px 8px 4px; }
    .flow-svg-wrap svg { display: block; margin: 0 auto; }
    .flow-edges line, .flow-edges polyline { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .flow-legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 4px 14px 14px; font-size: 11px; color: var(--text-muted); }
    .flow-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -2px; }
    .swatch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
    .swatch b { width: 14px; height: 14px; border-radius: 3px; border: 1px solid; flex-shrink: 0; }

/* FR-001 布局：颜色与组件继承上方规范。 */
[hidden] { display: none !important; }
body { font-family: 'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif; line-height: 1.6; }
button,input,select { font: inherit; }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
.topnav { height: 54px; position: fixed; inset: 0 0 auto; z-index: 250; display: flex; align-items: center; gap: 32px; padding: 0 24px; background: linear-gradient(135deg,#dbeafe,#ede9fe 40%,#e0f2fe); border-bottom: 1px solid var(--border); }
.topnav a { text-decoration: none; color: var(--text-primary); }
.business-line { color: var(--primary); font-weight: 700; }
.topnav-note { margin-left: auto; color: var(--text-secondary); font-size: 12px; }
body[data-page="workspace"] { height: 100vh; overflow: hidden; }
.sidebar { top: 54px; width: 220px; }
.sidebar-foot { margin-top: auto; }
.main { margin-left: 220px; padding: 66px 24px 0; height: 100vh; min-height: 0; display: flex; flex-direction: column; }
.breadcrumb { padding-bottom: 8px; }
.fr-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 10px; flex-shrink: 0; }
.fr-header h1 { font-size: 19px; line-height: 1.3; }
.page-tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-shrink: 0; }
.page-tabs .active { background: var(--primary); color: white; border-color: var(--primary); }
.view { min-height: 0; overflow: auto; flex: 1; padding-bottom: 16px; }
#view-fe { height: calc(100vh - 188px); display: flex; gap: 16px; overflow: hidden; }
.scene-panel { width: 208px; flex-shrink: 0; overflow: auto; background: var(--surface-glass); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 12px; }
.scene-heading { font-weight: 700; margin-bottom: 12px; }
.scene-heading .tag { margin-left: 4px; }
.scene-button { width: 100%; height: auto; padding: 10px; white-space: normal; flex-direction: column; align-items: flex-start; text-align: left; margin-bottom: 8px; gap: 2px; }
.scene-button.active { border-color: var(--primary-border); background: var(--primary-light); color: var(--primary); }
.scene-button small { font-size: 11px; font-weight: 400; color: var(--text-secondary); }
.scene-help { font-size: 11px; color: var(--text-secondary); margin-top: 10px; }
.mockup-board { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.board-caption { padding: 10px 16px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
.board-caption span { color: var(--text-secondary); flex: 1; }
.board-scroll { flex: 1; min-height: 0; overflow: auto; }
iframe { display: block; width: 100%; height: 100%; min-height: 460px; border: 0; }
.filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
.filters label { display: grid; gap: 4px; min-width: 160px; color: var(--text-secondary); font-size: 12px; }
.filters label:nth-child(2) { flex: 1; }
.form-input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-primary); }
.form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
.table-scroll { overflow: auto; }
.mini-table { min-width: 900px; }
.mini-table td { vertical-align: top; max-width: 230px; overflow-wrap: anywhere; }
.mini-table code { font-size: 11px; }
.muted { color: var(--text-secondary); font-size: 12px; }
.drawer { max-width: 92vw; }
.drawer-body { overflow-wrap: anywhere; }
.drawer-meta dd { margin: 0; overflow-wrap: anywhere; }

    function renderMaterials(){
      $('material-count').textContent=materials.length?`已选择 ${materials.length} 个成片素材`:'尚未选择成片素材';
      $('material-list').innerHTML=materials.length?materials.map(file=>`<div class="material-item"><span class="tag tag-ok">成片素材</span><strong>${esc(file.name)}</strong><span class="muted">${esc(file.path)} · ${(file.size/1048576).toFixed(1)} MB</span></div>`).join(''):'<p class="muted">请选择文件夹或文件，添加要上传的成片。</p>';
      $('clear-materials').disabled=!materials.length;
    }
    function resetMaterials(){materials=[{...demoMaterial}];$('editor-note').value='';$('publish-note').value='';renderMaterials();}
    for(const [button,input] of [['choose-files','material-files'],['choose-folder','material-folder']]){
      $(button).addEventListener('click',()=>$(input).click());
      $(input).addEventListener('change',()=>{materials.push(...Array.from($(input).files,file=>({name:file.name,size:file.size,path:file.webkitRelativePath||file.name})));$(input).value='';renderMaterials();});
    }
    let materialReturnFocus=null;
    function closeMaterialConfirm(){ $('material-confirm').hidden=true;$('material-confirm').classList.remove('open');$('product').inert=false;materialReturnFocus?.focus(); }
    $('clear-materials').addEventListener('click',()=>{closeCandidates();materialReturnFocus=document.activeElement;$('product').inert=true;$('material-confirm').hidden=false;$('material-confirm').classList.add('open');$('material-cancel').focus();});
    $('material-cancel').addEventListener('click',closeMaterialConfirm);
    $('material-clear-confirm').addEventListener('click',()=>{materials=[];closeMaterialConfirm();renderMaterials();$('choose-files').focus();});
    $('material-confirm').addEventListener('click',e=>{if(e.target===$('material-confirm'))closeMaterialConfirm();});
    document.addEventListener('keydown',e=>{if($('material-confirm').hidden)return;if(e.key==='Escape'){e.preventDefault();closeMaterialConfirm();}else trap(e,$('material-confirm'));});

    function closeCandidates() {
      searchToken++;activeKey=null;candidates=[];selected=-1;
      for(const key of ['name','id']){$('candidates-'+key).hidden=true;$('candidates-'+key).replaceChildren();inputs[key].setAttribute('aria-expanded','false');inputs[key].removeAttribute('aria-activedescendant');$('loading-'+key).textContent='';}
    }
    function choose(index) {
      const candidate=candidates[index],triggerKey=activeKey,trigger=inputs[triggerKey];if(!candidate||!trigger)return;
      trigger.value=candidate[triggerKey];
      const filled=[];
      for(const key of Object.keys(fieldNames))if(key!==triggerKey&&inputs[key].value===''&&candidate[key]){inputs[key].value=candidate[key];filled.push(fieldNames[key]);}
      closeCandidates();suppressFocus=true;trigger.focus();suppressFocus=false;
      $('fill-status').textContent=`已更新${fieldNames[triggerKey]}${filled.length?'，补入'+filled.join('、'):''}；其他已填字段保持不变，仍可手动修改。`;
    }
    function markSelection() {
      const list=$('candidates-'+activeKey);
      list.querySelectorAll('[role="option"]').forEach((option,i)=>{option.setAttribute('aria-selected',String(i===selected));});
      if(selected>=0){inputs[activeKey].setAttribute('aria-activedescendant',`option-${activeKey}-${selected}`);list.children[selected].scrollIntoView({block:'nearest'});}
    }
    function search(key) {
      closeCandidates();if(!inputs[key].value || scene.group==='other')return;
      const token=++searchToken;activeKey=key;$('loading-'+key).textContent='正在查询…';
      setTimeout(()=>{
        if(token!==searchToken||document.activeElement!==inputs[key])return;
        $('loading-'+key).textContent='';
        if(scene.fault){$('loading-'+key).textContent='书库查询失败，请稍后再试。';return;}
        const query=inputs[key].value.toLocaleLowerCase();
        candidates=records.filter(r=>r.group===scene.group&&r[key].toLocaleLowerCase().includes(query)).slice(0,20);
        const list=$('candidates-'+key);list.hidden=false;inputs[key].setAttribute('aria-expanded','true');
        list.innerHTML=candidates.length?candidates.map((r,i)=>`<div class="candidate" id="option-${key}-${i}" role="option" aria-selected="false" data-index="${i}"><strong>${esc(r.name)}</strong><small>${esc(r.id)} · ${esc(r.type)}</small><small>${esc(r.link||'书籍链接：无')}</small></div>`).join(''):'<div class="candidate-empty" role="status">暂无结果</div>';
        list.querySelectorAll('[data-index]').forEach(el=>{el.addEventListener('pointerdown',e=>e.preventDefault());el.addEventListener('click',()=>choose(Number(el.dataset.index)));});
      },180);
    }
    for(const key of ['name','id']){
      inputs[key].addEventListener('input',()=>search(key));
      inputs[key].addEventListener('focus',()=>{if(!suppressFocus)search(key);});
      inputs[key].addEventListener('keydown',event=>{
        if(event.isComposing || event.keyCode===229)return;
        if(event.key==='Escape'){closeCandidates();event.stopPropagation();event.preventDefault();return;}
        if(activeKey===key&&!$('candidates-'+key).hidden){
          if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();if(candidates.length){selected=selected<0?(event.key==='ArrowDown'?0:candidates.length-1):(selected+(event.key==='ArrowDown'?1:-1)+candidates.length)%candidates.length;markSelection();}}
          if(event.key==='Enter'){event.preventDefault();if(selected>=0)choose(selected);}
        }else if(event.key==='Enter'){event.preventDefault();search(key);}
      });
      inputs[key].addEventListener('blur',closeCandidates);
    }
    document.addEventListener('pointerdown',event=>{if(!event.target.closest('.search-field'))closeCandidates();});
    function closeModal(restore=true) {
      $('validation-overlay').classList.remove('open');$('validation-overlay').hidden=true;modalOpen=false;$('product').inert=false;
      if(restore)$('next').focus();
    }
    function openModal(kind) {
      closeCandidates();modalOpen=true;$('product').inert=true;
      const g=groups[scene.group],domestic=['byte','zhihu'].includes(scene.group);
      $('validation-title').textContent=kind==='fault'?'书库查询失败':`${g.label} · ${g.field}校验异常`;
      $('validation-message').textContent=kind==='fault'?'系统异常，暂时无法查询书库。已保留填写内容。':scene.group==='byte'?'书籍ID与书籍不匹配，确认要继续提交吗？':scene.group==='zhihu'?'书籍链接与书籍名称不匹配，确认要继续提交吗？':'书籍ID与书籍名称不匹配，请填写正确后再提交！';
      $('validation-message').style.color=kind==='fault'?'var(--text-primary)':domestic?'var(--warning)':'var(--danger)';
      $('validation-note').textContent=kind==='fault'?'查询失败不视为填写错误；已保留填写内容，关闭后留在第二步。':domestic?'书库可能不完整，可确认后继续。':'请修正书籍 ID 后重新点下一步。';
      $('validation-actions').replaceChildren();
      for(const label of kind==='fault'||!domestic?['关闭']:['取消','继续提交']){
        const button=document.createElement('button');button.type='button';button.className=`btn ${label==='继续提交'?'btn-primary':'btn-ghost'}`;button.textContent=label;
        button.addEventListener('click',()=>{closeModal(label!=='继续提交');if(label==='继续提交')goThird();});$('validation-actions').append(button);
      }
      $('validation-overlay').hidden=false;$('validation-overlay').classList.add('open');$('validation-actions').firstElementChild.focus();
    }
    $('validation-overlay').addEventListener('click',event=>{if(event.target===$('validation-overlay'))closeModal();});
    document.addEventListener('keydown',event=>{if(!modalOpen)return;if(event.key==='Escape'){event.preventDefault();closeModal();}else trap(event,$('validation-overlay').querySelector('.modal'));});
    function setBusy(busy) {
      $('book-form').querySelectorAll('input,select,button').forEach(el=>{el.disabled=busy;});$('next').textContent=busy?'校验中…':'下一步';
    }
    function goThird() {
      closeCandidates();$('form-step').hidden=true;$('submit-step').hidden=false;$('submit-summary').innerHTML=summary(getValues());$('submit-feedback').textContent='';$('material-summary').innerHTML=`<h2>待上传成片 · ${materials.length} 个</h2>`+$('material-list').innerHTML+`<p class="muted">发布技巧：${esc($('publish-note').value||'未填写')}</p>`;
      $('step-two').className='complete';$('step-two').removeAttribute('aria-current');$('step-three').className='active';$('step-three').setAttribute('aria-current','step');$('final-submit').focus();
    }
    function goSecond(restoreFocus=true) {
      $('form-step').hidden=false;$('submit-step').hidden=true;$('step-two').className='active';$('step-two').setAttribute('aria-current','step');$('step-three').className='';$('step-three').removeAttribute('aria-current');if(restoreFocus)$('next').focus();
    }
    $('book-form').addEventListener('submit',async event=>{
      event.preventDefault();if($('next').disabled)return;closeCandidates();const token=++checkToken,values=getValues(),group=groups[scene.group];
      if(!group.key){goThird();return;}
      setBusy(true);await new Promise(resolve=>setTimeout(resolve,280));if(token!==checkToken)return;setBusy(false);
      if(scene.fault){openModal('fault');return;}
      const comparedValue=values[group.key].trim();
      const matched=comparedValue!==''&&records.some(r=>r.group===scene.group&&r[group.key].trim()===comparedValue);
      if(matched)goThird();else openModal('mismatch');
    });
    $('back').addEventListener('click',()=>goSecond());
    $('final-submit').addEventListener('click',()=>{$('submit-feedback').textContent='模拟提交成功。本 FR 未在第三步再次校验或拦截。';});
    function loadScreen(name) {
      closeMaterialConfirm();scene=scenes[name]||scenes.name;checkToken++;closeCandidates();closeModal(false);setBusy(false);
      for(const key of Object.keys(inputs))inputs[key].value=scene.values[key]||'';
      resetMaterials();$('fill-status').textContent='';goSecond(false);
      $('project-label').textContent=`${scene.project} · ${groups[scene.group].label}`;
      $('check-hint').textContent=scene.group==='other'?'此项目不做书籍校验':`下一步校验：${groups[scene.group].field}`;
      $('form-hint').textContent=scene.group==='other'?'当前项目暂无书库，请手动填写书籍信息。':'支持按书籍名称或书籍 ID 模糊搜索';
      for(const key of ['name','id'])inputs[key].placeholder=scene.group==='other'?'请手动填写'+fieldNames[key]:'输入'+fieldNames[key]+'搜索';
      // 异常场景进入后自动走一次下一步，直接展示校验弹窗。
      if(['byte','zhihu','drama','novel','fault'].includes(name)){
        setTimeout(()=>{if(scene===scenes[name]&&!modalOpen&&!$('form-step').hidden)$('book-form').requestSubmit();},80);
      }
    }
    window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='fr001-screen')return;loadScreen(event.data.screen);});
    loadScreen(new URLSearchParams(location.search).get('screen')||'name');
  }

        <rect x="400" y="150" width="260" height="80" rx="7" fill="#dbeafe" stroke="#93c5fd"/><text x="530" y="174"><tspan x="530">名称 / ID 模糊搜索</tspan><tspan x="530" dy="19">更新触发字段，其他只补空</tspan><tspan x="530" dy="17" class="sub">至多20条；选后仍可手改</tspan></text>
        <rect x="400" y="270" width="260" height="60" rx="7" fill="#dbeafe" stroke="#93c5fd"/><text x="530" y="305">点击第二步「下一步」</text>

        <rect x="400" y="540" width="260" height="60" rx="7" fill="#dcfce7" stroke="#86efac"/><text x="530" y="565"><tspan x="530">按项目系查询对应书库</tspan><tspan x="530" dy="18" class="sub">字节 / 海外比 ID；知乎比链接</tspan></text>

        <rect x="90" y="670" width="220" height="60" rx="7" fill="#ffedd5" stroke="#fdba74"/><text x="200" y="695"><tspan x="200">显示系统异常，非填写错误</tspan><tspan x="200" dy="18" class="sub">保留内容，关闭后回第二步</tspan></text>

        <rect x="850" y="1000" width="220" height="60" rx="7" fill="#fee2e2" stroke="#fca5a5"/><text x="960" y="1026"><tspan x="960">海外异常阻断</tspan><tspan x="960" dy="18">弹窗仅「关闭」</tspan></text>
        <rect x="1100" y="1000" width="220" height="60" rx="7" fill="#dbeafe" stroke="#93c5fd"/><text x="1210" y="1026"><tspan x="1210">字节 / 知乎异常确认</tspan><tspan x="1210" dy="18" class="sub">取消 / 继续提交</tspan></text>
        <polygon points="1190,1140 1310,1200 1190,1260 1070,1200" fill="#fef3c7" stroke="#fbbf24"/><text x="1190" y="1195"><tspan x="1190">点击「继续提交」？</tspan><tspan x="1190" dy="18" class="sub">不是第三步最终提交</tspan></text>
        <rect x="400" y="1300" width="260" height="60" rx="7" fill="#dbeafe" stroke="#93c5fd"/><text x="530" y="1325"><tspan x="530">第三步 · 最终提交</tspan><tspan x="530" dy="18" class="sub">本 FR 不再次拦截</tspan></text>
      </g></svg>`;
  }
})();
</script></body></html>
