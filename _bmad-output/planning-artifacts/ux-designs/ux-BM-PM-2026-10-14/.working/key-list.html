<head>
<meta charset="UTF-8">
<script>
(function() {

<title>BM-PM · 需求列表 — UX Demo</title>
<style>
/* DESIGN.md Brand & Style / Colors / Layout / Components · EXPERIENCE.md 列表 Flow 1–3 */
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-active: #1e40af;
  --primary-light: #eff6ff;
  --primary-border: #bfdbfe;
  --success: #16a34a; --success-bg: #f0fdf4; --success-border: #bbf7d0;
  --warning: #d97706; --warning-bg: #fffbeb; --warning-border: #fde68a;
  --danger:  #dc2626; --danger-bg:  #fef2f2; --danger-border:  #fca5a5;
  --info:    #0891b2; --info-bg:    #ecfeff; --info-border:    #a5f3fc;
  --bg: #f0f4f8;
  --surface: #ffffff;
  --surface-hover: #f8fafc;
  --border: #e8edf3;
  --border-hover: #c8d5e2;
  --text-primary: #18222f;
  --text-secondary: #4a5568;
  --text-muted: #9aa5b4;
  --text-disabled: #c8d5e2;
  --shadow-sm: 0 1px 4px rgba(30,40,60,0.06);
  --shadow:    0 2px 10px rgba(30,40,60,0.08);
  --shadow-lg: 0 8px 28px rgba(30,40,60,0.11);
  --shadow-xl: 0 16px 48px rgba(30,40,60,0.14);
  --radius-xs: 4px;
  --radius-sm: 7px;
  --radius:    10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --transition: all 0.16s ease;
  --transition-slow: all 0.28s ease;
  --topnav-h: 54px;
  --sidebar-w: 220px;
  --topnav-bg: linear-gradient(135deg, #dbeafe 0%, #ede9fe 40%, #e0f2fe 100%);
  --topnav-text: #3b4d6b;
  --topnav-text-active: #1e3a8a;
  --topnav-hover-bg: rgba(99,102,241,0.09);
  --topnav-active-bg: rgba(99,102,241,0.13);
  --topnav-border: rgba(148,163,196,0.25);
  --sidebar-bg: rgba(240,244,255,0.92);
  --sidebar-border: rgba(148,163,196,0.22);
  --glass-bg: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.55);
  --glass-shadow: 0 8px 32px rgba(30,40,80,0.10), inset 0 1px 0 rgba(255,255,255,0.8);
  --font: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', -apple-system, sans-serif;
  --mono: 'SFMono-Regular', 'Consolas', 'Monaco', monospace;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-hover: #273348;
  --border: #334155;
  --border-hover: #475569;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #475569;
  --text-disabled: #334155;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.3);
  --shadow:    0 2px 10px rgba(0,0,0,0.35);
  --shadow-lg: 0 8px 28px rgba(0,0,0,0.45);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.55);
  --topnav-bg: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0c1a2e 100%);
  --topnav-text: rgba(203,213,225,0.85);
  --topnav-text-active: #f1f5f9;
  --topnav-hover-bg: rgba(255,255,255,0.08);
  --topnav-active-bg: rgba(255,255,255,0.13);
  --topnav-border: rgba(255,255,255,0.10);
  --sidebar-bg: rgba(15,23,42,0.97);
  --sidebar-border: rgba(255,255,255,0.07);
  --glass-bg: rgba(30,41,59,0.65);
  --glass-border: rgba(255,255,255,0.08);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; min-width: 1280px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.6;
  overflow: auto;
  transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
}
body.use-gradient {
  background: linear-gradient(135deg, #e0e7ff 0%, #f0f4f8 40%, #e0f2fe 100%);
  background-attachment: fixed;
}
[data-theme="dark"] body.use-gradient {
  background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0c1a2e 100%);
}
.orb {
  position: fixed; pointer-events: none; z-index: 0; border-radius: 50%;
  width: 420px; height: 420px; filter: blur(8px);
}
.orb-a { top: -80px; left: 18%; background: radial-gradient(circle, rgba(99,102,241,0.15), transparent 60%); }
.orb-b { bottom: -40px; right: 8%; background: radial-gradient(circle, rgba(37,99,235,0.12), transparent 60%); }
[data-theme="dark"] .orb-a { background: radial-gradient(circle, rgba(99,102,241,0.25), transparent 60%); }

.topnav, .sidebar { backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
.topnav {
  position: fixed; top: 0; left: 0; right: 0; height: var(--topnav-h); z-index: 300;
  display: flex; align-items: stretch;
  background: var(--topnav-bg);
  border-bottom: 1px solid var(--topnav-border);
  box-shadow: 0 2px 16px rgba(99,102,241,0.10);
}
.logo {
  display: flex; align-items: center; gap: 8px; padding: 0 14px;
  border-right: 1px solid var(--topnav-border); min-width: var(--sidebar-w);
  font-weight: 700; font-size: 14px; color: var(--topnav-text-active); cursor: pointer;
}
.logo-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--primary); color: #fff;
  display: grid; place-items: center; font-size: 12px; font-weight: 700;
}
.pnav { display: flex; flex: 1; overflow-x: auto; }
.pnav-item {
  position: relative; height: 100%; padding: 0 14px;
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500; color: var(--topnav-text);
  background: none; border: 0; cursor: pointer; white-space: nowrap;
}
.pnav-item:hover { background: var(--topnav-hover-bg); }
.pnav-item.active { color: var(--topnav-text-active); font-weight: 600; background: var(--topnav-active-bg); }
.pnav-item.active::after {
  content: ''; position: absolute; bottom: 0; left: 10px; right: 10px;
  height: 2px; border-radius: 2px 2px 0 0; background: #4f46e5;
}
[data-theme="dark"] .pnav-item.active::after { background: rgba(255,255,255,0.85); }
.top-actions { display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent;
  color: var(--topnav-text); cursor: pointer; display: grid; place-items: center;
}
.icon-btn:hover { background: var(--topnav-hover-bg); }
.avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff;
  display: grid; place-items: center; font-size: 11px; font-weight: 600;
}

.sidebar {
  position: fixed; top: var(--topnav-h); bottom: 0; left: 0; width: var(--sidebar-w); z-index: 200;
  background: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border);
  box-shadow: 2px 0 12px rgba(99,102,241,0.07); padding: 10px 0;
}
[data-theme="dark"] .sidebar { box-shadow: 2px 0 12px rgba(0,0,0,0.3); }
.nav-label { font-size: 11px; color: var(--text-muted); padding: 8px 22px 4px; font-weight: 600; }
.nav-item, .nav-subitem {
  position: relative; display: flex; align-items: center; gap: 8px;
  margin: 1px 8px; width: calc(100% - 16px);
  border: 0; background: transparent; color: var(--text-secondary);
  cursor: pointer; text-align: left; font-family: inherit;
}
.nav-item { height: 40px; padding: 0 12px 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500; }
.nav-subitem { height: 36px; padding: 0 14px 0 40px; border-radius: 7px; font-size: 12.5px; }
.nav-item:hover, .nav-subitem:hover { background: var(--surface-hover); color: var(--text-primary); }
.nav-item.active {
  color: #2563eb; background: rgba(37,99,235,0.12); font-weight: 600;
}
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 7px; bottom: 7px;
  width: 3px; border-radius: 0 2px 2px 0; background: #2563eb;
}

.main {
  position: relative; z-index: 1;
  margin: var(--topnav-h) 0 0 var(--sidebar-w);
  height: calc(100% - var(--topnav-h));
  overflow: auto; padding: 0 20px 24px;
}
.breadcrumb { padding: 10px 0 0; font-size: 12px; color: var(--text-muted); }
.breadcrumb a { color: var(--primary); text-decoration: none; }
.sep { margin: 0 6px; color: var(--text-disabled); }
.page-header { display: flex; align-items: flex-start; justify-content: space-between; margin: 10px 0 16px; }
.page-title { font-size: 19px; font-weight: 700; line-height: 1.3; margin: 0; }
.page-desc { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--radius-lg);
}
.filter-card { padding: 16px 18px; margin-bottom: 14px; }
.filter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.filter-extra { display: none; }
.filter-card.expanded .filter-extra { display: contents; }
.filter-item label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.form-input-sm, .form-select-sm, .form-input {
  width: 100%; border: 1px solid var(--border); background: var(--surface);
  color: var(--text-primary); font-family: inherit;
}
.form-input-sm, .form-select-sm {
  height: 30px; padding: 0 9px; border-radius: 6px; font-size: 12px;
}
.form-input { height: 34px; padding: 0 10px; border-radius: var(--radius-sm); font-size: 13px; }
.form-input-sm:focus, .form-select-sm:focus, .form-input:focus {
  outline: 0; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
}
.filter-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border);
}
.filter-expand-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--primary); cursor: pointer;
  background: none; border: none; padding: 0; font-family: inherit;
}
.filter-actions { display: flex; gap: 8px; }

.btn {
  height: 34px; padding: 0 16px; font-size: 13px; border-radius: var(--radius-sm);
  border: 1px solid transparent; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; gap: 6px; transition: var(--transition);
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-sm { height: 30px; padding: 0 12px; font-size: 12px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-default { background: var(--surface); color: var(--text-primary); border-color: var(--border); }
.btn-default:hover { border-color: var(--border-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost { background: transparent; color: var(--text-secondary); }

.table-card { overflow: hidden; }
.table-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border); min-height: 52px;
}
.table-head-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.table-head-meta { font-size: 12px; color: var(--text-muted); font-weight: 400; }
.bulk-actions { display: none; align-items: center; gap: 8px; }
.table-head.selected .default-meta { display: none; }
.table-head.selected .bulk-actions { display: flex; }
.table-wrap { overflow: auto; max-height: calc(100vh - 420px); }
table { table-layout: fixed; width: 100%; border-collapse: collapse; }
thead th {
  background: var(--surface-hover); font-size: 12px; font-weight: 600;
  color: var(--text-secondary); letter-spacing: 0.5px;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  white-space: nowrap; position: sticky; top: 0; text-align: left;
}
[data-theme="dark"] thead th { background: rgba(39,51,72,0.8); }
tbody tr { height: 48px; border-bottom: 1px solid var(--border); cursor: pointer; }
tbody td { padding: 12px; font-size: 13px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tbody tr:hover { background: rgba(37,99,235,0.04); box-shadow: inset 3px 0 0 var(--primary); }
tbody tr.selected { background: rgba(37,99,235,0.06); box-shadow: inset 3px 0 0 var(--primary); }
.mono { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); }
.status-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: var(--radius-xs);
  font-size: 11px; font-weight: 600; width: fit-content; white-space: nowrap;
}
.status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.badge-success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
.badge-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
.badge-info { background: var(--info-bg); color: var(--info); border: 1px solid var(--info-border); }
.badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
[data-theme="dark"] .badge-info {
  background: rgba(8,145,178,0.18); color: #22d3ee; border-color: rgba(8,145,178,0.3);
}
.tag { padding: 2px 8px; border-radius: var(--radius-xs); font-size: 11px; font-weight: 600; width: fit-content; }
.tag-blue { background: #eff6ff; color: #2563eb; }
.tag-amber { background: #fffbeb; color: #92400e; }
.tag-purple { background: #faf5ff; color: #7c3aed; }
.action-cell { display: flex; align-items: center; gap: 2px; justify-content: flex-end; }
.col-action { position: sticky; right: 0; background: var(--surface); box-shadow: -2px 0 6px rgba(0,0,0,0.04); }
[data-theme="dark"] .col-action { background: var(--surface); }
.action-btn {
  width: 28px; height: 28px; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; cursor: pointer; background: transparent;
  transition: background 0.15s ease, color 0.15s ease; flex-shrink: 0;
}
.action-btn.view { color: var(--success); }
.action-btn.edit { color: var(--primary); }
.action-btn.delete { color: var(--danger); }
.action-btn.more { color: var(--text-secondary); }
.action-btn.view:hover { background: var(--success-bg); color: #15803d; }
.action-btn.edit:hover { background: var(--primary-light); color: var(--primary-hover); }
.action-btn.delete:hover { background: var(--danger-bg); color: #b91c1c; }
.action-btn.more:hover { background: var(--surface-hover); color: var(--text-primary); }
.action-btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

.pagination {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-top: 1px solid var(--border);
}
.page-btns { display: flex; gap: 4px; }
.page-btn {
  height: 30px; min-width: 30px; padding: 0 8px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-primary);
  cursor: pointer; font-family: inherit; font-size: 12px;
}
.page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.page-btn:disabled { opacity: 0.45; cursor: not-allowed; }

.empty-state { display: none; padding: 48px 16px; text-align: center; color: var(--text-muted); }
.empty-state.show { display: block; }
.empty-state svg { width: 64px; height: 64px; opacity: 0.25; }
.empty-state h3 { margin: 8px 0 4px; font-size: 14px; font-weight: 600; color: var(--text-primary); }

.overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 400;
}
.overlay.show { display: block; }
.modal {
  display: none; position: fixed; z-index: 500; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 640px; max-width: calc(100vw - 32px); max-height: 85vh;
  display: none; flex-direction: column;
}
.modal.show { display: flex; }
.modal-sm { width: 420px; }
.modal-head, .drawer-head, .modal-foot, .drawer-foot {
  padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.modal-foot, .drawer-foot { border-bottom: 0; border-top: 1px solid var(--border); justify-content: flex-end; gap: 8px; }
.modal-body, .drawer-body { padding: 16px 18px; overflow: auto; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid-1 { display: grid; grid-template-columns: 1fr; gap: 12px; }
.req { color: var(--danger); margin-left: 2px; }
.field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 90vw; z-index: 500;
  transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column;
}
.drawer.show { transform: translateX(0); }

.toast-container {
  position: fixed; top: 66px; right: 22px; z-index: 9998;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  min-width: 200px; max-width: 340px; padding: 11px 13px 11px 14px;
  border-left: 3px solid; border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 8px; font-size: 13px;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.info { border-left-color: var(--info); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body class="use-gradient">
<div class="orb orb-a"></div>
<div class="orb orb-b"></div>

<header class="topnav">

<aside class="sidebar" id="sidebar"></aside>

<main class="main">
  <nav class="breadcrumb">

    <a href="#" id="crumbMod">需求</a><span class="sep">/</span>

      <div class="filter-item filter-extra"><label>负责人</label><input class="form-input-sm" id="fOwner" placeholder="姓名"></div>
      <div class="filter-item filter-extra"><label>模块</label><input class="form-input-sm" placeholder="模块名"></div>
      <div class="filter-item filter-extra"><label>来源</label><input class="form-input-sm" placeholder="来源"></div>
    </div>
    <div class="filter-footer">
      <button class="filter-expand-btn" type="button" id="expandBtn">展开更多
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="filter-actions">
        <button class="btn btn-default btn-sm" type="button" id="btnReset">重置</button>
        <button class="btn btn-primary btn-sm" type="button" id="btnQuery">查询</button>
      </div>
    </div>
  </section>

  <section class="glass-card table-card">
    <div class="table-head" id="tableHead">
      <div class="table-head-title">需求
        <span class="table-head-meta default-meta" id="countMeta">共 6 条</span>
      </div>
      <div class="default-meta table-head-meta">20条/页</div>
      <div class="bulk-actions">
        <span class="table-head-meta" id="selMeta">已选 0 项</span>
        <button class="btn btn-danger btn-sm" type="button" id="btnBulkDel">批量删除</button>
        <button class="btn btn-ghost btn-sm" type="button" id="btnBulkCancel">取消</button>
      </div>
    </div>
    <div class="table-wrap" id="tableWrap">
      <table>
        <colgroup>
          <col style="width:44px"><col style="width:90px"><col>
          <col style="width:100px"><col style="width:90px"><col style="width:100px">
          <col style="width:150px"><col style="width:120px">
        </colgroup>
        <thead>
          <tr>
            <th><input type="checkbox" id="checkAll"></th>
            <th>编号</th><th>标题</th><th>状态</th><th>优先级</th><th>负责人</th><th>更新时间</th><th class="col-action">操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty-state" id="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
        <h3>暂无数据</h3>
        <p>没有符合条件的需求，请调整筛选后查询。</p>
      </div>
    </div>
    <div class="pagination">
      <div id="pageLeft">共 6 条，第 1/1 页</div>
      <div class="page-btns">
        <button class="page-btn" disabled>首页</button>
        <button class="page-btn" disabled>上一页</button>
        <button class="page-btn active">1</button>
        <button class="page-btn" disabled>下一页</button>
        <button class="page-btn" disabled>末页</button>
      </div>
      <select class="form-select-sm page-size-select" style="width:auto">
        <option>10条/页</option>
        <option selected>20条/页</option>
        <option>50条/页</option>
      </select>
    </div>
  </section>
</main>

<div class="overlay" id="overlay"></div>

<div class="glass-card modal" id="modalCreate">
  <div class="modal-head"><strong>新建需求</strong><button class="icon-btn" type="button" data-close="create" title="关闭">✕</button></div>
  <div class="modal-body">
    <div class="form-grid-2">
      <div class="field"><label>标题<span class="req">*</span></label><input class="form-input" placeholder="一句话描述需求"></div>
      <div class="field"><label>优先级<span class="req">*</span></label>
        <select class="form-input"><option>P1</option><option>P0</option><option>P2</option></select>
      </div>
      <div class="field"><label>负责人</label><input class="form-input" value="林安"></div>
      <div class="field"><label>状态</label><select class="form-input"><option>待处理</option><option>进行中</option></select></div>
      <div class="field" style="grid-column:1/-1"><label>说明</label><input class="form-input" placeholder="补充背景（选填）"></div>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn btn-ghost" type="button" data-close="create">取消</button>
    <button class="btn btn-primary" type="button" id="saveCreate">保存</button>
  </div>
</div>

<div class="glass-card modal modal-sm" id="modalDel">
  <div class="modal-head"><strong>确认删除？</strong></div>
  <div class="modal-body" id="delBody">即将删除选中记录，此操作不可撤销。</div>
  <div class="modal-foot">
    <button class="btn btn-default" type="button" data-close="del">取消</button>
    <button class="btn btn-danger" type="button" id="confirmDel">确认删除</button>
  </div>
</div>

<aside class="glass-card drawer" id="drawer">
  <div class="drawer-head"><strong>编辑需求</strong><button class="icon-btn" type="button" data-close="drawer" title="关闭">✕</button></div>
  <div class="drawer-body">
    <div class="form-grid-2" style="grid-template-columns:1fr 1fr">
      <div class="field" style="grid-column:1/-1"><label>标题<span class="req">*</span></label><input class="form-input" id="dTitle"></div>
      <div class="field"><label>优先级</label><select class="form-input"><option>P0</option><option>P1</option><option>P2</option></select></div>
      <div class="field"><label>状态</label><select class="form-input"><option>待处理</option><option>进行中</option><option>已完成</option></select></div>
      <div class="field"><label>负责人</label><input class="form-input" value="林安"></div>
      <div class="field"><label>模块</label><input class="form-input" value="规划"></div>
      <div class="field"><label>开始日期</label><input class="form-input" type="date"></div>
      <div class="field"><label>结束日期</label><input class="form-input" type="date"></div>
      <div class="field" style="grid-column:1/-1"><label>说明</label><input class="form-input" placeholder="补充说明"></div>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn btn-ghost" type="button" data-close="drawer">取消</button>
    <button class="btn btn-primary" type="button" id="saveDrawer">保存</button>
  </div>
</aside>

<div class="toast-container" id="toasts"></div>

<script>
const LINES = {
  youbao: {
    name: '右豹主业务',
    label: '需求管理',
    crumbMod: '需求',
    items: ['需求列表', '分类配置']
  },
  mentor: {
    name: '导师商务',
    label: '商务管理',
    crumbMod: '商务',
    items: ['导师列表', '商务线索']
  },
  ent: {
    name: '企业号',
    label: '企业号',
    crumbMod: '运营',
    items: ['账号列表', '内容发布']
  }
};
const NAV_ICO = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg>';

function setLine(id){
  const line = LINES[id];
  document.querySelectorAll('#lineNav .pnav-item').forEach(b=>b.classList.toggle('active', b.dataset.line===id));
  document.getElementById('crumbLine').textContent = line.name;
  document.getElementById('crumbMod').textContent = line.crumbMod;
  document.getElementById('crumbLast').textContent = line.items[0];
  document.querySelector('.page-title').textContent = line.items[0];
  document.getElementById('sidebar').innerHTML =
    `<div class="nav-label">${line.label}</div>` +
    line.items.map((t,i)=>`<button class="nav-item${i===0?' active':''}" type="button">${NAV_ICO}<span class="nav-text">${t}</span></button>`).join('');
  document.getElementById('checkAll').checked = false;
  closeModals(); closeDrawer();
}

const ROWS = [
  {id:'REQ-1042', title:'需求列表支持按负责人筛选', status:'进行中', pri:'P0', tag:'tag-purple', owner:'林安', time:'2026-10-15 14:20'},
  {id:'REQ-1038', title:'迭代看板同步故事状态', status:'待处理', pri:'P1', tag:'tag-amber', owner:'陈舟', time:'2026-10-14 09:12'},
  {id:'REQ-1031', title:'评审记录导出 Excel', status:'已完成', pri:'P2', tag:'tag-blue', owner:'林安', time:'2026-10-12 18:03'},
  {id:'REQ-1026', title:'无权限按钮保持占位不隐藏', status:'进行中', pri:'P1', tag:'tag-blue', owner:'周衡', time:'2026-10-11 11:44'},
  {id:'REQ-1019', title:'主题切换避免刷新闪白', status:'已完成', pri:'P0', tag:'tag-purple', owner:'林安', time:'2026-10-10 16:08'},
  {id:'REQ-1012', title:'抽屉字段超过 14 个改走详情页', status:'待处理', pri:'P1', tag:'tag-amber', owner:'陈舟', time:'2026-10-09 10:27'}
];
const badge = { '进行中':'badge-info', '待处理':'badge-warning', '已完成':'badge-success' };
let filtered = ROWS.slice();
let delTarget = null;

function icon(name){
  const p = {
    view:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
    edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
    delete:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>',
    more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>'
  };
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${p[name]}</svg>`;
}

function render(){
  const tb = document.getElementById('tbody');
  tb.innerHTML = filtered.map((r,i)=>`
    <tr data-i="${i}">
      <td><input type="checkbox" class="row-check"></td>
      <td class="mono">${r.id}</td>
      <td title="${r.title}">${r.title}</td>
      <td><span class="status-badge ${badge[r.status]}"><span class="status-dot"></span>${r.status}</span></td>
      <td><span class="tag ${r.tag}">${r.pri}</span></td>
      <td>${r.owner}</td>
      <td>${r.time}</td>
      <td class="col-action"><div class="action-cell">
        <button class="action-btn view" title="查看">${icon('view')}</button>
        <button class="action-btn edit" title="编辑">${icon('edit')}</button>
        <button class="action-btn delete" title="删除">${icon('delete')}</button>
        <button class="action-btn more" title="更多">${icon('more')}</button>
      </div></td>
    </tr>`).join('');
  document.getElementById('empty').classList.toggle('show', filtered.length===0);
  document.getElementById('tableWrap').querySelector('table').style.display = filtered.length? 'table':'none';
  document.getElementById('countMeta').textContent = '共 '+filtered.length+' 条';
  document.getElementById('pageLeft').textContent = '共 '+filtered.length+' 条，第 1/1 页';
  bindRows();
  syncBulk();
}

function selectedRows(){ return [...document.querySelectorAll('.row-check')].filter(c=>c.checked); }
function syncBulk(){
  const n = selectedRows().length;
  const head = document.getElementById('tableHead');
  head.classList.toggle('selected', n>0);
  document.getElementById('selMeta').textContent = '已选 '+n+' 项';
  document.querySelectorAll('tbody tr').forEach(tr=>{
    tr.classList.toggle('selected', tr.querySelector('.row-check')?.checked);
  });
}
function bindRows(){
  document.querySelectorAll('.row-check').forEach(c=>c.addEventListener('change', syncBulk));
  document.querySelectorAll('.action-btn.edit').forEach(btn=>btn.addEventListener('click', e=>{
    e.stopPropagation(); openDrawer(e.currentTarget.closest('tr').querySelector('td:nth-child(3)').textContent);
  }));
  document.querySelectorAll('.action-btn.delete').forEach(btn=>btn.addEventListener('click', e=>{
    e.stopPropagation();
    const name = e.currentTarget.closest('tr').querySelector('td:nth-child(3)').textContent;
    delTarget = 'one';
    document.getElementById('delBody').textContent = '即将删除「'+name+'」，此操作不可撤销。';
    openDel();
  }));
  document.querySelectorAll('.action-btn.view').forEach(btn=>btn.addEventListener('click', e=>{
    e.stopPropagation(); toast('已进入查看（Demo 不跳详情页）','info');
  }));
}
function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 2500);
}
function openCreate(){ document.getElementById('overlay').classList.add('show'); document.getElementById('modalCreate').classList.add('show'); }
function openDel(){ document.getElementById('overlay').classList.add('show'); document.getElementById('modalDel').classList.add('show'); }
function closeModals(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modalCreate').classList.remove('show');
  document.getElementById('modalDel').classList.remove('show');
}
function openDrawer(title){
  document.getElementById('dTitle').value = title || '';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
  if(!document.getElementById('modalCreate').classList.contains('show') && !document.getElementById('modalDel').classList.contains('show'))
    document.getElementById('overlay').classList.remove('show');
}

document.getElementById('themeBtn').onclick = function(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
};
document.getElementById('expandBtn').onclick = function(){
  const card = document.getElementById('filterCard');
  card.classList.toggle('expanded');
  this.classList.toggle('expanded');
  this.childNodes[0].textContent = card.classList.contains('expanded') ? '收起 ' : '展开更多 ';
};
document.getElementById('btnReset').onclick = function(){
  ['fTitle','fStatus','fStart','fEnd','fPri','fOwner'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  toast('筛选条件已重置','info');
};
document.getElementById('btnQuery').onclick = function(){
  const t = document.getElementById('fTitle').value.trim();
  const s = document.getElementById('fStatus').value;
  filtered = ROWS.filter(r => (!t || r.title.includes(t)) && (!s || r.status===s));
  render();
};
document.getElementById('checkAll').onchange = function(){
  document.querySelectorAll('.row-check').forEach(c=>c.checked=this.checked);
  syncBulk();
};
document.getElementById('btnBulkCancel').onclick = function(){
  document.getElementById('checkAll').checked=false;
  document.querySelectorAll('.row-check').forEach(c=>c.checked=false);
  syncBulk();
};
document.getElementById('btnBulkDel').onclick = function(){
  const n = selectedRows().length;
  delTarget = 'bulk';
  document.getElementById('delBody').textContent = '即将删除 '+n+' 条记录，此操作不可撤销。';
  openDel();
};
document.getElementById('btnCreate').onclick = openCreate;
document.getElementById('saveCreate').onclick = function(){ closeModals(); toast('保存成功','success'); };
document.getElementById('saveDrawer').onclick = function(){ closeDrawer(); toast('保存成功','success'); };
document.getElementById('confirmDel').onclick = function(){ closeModals(); toast('已删除','success'); document.getElementById('btnBulkCancel').click(); };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=function(){
  const k=this.getAttribute('data-close');
  if(k==='drawer') closeDrawer(); else closeModals();
});
document.getElementById('overlay').onclick = function(){
  if(document.getElementById('modalDel').classList.contains('show')) return;
  closeModals(); closeDrawer();
};
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('modalDel').classList.contains('show')) { closeModals(); return; }
  if(document.getElementById('drawer').classList.contains('show')) { closeDrawer(); return; }
  closeModals();
});
document.getElementById('lineNav').addEventListener('click', e=>{
  const btn = e.target.closest('.pnav-item');
  if(!btn) return;
  setLine(btn.dataset.line);
  toast('已切换到「'+LINES[btn.dataset.line].name+'」','info');
});
setLine('youbao');
render();
</script>
</body>
</html>
