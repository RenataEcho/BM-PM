      <stop offset="1" stop-color="#ff4d22"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.48" stop-color="#fff3ec" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ffd8c8" stop-opacity="0.9"/>
