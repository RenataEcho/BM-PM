<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>快捷图标 · 新手必看 / 项目教学 / 推文教程 / 海外课程</title>
<style>
  /* 受 DESIGN.md Components「快捷图标」、Layout、Shapes 约束。 */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: #f6f7fb;
    color: #252836;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    padding: 28px 20px 48px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 800;
  }
  .note {
    margin: 0 0 18px;
    font-size: 12px;
    color: #9498a8;
  }
  .card {
    width: 366px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 10px rgba(45, 55, 85, 0.025);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 14px 4px 12px;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .col:active { opacity: 0.72; }
  .col:focus { outline: none; }
  .col:focus-visible {
    outline: 2px solid #ff4d22;
    outline-offset: 4px;
    border-radius: 10px;
  }
  .label {
    font-size: 12px;
    font-weight: 600;
    line-height: 1.2;
    color: #252836;
    white-space: nowrap;
  }
  .zoom {
    margin-top: 28px;
    display: flex;
    gap: 28px;
    align-items: flex-end;
  }
  .zoom figure { margin: 0; text-align: center; }
  .zoom figcaption {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
  }
  .tile-lg { width: 132px; height: 132px; border-radius: 42px; }
  .tile-lg .glyph { width: 78px; height: 78px; }
</style>
</head>
<body>
  <h1>金刚区 · 真实尺寸 44px</h1>
  <p class="note">符号待确认。底板与橙渐变沿用移动端设计规范。</p>

  <div class="card" id="row">
    <button class="col" type="button" aria-label="新手必看">
      <span class="tile" data-icon="sprout"></span>
      <span class="label">新手必看</span>
    </button>
    <button class="col" type="button" aria-label="项目教学">
      <span class="tile" data-icon="folder"></span>
      <span class="label">项目教学</span>
    </button>
    <button class="col" type="button" aria-label="推文教程">
      <span class="tile" data-icon="post"></span>
      <span class="label">推文教程</span>
    </button>
    <button class="col" type="button" aria-label="海外课程">
      <span class="tile" data-icon="globe"></span>
      <span class="label">海外课程</span>
    </button>
  </div>

  <div class="zoom" id="zoom"></div>

  <svg width="0" height="0" aria-hidden="true">
    <defs>
      <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff7a52"/>
        <stop offset="1" stop-color="#ff4d22"/>
      </linearGradient>
      <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
        <stop offset="0.48" stop-color="#fff3ec" stop-opacity="0.78"/>
        <stop offset="1" stop-color="#ffd8c8" stop-opacity="0.9"/>
      </linearGradient>
      <radialGradient id="glow" cx="78%" cy="86%" r="58%">
        <stop offset="0" stop-color="#ff4d22" stop-opacity="0.5"/>
        <stop offset="1" stop-color="#ff4d22" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>

<script>
const glyphs = {
  sprout: `<g fill="url(#ink)">
    <path d="M6.7 18.1h12.6c.5 0 .86.48.72.96l-1.2 3.7a1.55 1.55 0 0 1-1.48 1.08H8.66a1.55 1.55 0 0 1-1.48-1.08l-1.2-3.7c-.14-.48.22-.96.72-.96z"/>
    <rect x="11.7" y="12.5" width="2.6" height="6" rx="1.3"/>
    <path d="M12.9 13.6C12.5 9.2 8 7.5 4.8 9.3c-.75.42-.62 1.55.22 1.9 2.55 1.05 5.2 2.05 7.88 2.4z"/>
    <path d="M13.3 12.7c.85-4 5.2-5.35 8-3.3.65.48.38 1.55-.35 1.9-2.7 1.25-5.35 1.8-7.65 1.4z"/>
  </g>`,
  folder: `<path fill="url(#ink)" fill-rule="evenodd" d="M3.2 11h5.5l2.3-4h9.4c1.3 0 2.3 1.05 2.3 2.35v10.5c0 1.3-1 2.35-2.3 2.35H5.5c-1.3 0-2.3-1.05-2.3-2.35V11zm6.15 2.55 6.9 3.85-6.9 3.85v-7.7z"/>`,
  post: `<path fill="url(#ink)" fill-rule="evenodd" d="M5.15 4.4h14.3c1.5 0 2.7 1.18 2.7 2.65v7.7c0 1.47-1.2 2.65-2.7 2.65h-6.15L9.7 21.55v-4.15H5.15c-1.5 0-2.7-1.18-2.7-2.65V7.05c0-1.47 1.2-2.65 2.7-2.65zM6.9 8.55h6.4c.7 0 1.25.52 1.25 1.15S14 10.85 13.3 10.85H6.9c-.7 0-1.25-.52-1.25-1.15s.55-1.15 1.25-1.15zm0 3.85h9.7c.7 0 1.25.52 1.25 1.15s-.55 1.15-1.25 1.15H6.9c-.7 0-1.25-.52-1.25-1.15s.55-1.15 1.25-1.15z"/>`,
  globe: `<g>
    <mask id="globeMaskID" maskUnits="userSpaceOnUse" x="0" y="0" width="26" height="26">
      <circle cx="13" cy="13" r="9.7" fill="white"/>
      <ellipse cx="13" cy="13" rx="4.4" ry="9.35" fill="none" stroke="black" stroke-width="1.7"/>
      <ellipse cx="13" cy="13" rx="9.35" ry="3.15" fill="none" stroke="black" stroke-width="1.45"/>
    </mask>
    <circle cx="13" cy="13" r="9.7" fill="url(#ink)" mask="url(#globeMaskID)"/>
  </g>`
};

function tile(name, large) {
  const cls = large ? "tile tile-lg" : "tile";
  return `<span class="${cls}" aria-hidden="true">
    <svg viewBox="0 0 44 44">
      <defs>
        <clipPath id="clip-${name}${large ? "-lg" : ""}"><rect width="44" height="44" rx="14"/></clipPath>
      </defs>
      <g clip-path="url(#clip-${name}${large ? "-lg" : ""})">
        <rect width="44" height="44" fill="url(#glass)"/>
        <rect width="44" height="44" fill="url(#glow)"/>
        <rect x="0" y="0" width="44" height="14" fill="#ffffff" opacity="0.42"/>
        <rect x="0" y="32" width="44" height="12" fill="#ff6a3c" opacity="0.16"/>
        <g class="glyph" transform="translate(9 9)">${glyphs[name].replaceAll("globeMaskID", "globeMask-" + name + (large ? "-lg" : ""))}</g>
      </g>
      <rect x="0.6" y="0.6" width="42.8" height="42.8" rx="13.4" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.2"/>
    </svg>
  </span>`;
}

document.querySelectorAll(".tile[data-icon]").forEach((node) => {
  const name = node.dataset.icon;
  node.outerHTML = tile(name, false);
});

const labels = ["新手必看", "项目教学", "推文教程", "海外课程"];
const keys = ["sprout", "folder", "post", "globe"];
document.getElementById("zoom").innerHTML = keys.map((key, i) =>
  `<figure>${tile(key, true)}<figcaption>${labels[i]}</figcaption></figure>`
).join("");
</script>
<style>
  .tile { width: 44px; height: 44px; display: block; }
  .tile svg { width: 100%; height: 100%; display: block; }
  .tile .glyph { /* glyph group is transformed; css width unused */ }
</style>
</body>
</html>
