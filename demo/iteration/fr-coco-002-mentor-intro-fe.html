<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>导师个人介绍</title>
  <style>
    :root{--brand:#ff4d22;--brand-hover:#ff6c46;--ink:#252836;--sub:#9498a8;--line:#eceef3;--bg:#f6f7fb}
    *{box-sizing:border-box}body{margin:0;background:#e8eaf0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.phone{width:375px;height:812px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}.status{padding:16px 22px 7px;display:flex;justify-content:space-between;font-size:12px;font-weight:650;background:#fff}.nav{height:54px;background:#fff;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;text-align:center}.nav h1{font-size:18px;margin:0}.back{border:0;background:none;font-size:27px}.content{flex:1;overflow:auto;padding:18px 16px 24px}.card{background:#fff;border-radius:16px;padding:4px 16px;box-shadow:0 3px 10px #2d375506}.field{padding:14px 0}.field+.field{border-top:1px solid var(--line)}label,.label{display:block;margin-bottom:8px;font-size:13px;font-weight:650}.avatar-line{display:flex;align-items:center;gap:14px}.avatar{width:64px;height:64px;border-radius:50%;background:#fff1ec;color:var(--brand);display:grid;place-items:center;font-size:22px;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.avatar-action{border:0;background:transparent;color:var(--brand);padding:10px 0;font-weight:650}.control{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;color:var(--ink)}.control[readonly]{background:var(--bg);color:var(--sub)}textarea.control{height:170px;resize:vertical;line-height:1.7}.help{margin:9px 2px 16px;color:var(--sub);font-size:12px;line-height:1.6}.footer{flex:none;padding:12px 16px 20px;background:#fff;border-top:1px solid var(--line)}.save{width:100%;height:48px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;font-weight:700}.save:hover:not(:disabled){background:var(--brand-hover)}.save:disabled{opacity:.6}.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:#252836;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;white-space:nowrap}.toast[hidden]{display:none}input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}@media(min-width:600px){body{padding:20px}.phone{border-radius:28px;box-shadow:0 10px 36px #151a2a1f}}
  </style>
</head>
<body>
  <main class="phone">
    <div class="status"><span>9:41</span><span aria-label="信号、无线网络与电量">▮▮▮　⌁　▰</span></div>
    <header class="nav"><button class="back" type="button" aria-label="返回">‹</button><h1>个人介绍</h1><span></span></header>
    <section class="content">
      <div class="card">
        <div class="field"><span class="label">头像</span><div class="avatar-line"><div class="avatar" id="avatar" role="img" aria-label="当前头像"></div><button class="avatar-action" id="chooseAvatar" type="button">更换头像</button><input id="avatarInput" type="file" accept="image/*" hidden></div></div>
        <div class="field"><label for="nickname">昵称</label><input class="control" id="nickname" type="text"></div>
        <div class="field"><label for="identity">当前身份</label><input class="control" id="identity" value="导师长" readonly aria-readonly="true"></div>
        <div class="field"><label for="intro">个人介绍</label><textarea class="control" id="intro"></textarea></div>
      </div>
      <p class="help">头像、昵称和个人介绍将统一保存；当前身份由后台配置，不支持修改。字段限制待确认，本 Demo 不增加额外校验。</p>
    </section>
    <footer class="footer"><button class="save" id="save" type="button">保存</button></footer>
  </main>
  <div class="toast" id="toast" role="status" hidden>保存成功</div>
  <script>
    var DEFAULT_PROFILE={name:"周衡",avatarDataUrl:"",intro:"负责星火创业社的项目方向。新成员加入后，会先讲清项目机制、参与条件和内容要求，再结合成员情况给出执行建议。"};
    var MESSAGE_ORIGIN=location.origin;
    var savedProfile=Object.assign({},DEFAULT_PROFILE);
    var draftProfile=Object.assign({},savedProfile);
    var nickname=document.getElementById("nickname"),intro=document.getElementById("intro"),avatar=document.getElementById("avatar"),save=document.getElementById("save"),timer;
    var avatarReadVersion=0,avatarReader=null,avatarReading=false,saving=false;
    function validProfile(value){return value&&typeof value==="object"&&typeof value.name==="string"&&typeof value.intro==="string"&&typeof value.avatarDataUrl==="string"&&(!value.avatarDataUrl||value.avatarDataUrl.indexOf("data:image/")===0)}
    function updateSaveState(){save.disabled=avatarReading||saving;save.textContent=avatarReading?"头像读取中…":"保存"}
    function showToast(message){
      var toast=document.getElementById("toast");toast.textContent=message;toast.hidden=false;clearTimeout(timer);
      timer=setTimeout(function(){toast.hidden=true},2200);
    }
    function draw(){
      nickname.value=draftProfile.name;intro.value=draftProfile.intro;
      avatar.innerHTML=draftProfile.avatarDataUrl?'<img alt="" src="'+draftProfile.avatarDataUrl+'">':draftProfile.name.slice(0,1);
    }
    function acceptProfile(next){savedProfile=Object.assign({},DEFAULT_PROFILE,next||{});draftProfile=Object.assign({},savedProfile);draw()}
    document.getElementById("chooseAvatar").onclick=function(){document.getElementById("avatarInput").click()};
    avatar.onclick=document.getElementById("chooseAvatar").onclick;
    document.getElementById("avatarInput").onchange=function(){
      var file=this.files&&this.files[0];if(!file)return;
      var version=++avatarReadVersion;
      if(avatarReader&&avatarReader.readyState===FileReader.LOADING)avatarReader.abort();
      var reader=new FileReader();avatarReader=reader;avatarReading=true;updateSaveState();
      function finish(error){
        if(version!==avatarReadVersion)return;
        avatarReader=null;avatarReading=false;updateSaveState();
        if(error)showToast("头像读取失败，请重试");
      }
      reader.onload=function(){
        if(version!==avatarReadVersion)return;
        var result=String(reader.result||"");
        if(result.indexOf("data:image/")!==0){finish(true);return}
        draftProfile.avatarDataUrl=result;draw();finish(false);
      };
      reader.onerror=function(){finish(true)};
      reader.onabort=function(){finish(true)};
      try{reader.readAsDataURL(file)}catch(error){finish(true)}
    };
    nickname.oninput=function(){draftProfile.name=nickname.value};intro.oninput=function(){draftProfile.intro=intro.value};
    save.onclick=function(){
      if(avatarReading||saving)return;
      saving=true;updateSaveState();savedProfile=Object.assign({},draftProfile);
      if(parent!==window)parent.postMessage({type:"coco-002-profile-save",profile:savedProfile},MESSAGE_ORIGIN);
      showToast("保存成功");
      setTimeout(function(){saving=false;updateSaveState()},700);
    };
    document.querySelector(".back").onclick=function(event){event.preventDefault()};
    window.addEventListener("message",function(event){var data=event.data||{};if(event.origin!==MESSAGE_ORIGIN||event.source!==parent||!data||typeof data!=="object"||data.type!=="coco-002-state"||!validProfile(data.profile))return;acceptProfile(data.profile)});
    acceptProfile(DEFAULT_PROFILE);
    if(parent!==window)parent.postMessage({type:"coco-002-ready"},MESSAGE_ORIGIN);
  </script>
</body>
</html>
