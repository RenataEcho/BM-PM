const agencies=[{id:1,name:'右豹KOC',icon:'豹',official:true,free:true,count:8,tracks:'小说推文 · 短剧推广',summary:'右豹官方免费交流服务体系，提供项目公告、规则同步、基础教程和常见问题答疑。',intro:'右豹KOC是右豹官方推出的免费交流服务体系，面向小说推文、短剧推广、漫剧推广、网盘资源、人工智能工具、泛应用、AI短漫剧、游戏达人、泛知识等多个赛道，提供系统化的免费训练支持。服务内容涵盖项目公告、规则同步、基础教程和常见问题答疑，帮助成员快速掌握核心要点，降低实操门槛。',services:'小说推文、短剧推广、漫剧推广、网盘资源、人工智能工具、泛应用、AI短漫剧、游戏达人、泛知识',communities:[['一键代发官方交流社区','小说推文','▶'],['右豹海外文娱新手培训营','短剧推广','▶'],['右豹工具新手培训营','AI工具','✦'],['网盘交流社区','网盘资源','▣'],['右豹番茄小说新手培训营','小说推文','书'],['右豹红短新手培训营','短剧推广','▶'],['右豹知乎新手培训营','小说推文','知'],['右豹红漫新手培训营','漫剧推广','▶']],teams:[['右豹小说推广导师团','小说推文 · 网盘资源','师'],['右豹短剧运营导师团','短剧推广 · 漫剧推广','师'],['右豹AI工具导师团','AI工具','师']]}];
