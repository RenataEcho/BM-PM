const agencies=[{id:1,name:'右豹KOC',icon:'豹',official:true,free:true,count:8,tracks:'小说推文 · 短剧推广',summary:'右豹官方免费交流服务体系，提供项目公告、规则同步、基础教程和常见问题答疑。',intro:'右豹KOC是右豹官方推出的免费交流服务体系，面向小说推文、短剧推广、漫剧推广、网盘资源、人工智能工具、泛应用、AI短漫剧、游戏达人、泛知识等多个赛道，提供系统化的免费训练支持。服务内容涵盖项目公告、规则同步、基础教程和常见问题答疑，帮助成员快速掌握核心要点，降低实操门槛。',services:'小说推文、短剧推广、漫剧推广、网盘资源、人工智能工具、泛应用、AI短漫剧、游戏达人、泛知识',communities:[['一键代发官方交流社区','小说推文','▶'],['右豹海外文娱新手培训营','短剧推广','▶'],['右豹工具新手培训营','AI工具','✦'],['右豹网盘新手培训营','网盘资源','▣'],['右豹番茄小说新手培训营','小说推文','书'],['右豹红短新手培训营','短剧推广','▶'],['右豹知乎新手培训营','小说推文','知'],['右豹红漫新手培训营','漫剧推广','▶']],teams:[['右豹小说推广导师团','小说推文 · 网盘资源','师'],['右豹短剧运营导师团','短剧推广 · 漫剧推广','师'],['右豹AI工具导师团','AI工具','师']]},{id:2,name:'第一馆',icon:'馆',free:true,count:5,tracks:'小说推文 · 短剧推广',summary:'右豹认证的内容创作型专业交付机构，覆盖小说推文、短剧推广、漫剧推广及网盘资源。',intro:'第一馆专注于内容创作与项目实操指导，为不同成长阶段的创作者提供训练营、实操答疑与项目支持。',services:'小说推文、短剧推广、漫剧推广、网盘资源',communities:[['知乎知识会员官方交流社区','泛知识','知'],['网盘官方交流社区2群','网盘资源','▣'],['红短官方交流社区2群','短剧推广','▶'],['第一馆小说实战营','小说推文','书'],['第一馆漫剧交流营','漫剧推广','▶']],teams:[['第一馆内容创作导师团','小说推文 · 短剧推广','师'],['第一馆漫剧导师团','漫剧推广','师']]},{id:3,name:'星火成长',icon:'星',free:true,count:3,tracks:'AI工具 · 小说推文',summary:'面向新人的实操交流与项目成长服务。',intro:'星火成长专注新人成长、项目答疑与经验交流。',services:'AI工具、小说推文',communities:[['星火AI工具社群','AI工具','✦'],['星火小说推广社群','小说推文','书'],['星火新人交流社群','新人入门','▶']],teams:[['星火成长导师团','AI工具 · 小说推文','师']]},{id:4,name:'创客营',icon:'创',free:false,count:4,tracks:'短剧推广 · 漫剧推广',summary:'短剧与漫剧赛道实操训练服务。',intro:'创客营聚焦短剧推广与漫剧创作的项目训练和社群服务。',services:'短剧推广、漫剧推广',communities:[['创客短剧交流社群','短剧推广','▶'],['创客漫剧训练营','漫剧推广','▶'],['创客新手社群','新人入门','✦'],['创客实战交流社群','短剧推广','▶']],teams:[['创客短剧导师团','短剧推广','师'],['创客漫剧导师团','漫剧推广','师']]},{id:5,name:'云启学院',icon:'云',free:true,count:2,tracks:'网盘资源 · AI工具',summary:'提供网盘资源和AI工具项目的交流服务。',intro:'云启学院面向网盘资源与AI工具赛道用户，提供项目交流与基础教学。',services:'网盘资源、AI工具',communities:[['云启网盘交流社群','网盘资源','▣'],['云启AI工具交流社群','AI工具','✦']],teams:[['云启资源导师团','网盘资源 · AI工具','师']]}];
let page='detail',agencyId=1,tab='communities',keyword='',expanded={},introExpanded=false,communityName='',previousPage='detail';
const el=document.getElementById('view');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const logo=(s)=>`<span class="logo">${esc(s)}</span>`;
function row(x,type){return `<div class="item" onclick="handleItem('${type}','${encodeURIComponent(x[0])}')">${logo(x[2])}<div class="grow"><div class="name">${esc(x[0])}</div><div class="sub">${esc(x[1])}</div></div><span class="chev">›</span></div>`}
function agencyCard(a){let matches=a.communities.filter(x=>!keyword||[...x,a.name,a.tracks].join(' ').toLowerCase().includes(keyword.toLowerCase()));let all=!keyword||[a.name,a.tracks,a.summary].join(' ').toLowerCase().includes(keyword.toLowerCase());if(!matches.length&&!all)return '';let entries=keyword&&!all?matches:a.communities;let open=expanded[a.id]||!!keyword;return `<div class="agency"><div class="agencyTop" onclick="openAgency(${a.id})">${logo(a.icon)}<div class="grow"><div class="name">${esc(a.name)}${a.official?'<span class="tag">官方</span>':''}<span class="tag blue">${a.free?'免费':'付费'}</span></div><div class="sub"><b style="color:#fa593c;font-size:15px">${a.count}</b> 个社群 · ${esc(a.tracks)}</div><div class="desc">${esc(a.summary)}</div></div><span class="chev">›</span></div><div class="communityList">${entries.slice(0,open?100:3).map(x=>row(x,'community')).join('')}${entries.length>3&&!keyword?`<div class="more" onclick="toggle(${a.id})">${open?'收起':'查看全部 '+entries.length+' 个社群'} ${open?'⌃':'⌄'}</div>`:''}</div></div>`}
function renderList(){document.getElementById('title').textContent='OPC服务机构';el.innerHTML=`<div class="page"><div class="search"><input id="search" placeholder="搜索机构、社群或赛道" value="${esc(keyword)}" oninput="searchChange(this.value)"><button onclick="searchChange(document.getElementById('search').value)">搜索</button></div><div id="results">${agencies.map(agencyCard).join('')||'<div class="empty">没有找到相关机构或社群</div>'}</div></div>`}
function searchChange(v){keyword=v;document.getElementById('results').innerHTML=agencies.map(agencyCard).join('')||'<div class="empty">没有找到相关机构或社群</div>'}function toggle(id){expanded[id]=!expanded[id];renderList()}function openAgency(id){agencyId=id;page='detail';tab='communities';introExpanded=false;renderDetail();window.scrollTo(0,0)}
function renderDetail(){let a=agencies.find(x=>x.id===agencyId);document.getElementById('title').textContent='机构详情';el.innerHTML=`<div class="page"><div class="hero">${logo(a.icon)}<div class="grow"><div class="name">${esc(a.name)}${a.official?'<span class="tag blue">官方</span>':''}<span class="tag blue">${a.free?'免费':'付费'}</span></div><div class="sub" style="font-size:12px;margin-top:10px">${esc(a.summary)}</div></div></div><div class="stats"><div class="stat"><small>社群数</small><b>${a.count}个</b></div><div class="stat"><small>费用规则</small><b>${a.free?'免费':'付费'}</b></div></div><div class="section"><h3>机构详细介绍</h3><div class="panel intro ${introExpanded?'expanded':''}">${esc(a.intro)}</div><div class="read" onclick="introExpanded=!introExpanded;renderDetail()">${introExpanded?'收起介绍':'阅读全部'}</div></div><div class="section"><h3>核心服务</h3><div class="panel"><b>核心服务赛道：</b><div>${esc(a.services)}</div><b>核心服务内容：</b><div>提供日常答疑、资料供给和系统教学等基础服务，帮助成员快速掌握核心要点。</div></div></div><div class="section"><div class="tabs"><div class="tab ${tab==='communities'?'active':''}" onclick="switchTab('communities')">社群列表（${a.communities.length}）</div><div class="tab ${tab==='teams'?'active':''}" onclick="switchTab('teams')">导师团（${a.teams.length}）</div></div><div class="detailItem">${(tab==='communities'?a.communities:a.teams).map(x=>row(x,tab==='communities'?'community':'team')).join('')}</div></div></div>`}
function switchTab(t){tab=t;renderDetail()}function handleItem(type,name){if(type==='community'){communityName=decodeURIComponent(name);previousPage=page;page='community';renderCommunity();window.scrollTo(0,0)}else showTarget(type)}function showTarget(t){document.getElementById('dialogText').textContent=t==='connect'?'对接社群：此处对接现有业务流程':t==='community'?'跳转现在的社群页面':'跳转新的导师团页面';document.getElementById('overlay').classList.remove('hidden')}function hideModal(){document.getElementById('overlay').classList.add('hidden')}function closeModal(e){if(e.target.id==='overlay')hideModal()}function goBack(){if(page==='community'){page=previousPage;if(page==='detail')renderDetail();else renderList();window.scrollTo(0,0)}else if(page==='detail'){showHomeNotice()}else if(history.length>1)history.back()}
function showHomeNotice(){document.getElementById('dialogText').textContent='当前为独立机构详情首页，无需返回服务机构列表';document.getElementById('overlay').classList.remove('hidden')}const personProfiles={
'别暴躁':{role:'创业导师',avatar:'暴',tags:['项目方法','运营策略','核心教学','关键问题判断'],bio:'主要负责社群项目方法、运营策略、核心教学与关键问题判断，为成员提供项目方向指导和运营建议，帮助成员理解项目规则、掌握执行方法。'},
'林小满':{role:'导师团成员',avatar:'林',tags:['日常答疑','流程指导','执行跟进','内容发布'],bio:'主要负责社群日常答疑与项目执行支持，帮助成员理解项目页面、参与流程、内容发布要求和常见注意事项。遇到问题时，会协助成员确认问题发生在哪个步骤、需要补充哪些信息，并提供清晰的处理建议。对于正在执行的成员，也会关注任务推进情况，提醒及时查看规则更新、做好内容检查和阶段复盘。希望每位成员都能把复杂流程拆成容易完成的小步骤，逐步建立自己的执行节奏。'},
'陈知夏':{role:'导师团成员',avatar:'陈',tags:['基础服务','社群维护','问题收集','成员支持'],bio:'主要负责社群基础服务与日常维护，协助成员熟悉平台功能、了解社群规则，收集并整理常见问题，推动问题及时得到反馈与处理。'}
};
function showPerson(name){const p=personProfiles[name]||{role:'导师团成员',avatar:name.slice(0,1),tags:['社群服务'],bio:'负责社群日常服务与成员支持。'};document.getElementById('personSheetContent').innerHTML=`<div class="sheet-profile"><div class="sheet-avatar">${esc(p.avatar)}</div><div style="flex:1;min-width:0"><div><span class="sheet-name">${esc(name)}</span><span class="sheet-role">${esc(p.role)}</span></div><div class="sheet-tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div><button class="sheet-close" onclick="closePersonSheet()" aria-label="关闭">×</button></div><div class="sheet-label">导师介绍</div><div class="sheet-bio">${esc(p.bio)}</div>`;document.getElementById('personSheetOverlay').classList.remove('hidden');}
function closePersonSheet(){document.getElementById('personSheetOverlay').classList.add('hidden')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePersonSheet()});
function renderCommunity(){
const a=agencies.find(x=>x.id===agencyId),c=a.communities.find(x=>x[0]===communityName)||a.communities[0];
const track=c[1],isVideo=/短剧|漫剧|文娱/.test(communityName),isTool=/工具/.test(communityName),sym=isVideo?'▶':isTool?'▣':c[2],tone=isVideo?'pink':/网盘|知乎/.test(communityName)?'blue':'';
document.getElementById('title').textContent='';
el.innerHTML=`<div class="community-page"><div class="comm-top"><div class="wx-menu">••• │ ━ │ ◉</div></div>

<div class="comm-stats"><div class="comm-stat"><small>赛道</small><strong>${esc(track)}</strong></div><div class="comm-stat"><small>累计产生</small><strong style="color:#ff5137">更新中</strong></div></div>
<section class="comm-block"><div class="section-heading"><h3>社群负责导师</h3><span class="minor">查看全部成员 ›</span></div><div class="community-mentor-box"><div class="mentor-lead" onclick="showPerson('别暴躁')"><div class="person-avatar">暴</div><div class="person-text"><div class="person-name">别暴躁<span class="person-badge">创业导师</span></div><div class="person-desc">负责项目方法、运营策略、核心教学与关键问题判断</div></div><span class="person-arrow">›</span></div><div class="mentor-assist"><div class="mentor-assist-title">导师团成员 · 2 人</div><div class="mentor-assist-row"><div class="assist-person" onclick="showPerson('林小满')"><div class="person-avatar green">林</div><div class="person-text"><div class="person-name">林小满</div><div class="person-desc">日常答疑及执行</div></div><span class="person-arrow">›</span></div><div class="assist-person" onclick="showPerson('陈知夏')"><div class="person-avatar brown">陈</div><div class="person-text"><div class="person-name">陈知夏</div><div class="person-desc">基础服务及维护</div></div><span class="person-arrow">›</span></div></div></div></div></section>
<section class="comm-block"><div class="section-heading"><h3>所属导师团</h3></div><div class="affiliated-team" onclick="showTarget('team')"><div class="team-icon">师</div><div class="team-meta"><b>${esc((a.teams[0]||['右豹导师团'])[0])}</b><p>负责赛道：${esc((a.teams[0]||['',track])[1])}</p></div><span class="person-arrow">›</span></div></section>
<section class="comm-block"><h3>平台保障</h3><div class="guarantees"><div class="guarantee"><b>资金透明</b><p>右豹不收取交易款项，不代收代付用户私下约定费用，项目合作、服务费用与具体交付，由合作双方自行确认。</p></div><div class="guarantee"><b>资源自主</b><p>账号、内容、素材与业务资源归用户所有，关系可按平台规则解除，不强制绑定。</p></div><div class="guarantee"><b>争议可查</b><p>遇到收益、绑定、服务纠纷，可以提交申诉。平台会根据记录和证据协助处理。</p></div></div></section>
<div class="comm-footer"><button onclick="showTarget('connect')">对接社群</button></div></div>`;
}
renderDetail();
</script></body></html>
