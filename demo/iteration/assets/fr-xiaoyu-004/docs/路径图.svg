<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 780" role="img"><title>批量传订单前后端流程</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#243247;font-size:17px}.title{font-size:23px;font-weight:700}.sub{font-size:15px;fill:#64748b}.node{stroke-width:1.5}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><rect width="1500" height="780" fill="white"/><text class="title" x="30" y="40">批量传订单 · 前后端处理路径</text><text class="sub" x="30" y="68">按 ① → ② → ③ 阅读；每个阶段均为前端在上、后端在下。编号回到原阶段，避免长回路线。</text><rect x="25" y="95" width="460" height="645" rx="14" fill="#fff" stroke="#dce3ed"/><rect x="26" y="150" width="458" height="284" fill="#f8fbff"/><rect x="26" y="435" width="458" height="290" fill="#f7fcf9"/><text x="255" y="130" text-anchor="middle" class="title"><tspan x="255" dy="0">① 上传与校验</tspan></text><text class="sub" x="43" y="176">前端页面</text><text class="sub" x="43" y="462">后端服务</text><path d="M25 435H485" stroke="#dce3ed"/><rect x="520" y="95" width="460" height="645" rx="14" fill="#fff" stroke="#dce3ed"/><rect x="521" y="150" width="458" height="284" fill="#f8fbff"/><rect x="521" y="435" width="458" height="290" fill="#f7fcf9"/><text x="750" y="130" text-anchor="middle" class="title"><tspan x="750" dy="0">② 查看结果与审核</tspan></text><text class="sub" x="538" y="176">前端页面</text><text class="sub" x="538" y="462">后端服务</text><path d="M520 435H980" stroke="#dce3ed"/><rect x="1015" y="95" width="460" height="645" rx="14" fill="#fff" stroke="#dce3ed"/><rect x="1016" y="150" width="458" height="284" fill="#f8fbff"/><rect x="1016" y="435" width="458" height="290" fill="#f7fcf9"/><text x="1245" y="130" text-anchor="middle" class="title"><tspan x="1245" dy="0">③ 分发与失败重传</tspan></text><text class="sub" x="1033" y="176">前端页面</text><text class="sub" x="1033" y="462">后端服务</text><path d="M1015 435H1475" stroke="#dce3ed"/><rect class="node" x="65" y="195" width="380" height="65" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="255.0" y="233.5" text-anchor="middle" class=""><tspan x="255.0" dy="0">选择单个 / 多个 CSV、XLS、XLSX</tspan></text><path class="edge" d="M255 260 L255 280"/><rect class="node" x="65" y="280" width="380" height="65" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="255.0" y="306.0" text-anchor="middle" class=""><tspan x="255.0" dy="0">临时列表确认文件与项目</tspan><tspan x="255.0" dy="25">可编辑项目、删除、继续添加</tspan></text><path class="edge" d="M255 345 L255 365"/><rect class="node" x="65" y="365" width="380" height="50" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="255.0" y="396.0" text-anchor="middle" class=""><tspan x="255.0" dy="0">点击「一键处理」</tspan></text><path class="edge" d="M255 415 L255 485"/><rect class="node" x="65" y="485" width="380" height="75" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="255.0" y="516.0" text-anchor="middle" class=""><tspan x="255.0" dy="0">按表单创建任务</tspan><tspan x="255.0" dy="25">校验订单数据与关键词归因</tspan></text><path class="edge" d="M255 560 L255 585"/><rect class="node" x="65" y="585" width="380" height="75" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="255.0" y="616.0" text-anchor="middle" class=""><tspan x="255.0" dy="0">返回状态、进度、成功 / 失败数据</tspan><tspan x="255.0" dy="25">失败文件包含逐行失败原因</tspan></text><text x="255" y="705" text-anchor="middle" class="sub"><tspan x="255" dy="0">结果返回前端 → 进入阶段 ②</tspan></text><rect class="node" x="550" y="195" width="400" height="55" rx="9" fill="#f8fafc" stroke="#cbd5e1"/><text x="750.0" y="228.5" text-anchor="middle" class=""><tspan x="750.0" dy="0">处理中：显示实时进度，等待校验</tspan></text><rect class="node" x="550" y="267" width="400" height="65" rx="9" fill="#fff1f2" stroke="#fda4af"/><text x="750.0" y="293.0" text-anchor="middle" class=""><tspan x="750.0" dy="0">部分失败 / 处理失败：下载失败文件</tspan><tspan x="750.0" dy="25">修订后重传 → 回到 ①，更新原批次</tspan></text><rect class="node" x="550" y="350" width="400" height="65" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="750.0" y="376.0" text-anchor="middle" class=""><tspan x="750.0" dy="0">处理完成：显示 100%</tspan><tspan x="750.0" dy="25">点击「一键审核分发」并确认</tspan></text><path class="edge" d="M750 415 L750 485"/><rect class="node" x="560" y="485" width="380" height="75" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="750.0" y="516.0" text-anchor="middle" class=""><tspan x="750.0" dy="0">校验处理状态、审核权限</tspan><tspan x="750.0" dy="25">仅处理完成的表单可以审核</tspan></text><path class="edge" d="M750 560 L750 585"/><rect class="node" x="560" y="585" width="380" height="75" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="750.0" y="616.0" text-anchor="middle" class=""><tspan x="750.0" dy="0">审核成功：订单标记「已审核」</tspan><tspan x="750.0" dy="25">按订单表单组发起项目分发</tspan></text><text x="750" y="705" text-anchor="middle" class="sub"><tspan x="750" dy="0">审核成功后 → 进入阶段 ③</tspan></text><rect class="node" x="1045" y="195" width="400" height="55" rx="9" fill="#eff6ff" stroke="#93c5fd"/><text x="1245.0" y="228.5" text-anchor="middle" class=""><tspan x="1245.0" dy="0">订单分发列表：一组表单记录一行</tspan></text><rect class="node" x="1045" y="267" width="400" height="65" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="1245.0" y="293.0" text-anchor="middle" class=""><tspan x="1245.0" dy="0">分发成功：显示成功记录</tspan><tspan x="1245.0" dy="25">订单已审核，编辑栏为空</tspan></text><rect class="node" x="1045" y="350" width="400" height="65" rx="9" fill="#fff1f2" stroke="#fda4af"/><text x="1245.0" y="376.0" text-anchor="middle" class=""><tspan x="1245.0" dy="0">分发失败：提供重传入口</tspan><tspan x="1245.0" dy="25">重传后更新原分发组</tspan></text><path class="edge" d="M1245 415 L1245 485"/><rect class="node" x="1055" y="485" width="380" height="75" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="1245.0" y="516.0" text-anchor="middle" class=""><tspan x="1245.0" dy="0">首次分发承接 ②；重传关联原组</tspan><tspan x="1245.0" dy="25">校验审核状态，按项目 ID 分流</tspan></text><path class="edge" d="M1245 560 L1245 585"/><rect class="node" x="1055" y="585" width="380" height="75" rx="9" fill="#ecfdf5" stroke="#6ee7b7"/><text x="1245.0" y="616.0" text-anchor="middle" class=""><tspan x="1245.0" dy="0">成功：写入对应项目订单列表</tspan><tspan x="1245.0" dy="25">失败：保存接口 / 分流异常原因</tspan></text><text x="1245" y="705" text-anchor="middle" class="sub"><tspan x="1245" dy="0">结果返回本阶段前端分发列表</tspan></text><text class="sub" x="30" y="770">重传前若检测到订单未审核，前端先二次确认；后端仍校验状态。处理失败重传与分发失败重传分别更新原记录。</text></svg>