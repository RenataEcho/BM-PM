      this.records.push({id:'R0001',operation:'seed',leaderId:this.leader.id,leaderName:this.leader.name,targetId:member.id,targetName:member.name,relation:member.relation,templateId:template.id,templateName:template.name,templateBody:template.body,...content,status:'成功',time:bj(seedTime),reason:'',timestamp:seedTime});

    }
    get state() { return clone({leader:this.leader,members:this.members,whitelist:this.whitelist,templates:this.templates,rules:this.rules,records:this.records,notifications:this.notifications,updated:this.updated,scenario:this.scenario,recipientId:this.recipientId}); }
    apply(data) { ['leader','members','whitelist','templates','rules','records','notifications','updated','scenario','recipientId'].forEach(k=>{if(k in data)this[k]=clone(data[k]);}); }
    content(templateId,targetId) {
      const t=this.templates.find(x=>x.id===templateId), m=this.members.find(x=>x.id===targetId);
      if(!t || !m)return {text:'',image:'',fingerprint:''};
      const missing=this.scenario==='missing', contact=!missing&&this.leader.wechat;

      const text=t.body.replace(/\{([^{}]+)\}/g,(_,v)=>map[v]||'');

    preview(templateId,targetId) { return this.content(templateId,targetId); }
    limitError(targetId,content) {
      const now=Date.now(),day=bj(now).slice(0,10),successful=this.records.filter(x=>x.status==='成功'&&x.leaderId===this.leader.id);

      const last=successful.reduce((n,x)=>Math.max(n,x.timestamp),0),left=Math.ceil((last+get('interval').value*1000-now)/1000);

      if(get('repeat').enabled&&((duplicate&&now<duplicate.timestamp+get('repeat').value*3600000)||this.scenario==='limit-repeat'))return '已向该下级发送过相同内容，请在 '+bj(duplicate?duplicate.timestamp+get('repeat').value*3600000:now+86400000)+'（北京时间）后重试';

 const filters=['全部','直属','间属','直属团队','间属团队'];
 const members=model.members.filter(m=>(!search||m.id.includes(search)||m.name.includes(search))&&(memberFilter==='全部'||memberFilter==='直属'&&m.relation.startsWith('直属')||memberFilter==='间属'&&m.relation.startsWith('间属')||memberFilter==='直属团队'&&m.relation==='直属团队长'||memberFilter==='间属团队'&&m.relation==='间属团队长'));
 $('app').innerHTML=header('团队成员 <span class="system-label">/'+model.members.length+'</span>')+`<main class="page-scroll"><div class="search"><span class="search-symbol">⌕</span><input id="member-search" aria-label="搜索成员" placeholder="输入用户ID/用户昵称搜索" value="${esc(search)}"></div><nav class="filters">${filters.map(f=>`<button data-filter="${f}" class="${memberFilter===f?'active':''}">${f}</button>`).join('')}</nav><div class="sub-filters"><span>全部状态⌄</span><span>全部身份⌄</span><span>默认排序⌄</span></div>${members.map(m=>`<article class="member-card"><div class="member-head"><span class="avatar">${m.avatar}</span><div class="identity"><strong>${esc(m.name)}</strong> <span class="id">(ID: ${m.id})</span><div class="chips"><span class="chip ${m.level==='V2'?'orange':''}">${m.level}</span><span class="chip">${m.relation}</span>${m.id==='3785217'?'<span class="chip">活跃</span>':''}</div></div></div><div class="stats"><div><span>TA的团队人数</span><b>0</b></div><div><span>团队总流水</span><b>0.00</b></div><div><span>团队总奖励</span><b>0.00</b></div></div><footer class="member-foot"><time>${m.joined}加入</time>${model.canMessage(m)?`<button class="small-btn orange" data-message="${m.id}" aria-label="给${esc(m.name)}（右豹 ID ${m.id}）留言">留言</button>`:''}<button class="small-btn" data-remark="${m.id}">备注</button></footer></article>`).join('')||'<p class="empty">暂无符合条件的成员</p>'}</main>`;
}
function renderNotifications(){
 const notes=model.notifications.filter(n=>n.target===targetId),unread=notes.filter(n=>!n.read).length;
 const all=[...notes,{id:'old-1',title:'迅雷官方通知',text:'⚠严禁推广境外上线的耽美剧《回信》《驯养守则》。如有违规请及时自查。',time:'2026-10-30 15:11:00'},{id:'old-2',title:'小红书CPA项目暂停通知',text:'由于官方内部调整，11月1日开始小红书CPA暂停推广；后续恢复时间请关注通知。',time:'2026-10-29 13:54:00'},{id:'old-3',title:'百度网盘订单数据通知',text:'10月25日订单数据延时，预计10月29日更新。',time:'2026-10-28 20:33:00'},{id:'old-4',title:'微信授权功能已上线',text:'',time:'2026-10-28 20:26:00'}];
 $('app').innerHTML=header('消息通知')+`<main class="page-scroll"><nav class="message-tabs"><button class="active" data-msg-tab="系统">系统${unread?`<span class="badge">${unread}</span>`:''}</button><button data-msg-tab="活动">活动</button><button data-msg-tab="钱包">钱包</button></nav><div class="search"><span style="color:#9498a8">⌕</span><input id="notification-search" placeholder="搜索消息" aria-label="搜索消息"><button id="search-message">搜索</button></div><div id="notification-list">${all.map(n=>`<article class="notification-card" data-note-card="${n.id}"><div class="notification-top"><strong>${esc(n.title)}</strong><button class="expand" data-expand="${n.id}">展开⌄</button></div><div class="notification-body" id="body-${n.id}">${esc(n.text)}</div><footer class="notification-foot"><button data-note="${n.id}">前往查看</button><time>${esc(n.time.slice(5,10).replace('-','月')+'日 '+n.time.slice(11,16))}</time></footer></article>`).join('')}</div></main>`;
}
function renderDetail(){const n=model.notifications.find(n=>n.id===selectedNotification&&n.target===targetId)||model.notifications.find(n=>n.target===targetId);if(!n){screen='notifications';renderNotifications();return;}n.read=true;$('app').innerHTML=header('通知详情','notifications')+`<main class="page-scroll"><article class="detail-card"><h2>团长留言</h2><time>${esc(n.time)} · 系统通知</time>${actualHTML(n)}</article></main>`;tell('read',{id:n.id});}
function rememberPending(){if(operation&&['sending','unknown'].includes(operation.status))pendingOperations[operation.targetId]=JSON.parse(JSON.stringify({operation:{...operation,status:'unknown'},templateId,preview,reconfirmed,feedback:'正在核实发送结果，请勿重复发送'}));}
function openMessage(id){rememberPending();targetId=id;previousFocus=document.activeElement;const saved=pendingOperations[id];if(saved){({operation,templateId,preview,reconfirmed,feedback}=JSON.parse(JSON.stringify(saved)));step='preview';}else if(!operation||operation.targetId!==id||operation.status==='success'){operation=null;templateId='';preview=null;step='select';feedback='';reconfirmed=false;}
 $('app').inert=true;$('sheet-mask').hidden=false;drawSheet();$('sheet-close').focus();}
function closeSheet(){if(operation?.status==='sending'){operation.status='unknown';feedback='正在核实发送结果，请勿重复发送';}rememberPending();$('sheet-mask').hidden=true;$('app').inert=false;previousFocus?.focus();}
function drawSheet(){const focused=document.activeElement,focusId=focused?.id,radio=focused?.name==='template'?focused.value:null;const member=model.members.find(x=>x.id===targetId);$('sheet-title').textContent=step==='select'?'选择话术':'留言预览';$('sheet-object').innerHTML=`留言给：<b>${esc(member.name)}</b><small>右豹 ID：${member.id} · ${esc(member.relation)}</small>`;
 const busy=operation&&['sending','unknown'].includes(operation.status);
 if(step==='select'){
  const available=model.templates.filter(t=>t.enabled&&scenario!=='no-template');if(templateId&&!available.some(t=>t.id===templateId))templateId='';
  $('sheet-body').innerHTML='<p class="tip">仅支持选择固定话术</p>'+available.map(t=>`<label class="template-option"><input type="radio" name="template" value="${t.id}" ${templateId===t.id?'checked':''}><b>${esc(t.name)}</b><p>${esc(model.content(t.id,targetId).text)}</p></label>`).join('')+(available.length?'':'<div class="empty">暂无可用话术，请稍后再试</div>')+(feedback?`<div class="feedback" role="status">${esc(feedback)}</div>`:'');
  $('sheet-footer').innerHTML=available.length?`<button class="mobile-action" id="next" ${templateId?'':'disabled'}>下一步</button>`:'<button class="mobile-action secondary" id="no-template-close">关闭</button>';
 }else{
  const imageFailed=scenario==='image-failed'&&!imageLoaded;
  $('sheet-body').innerHTML='<p class="tip">请确认以下留言内容</p>'+(imageFailed?`<div class="actual-content">${esc(preview.text)}</div><div class="feedback">图片加载失败，请重试<br><button class="small-btn" id="retry-preview-image">重试图片</button></div>`:actualHTML(preview))+(feedback?`<div class="feedback" role="status">${esc(feedback)}</div>`:'')+(operation?.status==='unknown'?'<p class="tip">[待确认] 查询结果与跨页面恢复采用 UX-A1 建议交互。</p>':'');
  const invalidObject=operation?.status==='blocked'&&(feedback.includes('权限已关闭')||feedback.includes('不是你的直属下级'));
  $('sheet-footer').innerHTML=invalidObject?'<button class="mobile-action secondary" id="return-members">返回成员列表</button>':busy?(operation.status==='unknown'?'<button class="mobile-action secondary" id="collect">收起</button><button class="mobile-action" id="query-result">查询结果</button>':'<button class="mobile-action" disabled>发送中…</button>'):`<button class="mobile-action secondary" id="back-select">${feedback.includes('话术已不可用')?'重新选择':'返回选择'}</button><button class="mobile-action" id="send" ${imageFailed||feedback.includes('话术已不可用')?'disabled':''}>${operation?.status==='failed'?'重试发送':'确认发送'}</button>`;
 }
 if(radio)document.querySelector('input[name="template"][value="'+radio+'"]')?.focus();else if(focusId&&$(focusId))$(focusId).focus();
}
function focusHeading(){$('sheet-title').tabIndex=-1;$('sheet-title').focus();}
function next(){if(!templateId)return;preview=model.preview(templateId,targetId);step='preview';feedback='';reconfirmed=false;drawSheet();focusHeading();}
function send(){if(operation&&['sending','unknown','success'].includes(operation.status))return;const retry=operation?.status==='failed';if(!operation)operation={id:'op-'+Date.now()+'-'+Math.random().toString(36).slice(2),targetId,status:'new'};operation.status='sending';feedback='';drawSheet();focusHeading();const request={id:operation.id,targetId,templateId,fingerprint:preview.fingerprint,content:preview,reconfirmed,retry};if(parent!==window)tell('send',{request});else setTimeout(()=>accept(model.send(request),request.id),350);}
function accept(result,id){if(id&&operation?.id!==id){const saved=Object.values(pendingOperations).find(s=>s.operation.id===id);if(saved){saved.operation.status=result.status;saved.feedback=result.message;if(result.status==='success')delete pendingOperations[saved.operation.targetId];}return;}if(!operation)return;operation.status=result.status;if(!['sending','unknown'].includes(result.status))delete pendingOperations[operation.targetId];
 if(result.status==='changed'){preview=result.content;preview.fingerprint=JSON.stringify([preview.text,preview.image]);reconfirmed=true;operation.status='changed';feedback=result.message;drawSheet();focusHeading();return;}
 feedback=result.message;if(result.status==='success'){delete pendingOperations[operation.targetId];closeSheet();toast(result.message);showApp();tell('changed');return;}rememberPending();drawSheet();const status=$('sheet-body').querySelector('[role=status]');if(status){status.tabIndex=-1;status.focus();}else focusHeading();
}
function switchScene(name){closeSheet();scenario=name;model.scenario=name;screen=['notifications','detail'].includes(name)?name:'members';search='';memberFilter='全部';targetId=screen==='members'?'3785217':model.recipientId;templateId='';preview=null;operation=null;feedback='';imageLoaded=false;reconfirmed=false;showApp();if(!['members','unlisted','notifications','detail'].includes(name)){openMessage(targetId);if(name!=='no-template'&&operation?.status!=='unknown'){templateId=model.templates.find(t=>t.enabled)?.id||'';if(templateId)next();}if(name==='unknown'&&operation?.status!=='unknown')send();}}
window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==origin||event.data?.source!=='fr-wen-003-host')return;const d=event.data;if(d.type==='state'){model.apply(d.state);if(!$('sheet-mask').hidden)drawSheet();else showApp();}if(d.type==='scene')switchScene(d.screen);if(d.type==='result'){model.apply(d.state);accept(d.result,d.id);}if(d.type==='reset'){operation=null;Object.keys(pendingOperations).forEach(k=>delete pendingOperations[k]);model.reset();switchScene('members');}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.message){openMessage(b.dataset.message);return;}if(b.dataset.remark){toast('备注为现有入口，本次不调整');return;}if(b.dataset.filter){memberFilter=b.dataset.filter;showApp();return;}if(b.hasAttribute('data-back')){if(b.dataset.back){screen=b.dataset.back;showApp();}return;}
 if(b.dataset.note){if(b.dataset.note.startsWith('old-')){toast('沿用现有通知详情，本次不调整');return;}selectedNotification=b.dataset.note;screen='detail';showApp();return;}
 if(b.dataset.expand){const text=$('body-'+b.dataset.expand);text.classList.toggle('expanded');b.textContent=text.classList.contains('expanded')?'收起⌃':'展开⌄';return;}
 if(b.hasAttribute('data-image-retry')){const error=b.closest('.image-error'),img=error.previousElementSibling;img.hidden=false;img.src=img.src;error.hidden=true;return;}
 if(b.dataset.msgTab){if(b.dataset.msgTab!=='系统')toast('沿用现有'+b.dataset.msgTab+'通知，本次不调整');return;}
 const actions={'sheet-close':closeSheet,'no-template-close':closeSheet,'return-members':()=>{closeSheet();screen='members';showApp();},next,'back-select':()=>{step='select';operation=null;feedback='';reconfirmed=false;drawSheet();document.querySelector('input[name=template]:checked')?.focus();},send,collect:closeSheet,'query-result':()=>{if(parent!==window)tell('query',{id:operation.id});else accept(model.query(operation.id),operation.id);},'retry-preview-image':()=>{imageLoaded=true;drawSheet();},'all-read':()=>{model.notifications.filter(n=>n.target===targetId).forEach(n=>n.read=true);renderNotifications();tell('all-read',{targetId});},'search-message':()=>{const q=$('notification-search').value;document.querySelectorAll('[data-note-card]').forEach(card=>card.hidden=!card.textContent.includes(q));}};actions[b.id]?.();
});
document.addEventListener('change',e=>{if(e.target.name==='template'){templateId=e.target.value;drawSheet();}});
document.addEventListener('input',e=>{if(e.target.id==='member-search'){const position=e.target.selectionStart;search=e.target.value;showApp();$('member-search').focus();$('member-search').setSelectionRange(position,position);}});
$('sheet-mask').addEventListener('click',e=>{if(e.target===$('sheet-mask'))closeSheet();});
document.addEventListener('keydown',e=>{if($('sheet-mask').hidden)return;if(e.key==='Escape'){closeSheet();return;}if(e.key==='Tab'){const focusable=[...$('sheet-mask').querySelectorAll('button:not(:disabled),input')].filter(n=>n.offsetParent!==null),first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
switchScene(new URLSearchParams(location.search).get('screen')||'members');tell('ready');
</script></body></html>
