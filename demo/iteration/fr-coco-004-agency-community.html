<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="gate.js?v=2"></script>
  <script>
    if (new URLSearchParams(location.search).get('embed') === '1') {
      document.documentElement.classList.add('embedded');
    }
  </script>
  <title>FR-CoCo-004 · 机构社群优化 · BM-PM</title>
  <style>
    [hidden] { display: none !important; }
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;
      --accent-rule: #0891b2;
      --surface-glass: rgba(255,255,255,.76);
      --border: #e8edf3;
      --text-primary: #18222f;
      --text-secondary: #4a5568;
      --text-muted: #9aa5b4;
      --sidebar-w: 240px;
      --topnav-h: 54px;
      --drawer-w: 480px;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(30,40,80,.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font: 13px Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-primary);
      background: linear-gradient(135deg,#e0e7ff 0%,#f0f4f8 40%,#e0f2fe 100%);
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0,1fr);
      grid-template-rows: var(--topnav-h) minmax(0,1fr);
      overflow: hidden;
    }
    button, textarea { font: inherit; }
    .topnav {
      grid-column: 1/-1;
      display: flex;
      background: linear-gradient(135deg,#dbeafe 0%,#ede9fe 40%,#e0f2fe 100%);
      border-bottom: 1px solid rgba(148,163,196,.35);
    }
    .topnav-brand {
      width: var(--sidebar-w);
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-right: 1px solid rgba(148,163,196,.25);
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
    }
    .brand-text { font-size: 14px; font-weight: 700; }
    .brand-sub { margin-top: 2px; color: var(--text-muted); font-size: 10px; }
    .pnav { display: flex; }
    .pnav-item {
      position: relative;
      padding: 0 22px;
      display: inline-flex;
      align-items: center;
      color: #3b4d6b;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }
    .pnav-item.active { color: #1e3a8a; background: rgba(99,102,241,.13); }
    .pnav-item.active::after {
      content: "";
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: #4f46e5;
    }
    .sidebar {
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: #eef2fb;
      border-right: 1px solid #d3dce8;
    }
    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 0 16px; }
    .sidebar-foot {
      padding: 10px 14px 14px;
      border-top: 1px solid rgba(148,163,196,.22);
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.5;
    }
    .nav-item {
      position: relative;
      width: calc(100% - 16px);
      height: 40px;
      margin: 1px 8px;
      padding: 0 12px 0 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      font-weight: 500;
      text-decoration: none;
    }
    .nav-item.active { color: var(--primary); background: rgba(37,99,235,.12); font-weight: 600; }
    .main {
      min-width: 0;
      min-height: 0;
      padding: 12px 20px 16px;
      display: flex;
      flex-direction: column;
    }
    .breadcrumb { margin-bottom: 8px; color: var(--text-muted); font-size: 12px; }
    .breadcrumb a { color: var(--primary); text-decoration: none; }
    .page-header {
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .page-header h1 { font-size: 19px; }
    .page-desc { max-width: 760px; margin-top: 4px; color: var(--text-muted); font-size: 12px; line-height: 1.45; }
    .btn {
      height: 34px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-rule, .btn-ghost { color: var(--primary); background: var(--primary-light); border-color: var(--primary-border); }
    .btn-rule.active, .btn-primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .page-label {
      margin-bottom: 10px;
      padding: 0 16px 9px;
      border-bottom: 1px solid var(--border);
      color: var(--primary);
      font-weight: 600;
    }
    .demo-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(300px,520px) minmax(390px,1fr);
      gap: 16px;
    }
    .context-rules, .mockup-board {
      min-height: 0;
      overflow: auto;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: var(--radius);
      background: var(--surface-glass);
      box-shadow: var(--shadow);
    }
    .context-rules { padding: 20px; }
    .context-rules h2 { margin-bottom: 6px; font-size: 16px; }
    .intro { margin-bottom: 16px; color: var(--text-secondary); font-size: 12px; line-height: 1.6; }
    .rule-actions { margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    .status { min-height: 18px; margin-bottom: 5px; color: var(--text-muted); font-size: 12px; line-height: 1.5; }
    #ruleEditor {
      width: 100%;
      min-height: 420px;
      padding: 12px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.8;
    }
    .mockup-board { overflow: hidden; background: #f6f7fb; }
    .mockup-board iframe { width: 100%; height: 100%; border: 0; display: block; background: #f6f7fb; }
    .rule-section { margin-bottom: 20px; }
    .rule-section h3 { margin-bottom: 8px; color: var(--accent-rule); font-size: 14px; }
    .rule-content { color: var(--text-secondary); font-size: 13px; line-height: 1.65; }
    .rule-content ul { padding-left: 18px; }
    .rule-content li { margin-bottom: 5px; }
    .drawer-overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      background: rgba(15,23,42,.35);
      transition: opacity .25s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 501;
      width: var(--drawer-w);
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,.98);
      box-shadow: -8px 0 40px rgba(30,40,60,.18);
      transform: translateX(100%);
      transition: transform .28s ease;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .drawer-header h2 { font-size: 15px; }
    .drawer-close {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 6px;
      background: #f1f5f9;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
    }
    .drawer-body { flex: 1; overflow-y: auto; padding: 18px 20px 24px; }
    html.embedded body { display: block; }
    html.embedded body > .topnav,
    html.embedded body > .sidebar { display: none; }
    html.embedded body > .main { width: 100%; height: 100%; }
    @media (max-width: 1000px) {
      .demo-layout { grid-template-columns: minmax(260px,1fr) minmax(390px,1fr); overflow: auto; }
    }
  </style>
</head>
<body>
  <header class="topnav">
    <div class="topnav-brand">
      <div class="brand-icon">迭</div>
      <div><div class="brand-text">BM-PM</div><div class="brand-sub">迭代需求</div></div>
    </div>
    <nav class="pnav" aria-label="业务线">
      <a class="pnav-item" href="framework-shell.html#youbao/overview">右豹主业务</a>
      <a class="pnav-item active" href="framework-shell.html#mentor/overview">导师商务</a>
      <a class="pnav-item" href="framework-shell.html#enterprise/overview">企业号</a>
    </nav>
  </header>
  <aside class="sidebar">
    <div class="sidebar-scroll" data-iteration-sidebar></div>
    <div class="sidebar-foot">先写明业务线，再做设计。<br />已上线进归档，已暂停进废纸篓。</div>
  </aside>
  <main class="main">
    <nav class="breadcrumb"><a href="framework-shell.html#mentor/overview">导师商务</a> / 机构社群优化</nav>
    <header class="page-header">
      <div>
        <h1>FR-CoCo-004 · 机构社群优化</h1>
        <p class="page-desc">前端交互：查看机构详情、社群详情、社群负责导师与所属导师团，并保留社群对接说明。</p>
      </div>
      <button class="btn btn-rule" id="ruleBtn" type="button" aria-expanded="false">需求规则</button>
    </header>
    <div class="page-label">前端交互</div>
    <section class="demo-layout">
      <aside class="context-rules" aria-label="前端需求规则">
        <h2>用户视角 · 机构与社群 · 需求规则</h2>
        <p class="intro">对照右侧页面查看字段、操作与边界。这里仅记录 FR-CoCo-004 当前需求。</p>
        <div class="rule-actions">
          <button type="button" class="btn btn-ghost" id="editRules">编辑规则</button>
          <button type="button" class="btn btn-ghost" id="copyDemoCode">复制 Demo 代码</button>
          <button type="button" class="btn btn-primary" id="saveRules" hidden>保存到项目</button>
          <button type="button" class="btn btn-ghost" id="cancelRules" hidden>取消</button>
        </div>
        <p class="status" id="copyDemoStatus" role="status"></p>
        <p class="status" id="ruleEditStatus" role="status"></p>
        <textarea id="ruleEditor" aria-label="编辑前端需求规则" hidden></textarea>
        <div id="contextRules"></div>
      </aside>
      <div class="mockup-board">
        <iframe id="phone" title="机构详情与社群详情" src="fr-coco-004-opc-agency-detail-mentor-sheet-v2.html?v=1"></iframe>
      </div>
    </section>
  </main>
  <div class="drawer-overlay" id="ruleOverlay"></div>
  <aside class="drawer" id="ruleDrawer" role="dialog" aria-labelledby="ruleTitle">
    <div class="drawer-header">
      <h2 id="ruleTitle">FR-CoCo-004 · 需求规则</h2>
      <button class="drawer-close" id="ruleClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="drawer-body" id="drawerRules"></div>
  </aside>
  <script src="sidebar-nav.js?v=9"></script>
  <script>
    var frontendRules = {
      user: [
        ["页面与入口", [
          "本需求默认进入「机构详情」，不展示服务机构列表；点击机构详情左上角返回时，仅提示当前为独立机构详情首页。",
          "增加导师团入口,导师团是新页面,具体页面看需求“加入导师团优化“"
        ]],
        ["机构详情交互", [
          "社群和导师团使用tab切换,社群是现有的,导师团是新增的"
        ]],
        ["社群详情", [
          "将原来的导师团调整为社群负责导师",
          "查询该社群关联的导师成员进行展示,根据成员的身份的层级关系由上至下展示",
          "「社群负责导师」按创业导师与导师团成员分层展示，包含导师姓名、身份和职责摘要。",
          "第一个导师不限制是否导师长身份,只查询关联导师层级最大的进行展示,如果关联导师不是导师长,则显示其他层级最大的",
          "第一个导师身份若一个层级有多个导师,则顺序竖向展示多个",
          "「所属导师团」展示导师团名称与负责赛道；点击后跳转新的导师团落地页。",
          "「平台保障」固定展示资金透明、资源自主、争议可查三项说明。",
          "底部固定展示「对接社群」按钮；点击后提示对接现有业务流程，不在本 Demo 内执行真实对接。"
        ]],
        ["导师介绍", [
          "点击创业导师或导师团成员，底部弹出导师介绍面板。",
          "导师介绍展示头像、姓名、身份、能力标签和介绍正文。",
          "点击关闭按钮、「我知道了」、遮罩空白区域或按 Esc 均可关闭导师介绍面板。",
          "「查看全部成员」当前仅作为信息提示展示，不提供点击交互。"
        ]],
        ["操作与边界", [
          "机构、社群、导师和导师团信息均为只读，用户不能在本需求页面新增、编辑或删除资料。",
          "本 Demo 只覆盖有数据的完整示例，不演示加载失败、接口异常、缺失数据和空数据场景。",
          "Demo 不调用真实接口、不登录、不校验权限、不持久化；页签、展开、弹层和页面切换只作用于当前页面。",
          "导师团详情、真实社群对接及外部业务流程不在本需求范围内，仅保留跳转说明。"
        ]]
      ]
    };
    var ruleBtn = document.getElementById("ruleBtn");
    var editingRules = false;
    var ruleBase = null;
    var ruleEditor = document.getElementById("ruleEditor");
    var editStatus = document.getElementById("ruleEditStatus");

    function escapeRule(text) {
      return text.replace(/[&<>"']/g, function (c) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
      });
    }
    function ruleMarkup(groups) {
      return groups.map(function (group) {
        return '<section class="rule-section"><h3>' + escapeRule(group[0]) +
          '</h3><div class="rule-content"><ul>' +
          group[1].map(function (line) { return '<li>' + escapeRule(line) + '</li>'; }).join("") +
          '</ul></div></section>';
      }).join("");
    }
    function renderRules() {
      var markup = ruleMarkup(frontendRules.user);
      document.getElementById("contextRules").innerHTML = markup;
      document.getElementById("drawerRules").innerHTML = markup;
    }
    function editingState(active) {
      editingRules = active;
      ruleEditor.hidden = !active;
      document.getElementById("contextRules").hidden = active;
      document.getElementById("editRules").hidden = active;
      document.getElementById("saveRules").hidden = !active;
      document.getElementById("cancelRules").hidden = !active;
    }
    function setRule(open) {
      document.getElementById("ruleOverlay").classList.toggle("open", open);
      document.getElementById("ruleDrawer").classList.toggle("open", open);
      ruleBtn.classList.toggle("active", open);
      ruleBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }
    document.getElementById("editRules").onclick = function () {
      ruleBase = JSON.parse(JSON.stringify(frontendRules.user));
      ruleEditor.value = ruleBase.map(function (group) {
        return "## " + group[0] + "\n" + group[1].map(function (line) { return "- " + line; }).join("\n");
      }).join("\n\n");
      editingState(true);
      editStatus.textContent = "每个分区以 ## 标题开始，每条规则以 - 开始。";
    };
    document.getElementById("cancelRules").onclick = function () {
      editingState(false);
      editStatus.textContent = "已取消编辑";
    };
    document.getElementById("saveRules").onclick = async function () {
      var groups = [];
      try {
        ruleEditor.value.split("\n").forEach(function (line) {
          line = line.trim();
          if (!line) return;
          if (line.startsWith("## ")) groups.push([line.slice(3).trim(), []]);
          else if (line.startsWith("- ") && groups.length) groups[groups.length - 1][1].push(line.slice(2).trim());
          else throw Error("请使用 ## 分区标题和 - 规则条目");
        });
        if (!groups.length || groups.some(function (group) { return !group[0] || !group[1].length; })) {
          throw Error("每个分区需要标题和至少一条规则");
        }
        this.disabled = true;
        var response = await fetch("/__local/coco004-rules", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({view:"user", groups:groups, base:ruleBase})
        });
        if (!response.ok) {
          var error = await response.json().catch(function () {
            return {error:"保存服务不可用，请用 python3 scripts/preview_server.py 启动预览"};
          });
          throw Error(error.error);
        }
        frontendRules.user = groups;
        renderRules();
        editingState(false);
        editStatus.textContent = "保存成功，已写入项目 frontend-rules.json";
      } catch (error) {
        editStatus.textContent = error.message;
      } finally {
        this.disabled = false;
      }
    };
    document.getElementById("copyDemoCode").onclick = async function () {
      var status = document.getElementById("copyDemoStatus");
      try {
        var response = await fetch("fr-coco-004-opc-agency-detail-mentor-sheet-v2.html");
        if (!response.ok) throw Error();
        await navigator.clipboard.writeText(await response.text());
        status.textContent = "已复制当前 Demo HTML";
      } catch (error) {
        status.textContent = "复制失败，请直接打开 Demo 文件复制。";
      }
    };
    fetch("/__local/coco004-rules")
      .then(function (response) { if (!response.ok) throw Error(); return response.json(); })
      .then(function (data) { if (!editingRules && data.user) { frontendRules = data; renderRules(); } })
      .catch(function () { editStatus.textContent = "规则已内置；如需保存编辑，请用 python3 scripts/preview_server.py 启动预览。"; });
    ruleBtn.onclick = function () { setRule(!document.getElementById("ruleDrawer").classList.contains("open")); };
    document.getElementById("ruleClose").onclick = function () { setRule(false); };
    document.getElementById("ruleOverlay").onclick = function () { setRule(false); };
    document.addEventListener("keydown", function (event) { if (event.key === "Escape") setRule(false); });
    renderRules();
  </script>
</body>
</html>
