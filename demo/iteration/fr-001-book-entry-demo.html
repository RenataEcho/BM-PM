<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FR-001 · 上传稿件</title><link rel="stylesheet" href="fr-001-book-entry.css"><script src="fr-001-book-entry.js" defer></script></head>
<body data-page="mockup" class="mockup-body">
  <main id="product" class="product-page">
    <nav class="breadcrumb">剪辑供稿 / 上传稿件</nav><div class="product-heading"><h1>上传稿件</h1><span id="project-label" class="tag tag-ok"></span></div>
    <ol class="stepper" aria-label="上传步骤"><li class="complete"><span>1</span>项目与投向</li><li id="step-two" class="active" aria-current="step"><span>2</span>填写并选成片</li><li id="step-three"><span>3</span>确认上传</li></ol>
    <section id="form-step" class="product-card"><div class="section-heading"><h2>书籍与成片</h2><p class="muted" id="form-hint">支持按书籍名称或书籍 ID 模糊搜索</p><p class="muted">当前搜索字段更新为所选书籍的值，其他字段只补空。</p></div>
      <form id="book-form" autocomplete="off"><div class="book-grid">
        <div class="form-field search-field"><label for="book-name">书籍名称</label><input class="form-input" id="book-name" name="name" placeholder="输入书籍名称搜索" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="candidates-name" aria-describedby="form-hint"><div id="candidates-name" class="candidates" role="listbox" aria-label="书籍名称搜索结果" hidden></div><span id="loading-name" class="field-status" role="status"></span></div>
        <div class="form-field search-field"><label for="book-id">书籍 ID</label><input class="form-input mono" id="book-id" name="id" placeholder="输入书籍 ID 搜索" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="candidates-id" aria-describedby="form-hint"><div id="candidates-id" class="candidates" role="listbox" aria-label="书籍ID搜索结果" hidden></div><span id="loading-id" class="field-status" role="status"></span></div>
        <div class="form-field"><label for="book-type">书籍类型</label><input class="form-input" id="book-type" name="type" placeholder="可补空或手动填写"><span class="field-status">选后仍可手动修改</span></div>
        <div class="form-field link-field"><label for="book-link">书籍链接</label><input class="form-input mono" id="book-link" name="link" placeholder="填写书籍链接"></div>
      </div><p id="fill-status" class="muted feedback" role="status" aria-live="polite"></p>
      <div class="material-section"><div class="material-notes"><label for="editor-note">剪辑手提醒<textarea id="editor-note" class="form-input" placeholder="可选；提醒运营注意的事项"></textarea></label><label for="publish-note">发布技巧<textarea id="publish-note" class="form-input" placeholder="可选；确认页同步到该书稿件"></textarea></label></div><div class="material-actions"><button type="button" class="btn btn-ghost" id="choose-folder">选择文件夹</button><button type="button" class="btn btn-ghost" id="choose-files">选择文件</button><button type="button" class="btn btn-ghost" id="clear-materials">清空成片</button></div><input type="file" id="material-files" multiple hidden><input type="file" id="material-folder" webkitdirectory multiple hidden><p class="muted">选择要上传的成片素材，可多次追加。本 Demo 仅展示本地文件信息，不上传文件。</p><p class="muted" id="material-count" role="status"></p><div id="material-list" class="material-list"></div></div>
      <div class="product-actions"><span class="muted" id="check-hint"></span><button type="submit" id="next" class="btn btn-primary">下一步</button></div></form>
    </section>
    <section id="submit-step" class="product-card" hidden><span class="tag tag-ok">已进入第三步</span><h2>确认上传</h2><p class="muted">以下为本次填写的书籍信息。</p><dl class="drawer-meta" id="submit-summary"></dl><div id="material-summary" class="material-list"></div><div class="product-actions"><button class="btn btn-ghost" id="back">返回第二步</button><button class="btn btn-primary" id="final-submit">开始上传</button></div><p id="submit-feedback" role="status" class="feedback"></p></section>
    <p class="product-footnote">示例数据演示 · 比较前去掉首尾空格，协议 / query / 尾斜杠 / 大小写仍严格匹配 · 名称是否额外参与匹配 [待确认]</p>
  </main>
  <div class="modal-overlay" id="validation-overlay" hidden><section class="modal modal-md" role="dialog" aria-modal="true" aria-labelledby="validation-title" aria-describedby="validation-message" tabindex="-1"><div class="modal-header"><h3 id="validation-title"></h3></div><div class="modal-body"><p id="validation-message"></p><p id="validation-note" class="muted"></p></div><footer class="modal-footer" id="validation-actions"></footer></section></div>
<div class="modal-overlay" id="material-confirm" hidden><section class="modal modal-md" role="dialog" aria-modal="true" aria-labelledby="material-confirm-title" tabindex="-1"><div class="modal-header"><h3 id="material-confirm-title">确认清空成片？</h3></div><div class="modal-body"><p>清空后可重新选择成片素材，不会删除本地文件。</p></div><footer class="modal-footer"><button type="button" class="btn btn-ghost" id="material-cancel">取消</button><button type="button" class="btn btn-primary" id="material-clear-confirm">确认清空</button></footer></section></div></body></html>
