      }
      if (act === 'stat-point') { S.statPoint = Number(node.dataset.val); paint(); return; }
      if (act === 'open-freeze') { S.freezeOpen = true; S.incMenu = ''; S.timeFor = ''; paint(); return; }
      if (act === 'close-freeze') { S.freezeOpen = false; paint(); return; }
      if (act === 'toggle-bill') {
        S.billMenu = S.billMenu === node.dataset.menu ? '' : node.dataset.menu;
        S.timeFor = '';
        paint();
        return;
      }
      if (act === 'pick-bill') {
        if (node.dataset.menu === 'dir') S.billDir = node.dataset.val || 'all';
        if (node.dataset.menu === 'fund') S.billKind = node.dataset.val || 'all';
        S.billMenu = '';
        paint();
        return;
      }
      if (act === 'open-time') {
        S.timeFor = node.dataset.for || 'income';
        S.incMenu = '';
        S.billMenu = '';
        paint();
        return;
      }
      if (act === 'close-time') { S.timeFor = ''; paint(); return; }
      if (act === 'pick-time') {
        var spec = S.timeFor === 'bills' ? S.billTime : S.incTime;
        spec.mode = node.dataset.mode || 'all';
        if (spec.mode !== 'custom') S.timeFor = '';
        paint();
        return;
      }
      if (act === 'hist-inc-tab') { S.histIncTab = node.dataset.tab || 'project'; paint(); return; }
      if (act === 'hist-wd-tab') { S.histWdTab = node.dataset.tab || 'project'; paint(); return; }
      if (act === 'apply-time') {
        var from = document.getElementById('timeFrom');
        var to = document.getElementById('timeTo');
        var specTime = S.timeFor === 'bills' ? S.billTime : S.incTime;
        specTime.from = from ? from.value : '';
        specTime.to = to ? to.value : '';
        specTime.mode = 'custom';
        S.timeOpen = false;
        S.timeFor = '';
        S.incMenu = '';
        paint();
        return;
      }
      if (act === 'toggle-acct') {
        if (S.screen === 'coin') S.coinAmt = readNum('coinAmt');
        if (S.screen === 'withdraw') S.wdAmt = readNum('wdAmt');
        if (S.screen === 'history') readPockets();
        S.acctOpen = !S.acctOpen;
        paint();
        return;
      }
      if (act === 'pick') {
        if (S.screen === 'history') readPockets();
        if (S.screen === 'withdraw') S.wdAmt = readNum('wdAmt');
        if (S.screen === 'coin') S.coinAmt = readNum('coinAmt');
        S[node.dataset.field || 'pick'] = node.dataset.pick;
        S.acctOpen = false;
        paint();
        return;
      }
      if (act === 'coin-all') { S.coinAmt = S.withdrawable; paint(); return; }
      if (act === 'wd-all') { S.wdAmt = S.coin; paint(); return; }
      if (act === 'pocket-all') {
        readPockets();
        S.tfAmt[node.dataset.pocket] = S.legacy[node.dataset.pocket];
        paint();
        return;
      }
      if (act === 'pick-bank') { S.accountSelected = true; S.wdAmt = readNum('wdAmt'); toast('已选择建设银行'); paint(); return; }
      if (act === 'submit-coin') submitCoin();
      if (act === 'submit-wd') submitWithdraw();
      if (act === 'submit-tf') submitTransfer();
      if (act === 'agree-cancel') { S.agreeOn = false; paint(); return; }
      if (act === 'proto') { toast('协议正文由后台配置'); return; }
      if (act === 'agree-ok') {
        if (!S.checked) return;
        S.agreed = true;
        S.agreeOn = false;
        submitTransfer();
      }
    });
    document.getElementById('app').addEventListener('change', function (e) {
      if (e.target.id === 'agreeBox') {
        S.checked = e.target.checked;
        var btn = document.getElementById('agreeOk');
        if (btn) btn.disabled = !S.checked;
      }
    });
    document.getElementById('app').addEventListener('input', function (e) {
      if (e.target.id === 'coinAmt') S.coinAmt = readNum('coinAmt');
      if (e.target.id === 'wdAmt') S.wdAmt = readNum('wdAmt');
      if (e.target.dataset.pocket) readPockets();
    });
    var SCENES = [
      { id: 'home', label: '钱包首页' },
      { id: 'income', label: '总收入' },
      { id: 'detail', label: '收益明细' },
      { id: 'cards', label: '明细卡片' },
      { id: 'bills', label: '账单明细' },
      { id: 'accounts', label: '提现账户' },
      { id: 'coin', label: '划转' },
      { id: 'history', label: '历史划转' },
      { id: 'books', label: '账本对照' }
    ];
    document.getElementById('sceneNav').innerHTML = SCENES.map(function (s) {
      return '<button type="button" data-screen="' + s.id + '">' + s.label + '</button>';
    }).join('');
    document.getElementById('sceneNav').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.screen === 'income') S.incomeTitle = '总收入';
      else if (b.dataset.screen === 'detail') S.incomeTitle = '收益明细';
      go(b.dataset.screen);
    });
    var ROLES = [
      { id: 'both', label: '两种收益身份' },
      { id: 'owner', label: '企业主身份' },
      { id: 'share', label: '收益分配身份' },
      { id: 'none', label: '普通用户' }
    ];
    document.getElementById('roleNav').innerHTML = ROLES.map(function (r) {
      return '<button type="button" data-role="' + r.id + '">' + r.label + '</button>';
    }).join('');
    document.getElementById('roleNav').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      S.earnRole = b.dataset.role || 'none';
      if (S.earnRole === 'none') S.freezeOpen = false;
      paint();
    });
    window.addEventListener('message', function (e) {
      if (!e.data) return;
      if (e.data.type === 'coco007' && e.data.screen) {
        if (e.data.screen === 'agree') { S.screen = 'history'; S.agreeOn = true; S.checked = false; paint(); return; }
        if (e.data.screen === 'income') S.incomeTitle = '总收入';
        go(e.data.screen);
        return;
      }
      if (e.data.type !== 'walletTool') return;
      if (e.data.act === 'sim-credit') simCredit();
      if (e.data.act === 'reset') { var screen = S.screen; S = seed(); S.screen = screen; paint(); }
      if (e.data.act === 'open-agree') { S.screen = 'history'; S.agreeOn = true; S.checked = false; paint(); }
    });
    var params = new URLSearchParams(location.search);
    if (params.get('embed') === '1') document.body.classList.add('embed-mode');
    var start = params.get('screen') || 'home';
    if (start === 'agree') { S.screen = 'history'; S.agreeOn = true; }
    else if (start === 'coin-tax') { S.coinTax = true; S.screen = 'coin'; }
    else if (start === 'detail') { S.incomeTitle = '收益明细'; S.screen = 'income'; }
    else if (SCENES.some(function (s) { return s.id === start; })) S.screen = start;
    paint();
  </script>
</body>
</html>
