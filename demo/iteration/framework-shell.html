<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="gate.js?v=2"></script>
  <title>BM-PM</title>
  <style>
    :root {
      --primary: #2563eb; --primary-hover: #1d4ed8; --primary-light: #eff6ff; --primary-border: #bfdbfe;
      --success: #16a34a; --success-bg: #f0fdf4; --warning: #d97706; --warning-bg: #fffbeb;
      --danger: #dc2626; --danger-bg: #fef2f2;
      --surface: #fff; --surface-glass: rgba(255,255,255,0.72);
      --surface-hover: #f8fafc; --border: #e8edf3;
      --text-primary: #18222f; --text-secondary: #4a5568; --text-muted: #9aa5b4;
      --sidebar-w: 240px;
      --topnav-h: 54px;
      --radius-sm: 7px; --radius-lg: 14px;
      --shadow: 0 8px 32px rgba(30,40,80,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px;
      color: var(--text-primary);
      background: linear-gradient(135deg, #e0e7ff 0%, #f0f4f8 40%, #e0f2fe 100%);
      background-attachment: fixed;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      grid-template-rows: var(--topnav-h) minmax(0, 1fr);
      height: 100vh; overflow: hidden;
    }
    .topnav {
      grid-column: 1 / -1; grid-row: 1;
      position: relative; z-index: 2;
      height: var(--topnav-h); overflow: hidden;
      display: flex; align-items: stretch;
      background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 40%, #e0f2fe 100%);
      border-bottom: 1px solid rgba(148,163,196,0.35);
    }
    .topnav-brand {
      display: flex; align-items: center; gap: 10px;
      width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
      padding: 0 18px;
      border-right: 1px solid rgba(148,163,196,0.25);
    }
    .pnav { display: flex; align-items: stretch; flex: 1; min-width: 0; overflow-x: auto; }
    .pnav-item {
      position: relative; height: 100%; padding: 0 22px;
      border: none; background: transparent; cursor: pointer;
      font-family: inherit; font-size: 15px; font-weight: 600; letter-spacing: 0.01em;
      color: #3b4d6b; white-space: nowrap;
    }
    .pnav-item:hover { background: rgba(99,102,241,0.09); color: #1e3a8a; }
    .pnav-item.active { color: #1e3a8a; font-weight: 700; background: rgba(99,102,241,0.13); }
    .pnav-item.active::after {
      content: ''; position: absolute; bottom: 0; left: 14px; right: 14px;
      height: 3px; border-radius: 3px 3px 0 0; background: #4f46e5;
    }
    .shell { display: contents; }
    .sidebar {
      grid-column: 1; grid-row: 2;
      position: relative; z-index: 1;
      min-height: 0; overflow: hidden;
      display: flex; flex-direction: column;
      background: #eef2fb;
      border-right: 1px solid #d3dce8;
    }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .brand-text { font-size: 14px; font-weight: 700; }
    .brand-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 0 16px; }
    .nav-group-label { padding: 12px 16px 6px; font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .nav-item {
      position: relative; display: flex; align-items: center; height: 40px;
      padding: 0 12px 0 14px; margin: 1px 8px; width: calc(100% - 16px);
      border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--text-secondary);
      text-decoration: none; transition: all 0.18s;
    }
    .nav-item:hover { background: rgba(99,102,241,0.06); color: var(--text-primary); }
    .nav-item.active { color: var(--primary); background: rgba(37,99,235,0.12); font-weight: 600; }
    .nav-item.active::before {
      content: ''; position: absolute; left: 0; top: 7px; bottom: 7px;
      width: 3px; border-radius: 0 2px 2px 0; background: var(--primary);
    }
    .sidebar-foot { padding: 10px 14px 14px; border-top: 1px solid rgba(148,163,196,0.22); font-size: 11px; color: var(--text-muted); line-height: 1.5; }
    .main {
      grid-column: 2; grid-row: 2;
      position: relative; z-index: 0;
      min-width: 0; min-height: 0; overflow: auto;
      padding: 16px 24px 48px;
    }
    .breadcrumb { padding: 4px 0 12px; font-size: 12px; color: var(--text-muted); }
    .page-header { margin-bottom: 16px; }
    .page-header h1 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
    .page-desc { font-size: 12px; color: var(--text-muted); max-width: 820px; line-height: 1.55; }
    .spec-body .page-desc { margin-top: 12px; }
    .glass-card {
      background: var(--surface-glass); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.55); border-radius: var(--radius-lg);
      box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px;
    }
    .spec-section-head { padding: 14px 18px; border-bottom: 1px solid var(--border); }
    .spec-section-head h2 { font-size: 15px; font-weight: 700; }
    .spec-section-head p { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
    .spec-body { padding: 16px 18px 20px; }
    .mini-table { width: 100%; border-collapse: collapse; }
    .mini-table th, .mini-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 12px; }
    .mini-table th { font-size: 11px; font-weight: 600; color: var(--text-muted); background: rgba(248,250,252,0.9); }
    .mini-table tr:hover td { background: var(--surface-hover); }
    .link { color: var(--primary); font-size: 12px; font-weight: 500; text-decoration: none; }
    .link:hover { color: var(--primary-hover); text-decoration: underline; }
    .tag { display: inline-flex; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .tag-ok { background: var(--success-bg); color: var(--success); }
    .tag-warn { background: var(--warning-bg); color: var(--warning); }
    .tag-del { background: var(--danger-bg); color: var(--danger); }
    #spec-frame { display: block; width: 100%; height: calc(100vh - var(--topnav-h) - 180px); border: 0; background: transparent; }
    .main.show-demo { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
    .main.show-demo > .breadcrumb, .main.show-demo > .page-header { display: none; }
    .main.show-demo #spec-frame { height: 100%; flex: 1; min-height: 0; }
    [hidden] { display: none !important; }
    .nav-item { height: auto; min-height: 40px; overflow-wrap: anywhere; }
    .status-select { border: 0; background: transparent; border-radius: 999px; padding: 2px 8px; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; }
    .status-select.tag-warn { background: var(--warning-bg); color: var(--warning); }
    .status-select.tag-ok { background: var(--success-bg); color: var(--success); }
    .status-select.tag-del { background: var(--danger-bg); color: var(--danger); }
  </style>
</head>
<body>
  <header class="topnav">
    <div class="topnav-brand">
      <div class="brand-icon">迭</div>
      <div>
        <div class="brand-text">BM-PM</div>
        <div class="brand-sub">迭代需求</div>
      </div>
    </div>
    <nav class="pnav" id="biz-nav" aria-label="业务线">
      <button type="button" class="pnav-item" data-line="youbao">右豹主业务</button>
      <button type="button" class="pnav-item" data-line="mentor">导师商务</button>
      <button type="button" class="pnav-item" data-line="enterprise">企业号</button>
    </nav>
  </header>

  <div class="shell">
  <aside class="sidebar">
    <div class="sidebar-scroll" data-iteration-sidebar></div>
    <div class="sidebar-foot">先写明业务线，再做设计。<br />已上线进归档，已暂停进废纸篓。</div>
  </aside>

  <main class="main">
    <nav class="breadcrumb" id="crumb">右豹主业务</nav>
    <header class="page-header">
      <h1 id="page-title">右豹主业务</h1>
      <p class="page-desc">左侧是同一组：概览、组件规范。新需求先写明业务线，再做设计。</p>
    </header>

    <div id="view-overview">
    <section class="glass-card" id="in-progress" aria-labelledby="in-progress-title">
      <div class="spec-section-head">
        <h2 id="in-progress-title">进行中</h2>
        <p>状态写「待开始」或「开发中」。</p>
      </div>
      <div class="spec-body">
        <table class="mini-table">
          <thead>
            <tr><th>编号</th><th>需求</th><th>状态</th><th>页面</th></tr>
          </thead>
          <tbody data-bucket="progress">
<tr data-id="enterprise-employee-management" data-line="enterprise"><td>待分配</td><td>员工管理与双端消息中心</td><td><select class="status-select" aria-label="员工管理与双端消息中心 状态" data-status-select><option value="待开始">待开始</option><option value="开发中" selected>开发中</option><option value="已上线">已上线</option><option value="已暂停">已暂停</option></select></td><td><a class="link" href="https://cicichak00.github.io/Enterprise-Systems/drafts/employee-management/messages.html#all" target="_blank" rel="noopener noreferrer">查看需求</a></td></tr>
<tr data-id="fr-002" data-line="youbao"><td>FR-002</td><td>新增登录设备</td><td><select class="status-select" aria-label="FR-002 状态" data-status-select><option value="待开始" selected>待开始</option><option value="开发中">开发中</option><option value="已上线">已上线</option><option value="已暂停">已暂停</option></select></td><td><a class="link" href="#youbao/fr-002">查看 Demo</a></td></tr>
            <tr data-id="fr-001" data-line="youbao"><td>FR-001</td><td>剪辑手供稿书籍填写优化</td><td><select class="status-select" aria-label="FR-001 状态" data-status-select><option value="待开始">待开始</option><option value="开发中" selected>开发中</option><option value="已上线">已上线</option><option value="已暂停">已暂停</option></select></td><td><a class="link" href="#youbao/fr-001">查看 Demo</a></td></tr>
          </tbody>
        </table>
        <p class="page-desc" data-empty="progress">还没有进行中的需求。</p>
      </div>
    </section>

    <section class="glass-card" id="archive" aria-labelledby="archive-title">
      <div class="spec-section-head">
        <h2 id="archive-title">归档</h2>
        <p>已上线的需求移到这里。</p>
      </div>
      <div class="spec-body">
        <table class="mini-table">
          <thead>
            <tr><th>编号</th><th>需求</th><th>状态</th><th>页面</th></tr>
          </thead>
          <tbody data-bucket="archive"></tbody>
        </table>
        <p class="page-desc" data-empty="archive">还没有已上线的需求。</p>
      </div>
    </section>

    <section class="glass-card" id="trash" aria-labelledby="trash-title">
      <div class="spec-section-head">
        <h2 id="trash-title">废纸篓</h2>
        <p>已暂停的需求移到这里。</p>
      </div>
      <div class="spec-body">
        <table class="mini-table">
          <thead>
            <tr><th>编号</th><th>需求</th><th>状态</th><th>页面</th></tr>
          </thead>
          <tbody data-bucket="trash"></tbody>
        </table>
        <p class="page-desc" data-empty="trash">还没有已暂停的需求。</p>
      </div>
    </section>
    </div>
    <iframe id="spec-frame" title="组件规范" hidden src="about:blank"></iframe>
  </main>
  </div>
  <script src="sidebar-nav.js?v=fr002-rules-3"></script>
  <script>
    var EMPTY_TEXT = {
      progress: '还没有进行中的需求。',
      archive: '还没有已上线的需求。',
      trash: '还没有已暂停的需求。'
    };

    var STATUS_BUCKET = { '待开始': 'progress', '开发中': 'progress', '已上线': 'archive', '已暂停': 'trash' };
    var STATUS_CLASS = { '待开始': 'tag-warn', '开发中': 'tag-warn', '已上线': 'tag-ok', '已暂停': 'tag-del' };
    var STATUS_KEY = 'bm-pm-fr-statuses';
    function readStatuses() {
      try { return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}'); } catch (e) { return {}; }
    }
    function writeStatuses(statuses) { localStorage.setItem(STATUS_KEY, JSON.stringify(statuses)); }
    function applyStatuses() {
      var statuses = readStatuses();
      document.querySelectorAll('[data-status-select]').forEach(function (select) {
        var row = select.closest('tr');
        var status = statuses[row.getAttribute('data-id')] || select.value || '开发中';
        select.value = status;
        statuses[row.getAttribute('data-id')] = status;
        var bucket = document.querySelector('[data-bucket="' + STATUS_BUCKET[status] + '"]');
        if (bucket) bucket.appendChild(row);
      });
      writeStatuses(statuses);
      document.querySelectorAll('[data-status-select]').forEach(function (select) {
        select.className = 'status-select ' + STATUS_CLASS[select.value];
      });
    }

    function applyShellView() {
      var state = window.bmParseHash();
      var lineName = window.bmLineName(state.line);
      document.querySelectorAll('#biz-nav button').forEach(function (btn) {
        var on = btn.getAttribute('data-line') === state.line;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      document.getElementById('crumb').textContent = lineName;
      document.getElementById('page-title').textContent = lineName;
      document.title = lineName + ' · BM-PM';
      document.getElementById('view-overview').hidden = state.view !== 'overview';
      var demo = window.bmDemoFor(state.line, state.view);
      document.querySelector('.main').classList.toggle('show-demo', !!demo);
      var frame = document.getElementById('spec-frame');
      frame.hidden = state.view === 'overview';
      var source = demo ? demo.url : 'component-spec-demo.html?embed=1';
      frame.title = demo ? demo.id.toUpperCase() + ' · ' + demo.label : '组件规范';
      if (!frame.hidden && frame.getAttribute('src') !== source) frame.src = source;
      document.querySelectorAll('#view-overview tbody').forEach(function (tbody) {
        var visible = 0;
        tbody.querySelectorAll('tr').forEach(function (row) {
          var show = row.getAttribute('data-line') === state.line;
          row.hidden = !show;
          if (show) visible += 1;
        });
        var note = tbody.closest('.spec-body').querySelector('[data-empty]');
        if (!note) return;
        note.hidden = visible > 0;
        note.textContent = lineName + EMPTY_TEXT[note.getAttribute('data-empty')];
      });
      applyStatuses();
    }

    document.getElementById('biz-nav').addEventListener('click', function (event) {
      var btn = event.target.closest('button[data-line]');
      if (!btn) return;
      var state = window.bmParseHash();
      location.hash = btn.getAttribute('data-line') + '/' + (window.bmDemoFor(state.line, state.view) ? 'overview' : state.view);
    });

    document.addEventListener('click', function (event) {
      var link = event.target.closest('a[href^="#youbao/"], a[href^="#mentor/"], a[href^="#enterprise/"]');
      if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      var target = link.getAttribute('href');
      if (location.hash !== target) history.pushState(null, '', target);
      window.dispatchEvent(new Event('hashchange'));
    });
    document.addEventListener('change', function (event) {
      var select = event.target.closest('[data-status-select]');
      if (!select) return;
      var row = select.closest('tr');
      var statuses = readStatuses();
      statuses[row.getAttribute('data-id')] = select.value;
      writeStatuses(statuses);
      applyShellView();
      window.dispatchEvent(new Event('hashchange'));
    });
    window.addEventListener('storage', function (event) { if (event.key === STATUS_KEY || event.key === null) applyShellView(); });
    window.addEventListener('popstate', applyShellView);
    window.addEventListener('hashchange', applyShellView);
    if (!location.hash) location.hash = 'youbao/overview';
    else applyShellView();
  </script>
</body>
</html>\n
